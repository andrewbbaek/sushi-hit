<style>
:root{
  /* 한 화면 낚시터: 캔버스가 낮 바다, 위에 HUD, 아래에 던지기 버튼과 탭 다섯 개 */
  --sky:#8fd3f6; --sea:#2f8fc4; --deep:#16527c; --wood:#b98954;
  --ink:#17324a; --foam:#f4fbff; --float:#e9463c; --gold:#f2b632;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--deep);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--sea);user-select:none;-webkit-user-select:none}
canvas#sea{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:10px 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chip{pointer-events:auto;background:rgba(244,251,255,.92);border-radius:999px;padding:6px 12px;font-family:var(--display);font-size:17px;box-shadow:0 2px 0 rgba(23,50,74,.18);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chip small{font-family:var(--body);font-size:11px;opacity:.7}
.rods{display:flex;gap:6px;pointer-events:auto}
.rods button{font-family:var(--display);font-size:14px;border:0;border-radius:999px;padding:7px 12px;background:rgba(244,251,255,.6);color:var(--ink);box-shadow:0 2px 0 rgba(23,50,74,.15)}
.rods button[aria-pressed="true"]{background:var(--ink);color:var(--foam)}
.test{pointer-events:auto;font-size:12px;background:rgba(23,50,74,.55);color:var(--foam);border-radius:10px;padding:4px 8px;display:flex;gap:6px;align-items:center}
.test select{font-size:12px;border:0;border-radius:6px;padding:3px 4px;background:var(--foam);color:var(--ink)}
#toast{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);font-family:var(--display);font-size:26px;color:var(--foam);text-shadow:0 2px 0 rgba(23,50,74,.55),0 0 12px rgba(23,50,74,.35);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
#hint{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-size:13px;color:var(--foam);text-shadow:0 1px 0 rgba(23,50,74,.6);pointer-events:none;padding:0 16px}
#castBtn{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);font-family:var(--display);font-size:22px;border:0;border-radius:999px;padding:14px 44px;background:var(--float);color:#fff;box-shadow:0 5px 0 #a82a22,0 8px 16px rgba(23,50,74,.35)}
#castBtn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #a82a22}
#castBtn[hidden]{display:none}
#castBtn:focus-visible,.rods button:focus-visible,nav button:focus-visible,.card button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav{position:absolute;left:0;right:0;bottom:0;height:62px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--foam);border-top:3px solid var(--ink)}
nav button{border:0;background:none;font-family:var(--display);font-size:14px;color:rgba(23,50,74,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
nav button.center{color:var(--foam);background:var(--ink);border-radius:16px 16px 0 0;margin-top:-10px}
.sheet{position:absolute;inset:0;background:rgba(22,82,124,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet[hidden]{display:none}
.card{width:100%;max-width:340px;background:var(--foam);border-radius:22px;border:3px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 10px 0 rgba(23,50,74,.35)}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;text-wrap:balance;text-align:center}
.tier{font-family:var(--display);font-size:14px;color:#fff;border-radius:999px;padding:3px 12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%}
.stats div{background:#e3f1fa;border-radius:12px;padding:8px 4px;text-align:center;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}

  background:linear-gradient(135deg,#ffd24a,#ff8a3c 55%,#ff5a5a);border:4px solid #fff;box-shadow:0 6px 0 #b8431f,0 14px 30px rgba(23,50,74,.45)}

#tideBanner::before,#tideBanner::after{content:"✦";position:absolute;color:#fff;font-size:26px;text-shadow:0 0 8px #ffe9a0}
#tideBanner::before{left:-12px;top:-16px}#tideBanner::after{right:-10px;bottom:-14px;font-size:20px}
#tideBanner.go{animation:tideIn 3.2s cubic-bezier(.2,1.4,.4,1) both}

@keyframes tideIn{0%{transform:translate(-50%,-50%) rotate(-14deg) scale(.2);opacity:0}9%{transform:translate(-50%,-50%) rotate(-2deg) scale(1.12);opacity:1}14%{transform:translate(-50%,-50%) rotate(-5deg) scale(1)}
  20%{transform:translate(-50%,-54%) rotate(-3deg) scale(1.03)}26%{transform:translate(-50%,-50%) rotate(-4deg) scale(1)}88%{transform:translate(-50%,-50%) rotate(-4deg) scale(1);opacity:1}100%{transform:translate(-50%,-90%) rotate(-4deg) scale(.9);opacity:0}}
@keyframes tw{from{transform:scale(.6) rotate(0)}to{transform:scale(1.25) rotate(25deg)}}
.rods button.run{animation:runGlow 1s ease-in-out infinite alternate}
@keyframes runGlow{from{box-shadow:0 0 0 0 rgba(255,210,74,.0),0 2px 0 rgba(23,50,74,.15)}to{box-shadow:0 0 0 4px rgba(255,210,74,.95),0 2px 0 rgba(23,50,74,.15)}}

.sortrow{display:flex;justify-content:flex-end;gap:5px;margin-top:-22px}
.sortrow button{border:0;border-radius:999px;padding:4px 10px;font-family:var(--display);font-size:12px;background:#e3f1fa;color:var(--ink)}
.sortrow button[aria-pressed=true]{background:var(--ink);color:var(--foam)}
#kHome h3:first-child{justify-content:flex-start;gap:8px}
.inv .grp{grid-column:1/-1;margin:4px 0 -2px;font-family:var(--display);font-size:13px;opacity:.65}

.askbtn{display:flex;gap:8px;width:100%}.askbtn button{flex:1;padding:11px 8px;font-size:17px}
#askNo{background:#d7e6f0;color:var(--ink)}
.sortrow button{display:flex;align-items:center;gap:3px}.sortrow svg{width:9px;height:9px}.sortrow svg.up{transform:rotate(180deg)}

/* ---------- 숍: 항구 낚시가게 느낌 (천막, 나무, 크라프트지, 가격표) ---------- */
#store{background:#f3e2bd;color:#3b2410;--acc:#e07b2a}
#store[data-tab="1"]{--acc:#2f86c0}#store[data-tab="2"]{--acc:#7a4fc0}#store[data-tab="gear"]{--acc:#2e6b4f}
#store header{position:relative;z-index:2;border:0;padding:12px 14px 12px;background:repeating-linear-gradient(90deg,#d8452f 0 28px,#fff3dc 28px 56px);box-shadow:inset 0 -5px 0 rgba(74,47,23,.14)}
#store header::after{content:'';position:absolute;left:0;right:0;top:100%;height:14px;background:inherit;box-shadow:none;-webkit-mask:radial-gradient(circle at 14px 0,#000 13.4px,transparent 14px) 0 0/28px 14px repeat-x;mask:radial-gradient(circle at 14px 0,#000 13.4px,transparent 14px) 0 0/28px 14px repeat-x;filter:drop-shadow(0 2px 0 rgba(74,47,23,.25))}
#store header h2{background:linear-gradient(#c89a5e,#a2703a);color:#fff6dc;padding:3px 18px 4px;border:2.5px solid #4a2f17;border-radius:10px;box-shadow:0 3px 0 #4a2f17;transform:rotate(-2deg);text-shadow:0 2px 0 rgba(74,47,23,.7)}
#store header .chip{background:linear-gradient(#ffe69a,#f2b632);color:#3b2410;border:2.5px solid #4a2f17;box-shadow:0 3px 0 #4a2f17;padding:5px 12px}
#tTabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:24px 10px 0;position:relative;z-index:1}
#tTabs button{border:2.5px solid #4a2f17;border-bottom:0;border-radius:12px 12px 0 0;padding:8px 2px 9px;font-family:var(--display);font-size:15px;color:#fff6dc;background:linear-gradient(#c89a5e,#a2703a);text-shadow:0 1.5px 0 rgba(74,47,23,.7);display:flex;align-items:center;justify-content:center;gap:3px}
#tTabs button[aria-selected=true]{background:#fff8e6;color:#3b2410;text-shadow:none;margin-bottom:-2.5px;padding-bottom:11.5px;box-shadow:inset 0 4px 0 var(--acc)}
#tTabs button.lock{background:#bdb7ab;color:#6b665d;border-color:#6b665d;text-shadow:none}
#tTabs button.lock[aria-selected=true]{background:#e4dfd3;box-shadow:inset 0 4px 0 #8d877c;border-color:#4a2f17}
#tTabs svg{width:13px;height:13px;stroke-width:2.6}
#store .scr{border-top:2.5px solid #4a2f17;background:#fff8e6;gap:9px;padding:12px 12px 26px}
#store .scr h3{font-size:17px;color:#3b2410;margin:6px 2px 0}
#store .scr h3 small{color:#6b5236;opacity:1}
.item{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;background:#fffdf6;border:2px solid #4a2f17;border-radius:14px;padding:8px 10px 9px 8px;box-shadow:0 3px 0 #4a2f17}
.item .ico{width:46px;height:46px;border-radius:12px;background:var(--acc);color:#fff;border:2px solid #4a2f17;display:grid;place-items:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.28)}
.item .ico svg{width:27px;height:27px}
.item .ico.pic{background:#f3e2bd;overflow:hidden}.item .ico.pic canvas{width:42px;height:42px}
.item .tx b{font-family:var(--display);font-weight:400;font-size:16px;margin-right:6px}
.item .tx i{display:block;font-style:normal;font-size:11.5px;color:#6b5236;line-height:1.35;font-variant-numeric:tabular-nums}
.rv{display:inline-flex;gap:3px;vertical-align:middle}.rv s{width:8px;height:8px;border-radius:50%;border:1.5px solid #4a2f17;background:#fff8e6}.rv s.on{background:#f2b632}
.tag{position:relative;border:2px solid #4a2f17;border-radius:7px 11px 11px 7px;padding:8px 10px 8px 21px;font-family:var(--display);font-size:15px;color:#3b2410;background:linear-gradient(#ffe69a,#f2b632);box-shadow:0 3px 0 #4a2f17;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag::before{content:'';position:absolute;left:7px;top:50%;width:7px;height:7px;margin-top:-4.5px;border-radius:50%;background:#fff8e6;border:1.5px solid #4a2f17}
.tag[disabled]{background:#e2d8c2;color:#9a8d76;border-color:#9a8d76;box-shadow:0 3px 0 #9a8d76}.tag[disabled]::before{border-color:#9a8d76}
.tag:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 #4a2f17}
.stamp{font-family:var(--display);font-size:14px;color:#c0392b;border:2.5px solid #c0392b;border-radius:8px;padding:2px 9px;transform:rotate(-7deg);opacity:.85;margin-right:4px}
.item.off{filter:grayscale(1);opacity:.5;box-shadow:0 3px 0 #8d877c;border-color:#8d877c}
.unlock{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#fffdf6;border:2.5px dashed #4a2f17;border-radius:16px;padding:16px 12px 18px;margin-bottom:4px}
.unlock .ico.big{width:64px;height:64px;border-radius:18px;background:var(--acc);color:#fff;border:2.5px solid #4a2f17;display:grid;place-items:center;box-shadow:inset 0 4px 0 rgba(255,255,255,.28)}
.unlock .ico.big svg{width:38px;height:38px}
.unlock b{font-family:var(--display);font-weight:400;font-size:21px}.unlock i{font-style:normal;font-size:13px;color:#6b5236}
.tag.big{font-size:19px;padding:10px 16px 10px 28px;margin-top:6px}.tag.big::before{left:10px;width:9px;height:9px;margin-top:-5.5px}
#store #knifeCv{border:2px solid #4a2f17;background:#f3e2bd;box-shadow:0 3px 0 #4a2f17}

/* ---------- 도감: 가죽 표지, 양피지 쪽, 색인표 ---------- */
#book{--lea:#6a2c27;--lea2:#4c1d1a;--gold:#e9c877;--pap:#f6ebd0;--pink:#3b2a1a;--serif:'AppleMyungjo','Nanum Myeongjo','Batang','Noto Serif KR',serif;
  background:radial-gradient(120% 80% at 50% 0,#7c3731,var(--lea) 45%,var(--lea2));color:var(--pink)}
#book .inner{padding:0 9px 10px;position:relative;min-height:0}
#book .inner::before{content:'';position:absolute;inset:5px;border:1.5px dashed rgba(233,200,119,.55);border-radius:12px;pointer-events:none}
#book header{border:0;padding:14px 10px 10px;position:relative;z-index:1}
#book h2{color:var(--gold);font-size:25px;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.45),0 -1px 0 rgba(255,240,200,.25);display:flex;align-items:baseline;gap:10px}
#book h2 small{font-family:var(--serif);font-size:14px;letter-spacing:0;color:#f3deb0;border:1px solid rgba(233,200,119,.7);border-radius:999px;padding:1px 10px;text-shadow:none}
#book header button{background:linear-gradient(#f0d48c,#c9a14c);color:#3b2410;border:2px solid #2e110f;box-shadow:0 3px 0 #2e110f;padding:6px 15px}
#bookTabs{flex:none;display:flex;gap:5px;padding:0 14px;position:relative;z-index:1;align-items:flex-end}
#bookTabs button{flex:1;border:2px solid #2e110f;border-bottom:0;border-radius:10px 10px 0 0;padding:6px 4px 7px;font-family:var(--display);font-size:15px;color:#fff;display:flex;justify-content:center;align-items:baseline;gap:6px;text-shadow:0 1.5px 0 rgba(0,0,0,.35);filter:saturate(.75) brightness(.82)}
#bookTabs button small{font-family:var(--serif);font-size:11px;opacity:.9}
#bookTabs .b0{background:#e07b2a}#bookTabs .b1{background:#2f86c0}#bookTabs .b2{background:#7a4fc0}
#bookTabs button[aria-selected=true]{filter:none;padding-top:10px;margin-bottom:-2px}
#book .page{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;border:2px solid #2e110f;border-radius:6px 12px 12px 6px;
  background:linear-gradient(90deg,rgba(74,47,23,.28),rgba(74,47,23,0) 18px,rgba(74,47,23,0) calc(100% - 8px),rgba(74,47,23,.12)),repeating-linear-gradient(0deg,rgba(120,90,50,0) 0 27px,rgba(120,90,50,.07) 27px 28px),var(--pap);
  box-shadow:inset 0 0 26px rgba(120,84,40,.22),3px 0 0 #e9dcbb,5px 0 0 #2e110f,6px 3px 0 #d9c9a3;transform-origin:left center}
#book .page.flip{animation:pageFlip .38s ease-out}
@keyframes pageFlip{from{transform:perspective(900px) rotateY(-22deg);opacity:.35}}
#grid{overflow:visible;padding:12px 12px 6px 22px;gap:12px 10px}
#grid h3{font-size:19px;text-align:center;margin:2px 0 0;padding-bottom:7px;border-bottom:1.5px solid rgba(59,42,26,.55);position:relative}
#grid h3::after{content:'';position:absolute;left:0;right:0;bottom:-5px;border-bottom:.8px solid rgba(59,42,26,.4)}
#book .cell{background:none;border-radius:0;padding:0 0 4px;gap:2px;position:relative}
#book .cell canvas{height:88px;background:#fbf4e1;border:1.3px solid rgba(59,42,26,.75);border-radius:3px;box-shadow:2px 3px 0 rgba(59,42,26,.14)}
#book .cell .no{position:absolute;left:5px;top:3px;font-family:var(--serif);font-size:10px;color:rgba(59,42,26,.7);background:none;padding:0;font-style:italic}
#book .cell b{font-size:16px;margin-top:3px}
#book .cell .seal{font-size:10.5px;padding:1px 9px;border-radius:999px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
#book .cell i{font-family:var(--serif);font-size:11.5px;opacity:.8;font-style:italic}
#book .cell em{top:auto;bottom:auto;right:4px;top:4px;background:#3b2a1a;color:#f6ebd0;font-size:10px}
#book .cell.no canvas{border-style:dashed;background:rgba(251,244,225,.5);box-shadow:none}
#book .cell.no .seal{filter:grayscale(.6);opacity:.6}
#bookFoot{text-align:center;font-family:var(--serif);font-size:12px;color:rgba(59,42,26,.6);padding:8px 0 12px 10px}
/* 도감 상세: 책에서 뜯어낸 한 쪽 */
#bkSheet .card{background:#f6ebd0;border-color:#3b2a1a;color:#3b2a1a;box-shadow:0 10px 0 rgba(46,17,15,.5),inset 0 0 24px rgba(120,84,40,.2)}
#bkSheet h2{border-bottom:1.5px solid rgba(59,42,26,.55);padding:0 14px 6px}
#bkSheet .x{background:#3b2a1a;color:#f6ebd0}
#bkCv{background:#fbf4e1;border:1.3px solid rgba(59,42,26,.75);border-radius:4px}
#bkParts div{background:none;border-radius:0;border-bottom:1px dashed rgba(59,42,26,.4);padding:5px 4px}
#bkParts span{font-family:'AppleMyungjo','Nanum Myeongjo','Batang',serif;font-style:italic;opacity:.8}
#bkSheet{background:rgba(46,17,15,.74)}

/* ---------- 주방: 초밥집 주방 (쪽빛 노렌, 편백 조리대, 얼음 상자, 나무 받침) ---------- */
#kitchen{--ind:#22335a;--wd:#5a3a1e;--hin:#f0dcae;--ver:#d8452f;color:#3b2410;
  background:repeating-linear-gradient(90deg,rgba(120,84,40,0) 0 71px,rgba(120,84,40,.13) 71px 72px),linear-gradient(#f4e3bb,#ecd5a2)}
#kitchen header{position:relative;z-index:2;border:0;background:var(--ind);padding:11px 14px 9px;box-shadow:inset 0 5px 0 #3a2413,inset 0 7px 0 rgba(255,255,255,.12)}
#kitchen header::after{content:'';position:absolute;left:0;right:0;top:100%;height:17px;background:repeating-linear-gradient(90deg,var(--ind) 0 calc(25% - 4px),transparent calc(25% - 4px) 25%);border-radius:0 0 6px 6px;filter:drop-shadow(0 2px 0 rgba(59,36,16,.3))}
#kitchen header h2{color:#fff8e6;width:44px;height:44px;border:2.5px solid #fff8e6;border-radius:50%;display:grid;place-items:center;font-size:17px;letter-spacing:-.5px}
#kitchen header .chip{background:#fff8e6;color:#3b2410;border:2.5px solid #3a2413;box-shadow:0 3px 0 #3a2413;padding:5px 12px}
#kitchen #kHome{padding:12px 12px 26px;gap:9px;border-top:2.5px solid var(--wd);background:rgba(255,248,230,.55)}
#kitchen #kHome h3{font-size:17px;margin:8px 2px 0;padding-left:9px;border-left:5px solid var(--ver);align-items:center}
#kitchen #kHome h3 small{opacity:1;color:#6b5236}
#kitchen .empty{opacity:1;color:#6b5236;border:2px dashed rgba(90,58,30,.5);border-radius:12px;padding:12px;text-align:center;background:rgba(255,248,230,.5)}
#kitchen .sortrow button{background:#fff8e6;color:#3b2410;border:1.8px solid var(--wd);padding:3px 9px}
#kitchen .sortrow button[aria-pressed=true]{background:var(--ind);color:#fff8e6;border-color:#101a33}
/* 보관함 = 얼음 상자 */
#kitchen .inv{background:linear-gradient(#d3eaf2,#bcdbe7);border:2.5px solid var(--wd);border-radius:14px;padding:8px;box-shadow:0 3px 0 var(--wd),inset 0 0 0 3px rgba(255,255,255,.55)}
#kitchen .inv button{background:linear-gradient(#ffffff,#eaf5f9);border:1.8px solid #7fa9ba;border-radius:10px;color:#22335a;box-shadow:0 2px 0 #7fa9ba}
#kitchen .inv .grp{color:#22335a;opacity:.85}
#kitchen .inv u{border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(34,51,90,.4)}
/* 버튼 */
#kitchen .act{background:var(--ver);color:#fff8e6;border:2px solid #7c2114;box-shadow:0 3px 0 #7c2114;padding:8px 18px}
#kitchen .act[disabled]{opacity:1;background:#d9cdb4;color:#9a8d76;border-color:#9a8d76;box-shadow:0 3px 0 #9a8d76}
#kitchen .pills button{background:#fff8e6;border:2px solid var(--wd);box-shadow:0 2px 0 var(--wd);color:#3b2410}
#kitchen .pills button[aria-pressed=true]{background:#ffe69a;border-color:#3a2413}
/* 초밥 = 나무 받침 위 */
#kitchen .srow,#eatSheet .srow{background:#fffdf6;border:2px solid var(--wd);border-radius:12px;box-shadow:0 3px 0 var(--wd);padding:6px 8px;color:#3b2410}
#kitchen .srow canvas,#eatSheet .srow canvas{background:linear-gradient(#e9cf9d,#d8b577);border-radius:8px;border:1.5px solid var(--wd)}
#kitchen .srow button,#eatSheet .srow button{background:var(--ind);color:#fff8e6;border:2px solid #101a33;box-shadow:0 2px 0 #101a33}
#kitchen .urow{background:#fffdf6;border:2px solid var(--wd);border-radius:12px;box-shadow:0 3px 0 var(--wd)}
#kitchen .urow i{opacity:1;color:#6b5236}
#kitchen .urow button{background:var(--ind);color:#fff8e6;border:2px solid #101a33;box-shadow:0 2px 0 #101a33}
#kitchen .urow button[disabled]{opacity:1;background:#d9cdb4;color:#9a8d76;border-color:#9a8d76;box-shadow:0 2px 0 #9a8d76}
/* 손질 화면 */
#kitchen #kWork{padding-top:18px}
#kitchen .wbar b{font-size:19px}#kitchen .wbar span{opacity:1;color:#6b5236}
#kitchen #wCv{border-top:2.5px solid var(--wd);border-bottom:2.5px solid var(--wd)}
#kitchen .wbtn button{background:#fff8e6;color:#3b2410;border:2px solid var(--wd);box-shadow:0 3px 0 var(--wd)}
#kitchen .wbtn button.pri{background:var(--ver);color:#fff8e6;border-color:#7c2114;box-shadow:0 3px 0 #7c2114}
#kitchen .wbtn button[disabled]{opacity:1;background:#d9cdb4;color:#9a8d76;border-color:#9a8d76;box-shadow:0 3px 0 #9a8d76}
/* 주방에서 뜨는 창 */
#fishSheet,#eatSheet,#askSheet{background:rgba(46,29,14,.72)}
#fishSheet .card,#eatSheet .card,#askSheet .card{background:#fff8e6;border-color:#3a2413;color:#3b2410;box-shadow:0 10px 0 rgba(46,29,14,.55)}
#fishSheet .stats div{background:#f0dcae}
#fishSheet #fsArt{background:linear-gradient(#d3eaf2,#bcdbe7);border:2px solid #5a3a1e;border-radius:12px}
#fishSheet .card button,#eatSheet .card>button,#askSheet #askYes{background:#d8452f;color:#fff8e6;border:2px solid #7c2114;box-shadow:0 3px 0 #7c2114}
#fishSheet .card .sec,#fishSheet .card .x,#askSheet #askNo{background:#fff8e6;color:#3b2410;border:2px solid #5a3a1e;box-shadow:0 3px 0 #5a3a1e}
#fishSheet .card .x{box-shadow:0 2px 0 #5a3a1e}
/* 주방 칸: 노렌 아래 걸린 나무 패 */
#kTabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:24px 12px 0;position:relative;z-index:1}
#kTabs[hidden]{display:none}
#kTabs button{border:2.5px solid var(--wd);border-bottom:0;border-radius:12px 12px 0 0;padding:7px 2px 8px;font-family:var(--display);font-size:16px;color:#fff6dc;background:linear-gradient(#c89a5e,#a2703a);text-shadow:0 1.5px 0 rgba(74,47,23,.7);display:flex;align-items:baseline;justify-content:center;gap:6px}
#kTabs button small{font-family:var(--body);font-size:11.5px;opacity:.95;font-variant-numeric:tabular-nums}
#kTabs button[aria-selected=true]{background:#fff8e6;color:#3b2410;text-shadow:none;margin-bottom:-2.5px;padding-bottom:10.5px;box-shadow:inset 0 4px 0 var(--ver)}
#kitchen #kHome h3:first-child{margin-top:2px}
#kTabs button s{display:block;width:8px;height:8px;border-radius:50%;background:#d8452f;border:1.5px solid #fff8e6;align-self:center}

/* ---------- 아래 메뉴: 부두 나무판. 지금 있는 칸만 밝게 솟음 ---------- */
nav{background:repeating-linear-gradient(90deg,rgba(74,47,23,0) 0 calc(20% - 1.5px),rgba(74,47,23,.55) calc(20% - 1.5px) 20%),linear-gradient(#c79a5f,#a2703a);border-top:3px solid #4a2f17;box-shadow:inset 0 3px 0 rgba(255,236,196,.35)}
nav button,nav button.center{color:rgba(255,246,220,.82);background:none;border-radius:0;margin-top:0;text-shadow:0 1.5px 0 rgba(74,47,23,.6)}
nav button.on,nav button.on:not(.center),nav button.center.on{color:#3b2410;background:#fff8e6;text-shadow:none;border:2.5px solid #4a2f17;border-bottom:0;border-radius:14px 14px 0 0;margin-top:-11px;box-shadow:inset 0 4px 0 #d8452f}
nav button.on svg{stroke-width:2.3}
#shopDot{border-color:#fff8e6}
/* 아래 메뉴의 솟은 칸이 화면에 가려지지 않게: 메뉴가 전체 화면 칸들보다 위, 뜨는 창보다는 아래 */
.sheet{z-index:4}.sheet.full,#book{z-index:1}nav{z-index:2}
nav button:focus-visible{outline:none}

/* ---------- 가게: 붉은 포장마차 안에서 창구와 유리 진열장을 보는 느낌 ---------- */
#shop{--rd:#b3261e;--rd2:#7a1510;--gd:#e9b44c;--cr:#fff3e0;--sk:#3a1a14;color:var(--sk);

#hud .rods button.run::after{content:"";position:absolute;right:-6px;top:-8px;width:20px;height:14px;z-index:1;filter:drop-shadow(0 1px 0 #4a2f17);

/* ---------- 유틸 ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');

/* ---------- 그림: 물고기 ---------- */
function drawFish(c,L,a,seed){
  const Hh=L*a.ratio, rnd=mulberry(seed);
  const nose=-L*.5, ped=L*.30, end=L*.5, ph=Hh*.11;
  const dark=mix(a.back,'#000000',.35);
  const body=()=>{c.beginPath();
    if(a.snout){c.moveTo(nose-L*.03,-Hh*.12);c.quadraticCurveTo(nose+L*.05,-Hh*.2,nose+L*.1,-Hh*.38)}

    c.bezierCurveTo(nose+L*.10,-Hh*.62,ped-L*.28,-Hh*.56,ped,-ph);
    c.lineTo(ped,ph);
    c.bezierCurveTo(ped-L*.28,Hh*.50,nose+L*.12,Hh*.54,a.snout?nose+L*.06:nose,a.snout?Hh*.12:Hh*.02);
    if(a.snout)c.quadraticCurveTo(nose+L*.01,Hh*.02,nose-L*.03,-Hh*.12);
    c.closePath()};
  c.lineJoin='round';c.lineCap='round';
  // 꼬리
  c.fillStyle=a.fin;c.strokeStyle=dark;c.lineWidth=Math.max(1,L*.006);
  c.beginPath();
  if(a.tail==='lunate'){c.moveTo(ped-2,-ph);c.quadraticCurveTo(ped+(end-ped)*.55,-Hh*.2,end,-Hh*.66);c.quadraticCurveTo(ped+(end-ped)*.42,0,end,Hh*.66);c.quadraticCurveTo(ped+(end-ped)*.55,Hh*.2,ped-2,ph)}
  else if(a.tail==='round'){c.moveTo(ped-2,-ph);c.quadraticCurveTo(end*.9,-Hh*.44,end,-Hh*.3);c.quadraticCurveTo(end+L*.015,0,end,Hh*.3);c.quadraticCurveTo(end*.9,Hh*.44,ped-2,ph)}
  else if(a.tail==='shark'){c.moveTo(ped-2,-ph);c.lineTo(end,-Hh*.95);c.lineTo(ped+(end-ped)*.5,-Hh*.05);c.lineTo(end*.9,Hh*.4);c.lineTo(ped-2,ph)}
  else{c.moveTo(ped-2,-ph);c.quadraticCurveTo(ped+(end-ped)*.5,-Hh*.3,end,-Hh*.48);c.lineTo(ped+(end-ped)*.5,0);c.lineTo(end,Hh*.48);c.quadraticCurveTo(ped+(end-ped)*.5,Hh*.3,ped-2,ph)}
  c.closePath();c.fill();c.stroke();
  // 꼬리 결
  c.save();c.globalAlpha=.25;c.lineWidth=Math.max(.6,L*.003);
  for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(ped+2,i*ph*.25);c.lineTo(end-L*.02,i*Hh*.13);c.stroke()}
  c.restore();
  // 등지느러미
  c.fillStyle=a.fin;
  const fin=(pts)=>{c.beginPath();c.moveTo(pts[0][0]*L,pts[0][1]*Hh);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0]*L,pts[i][1]*Hh);c.closePath();c.fill();c.stroke()};
  if(a.dorsal==='single')fin([[-.10,-.40],[-.04,-.84],[.10,-.38]]);
  if(a.dorsal==='back')fin([[.10,-.34],[.18,-.80],[.24,-.24]]);
  if(a.dorsal==='double'){fin([[-.16,-.40],[-.11,-.86],[-.02,-.58],[.0,-.40]]);fin([[.02,-.40],[.06,-.74],[.2,-.26]])}
  if(a.dorsal==='triple'){fin([[-.2,-.4],[-.15,-.82],[-.08,-.42]]);fin([[-.06,-.42],[0,-.82],[.08,-.38]]);fin([[.1,-.36],[.15,-.7],[.24,-.2]])}
  if(a.dorsal==='long'){c.beginPath();c.moveTo(-.22*L,-.38*Hh);const n=9;for(let i=0;i<=n;i++){const x=(-.22+.42*i/n)*L;const top=(-.82+.3*Math.pow(i/n,1.6))*Hh;c.lineTo(x,top);c.lineTo(x+L*.02,top+Hh*.07)}c.lineTo(.22*L,-.26*Hh);c.closePath();c.fill();c.stroke()}
  if(a.dorsal==='tuna'){fin([[-.14,-.40],[-.10,-.92],[-.06,-.62],[.0,-.42]]);
    c.beginPath();c.moveTo(.02*L,-.38*Hh);c.quadraticCurveTo(.07*L,-1.05*Hh,.12*L,-1.02*Hh);c.quadraticCurveTo(.08*L,-.7*Hh,.11*L,-.32*Hh);c.closePath();c.fillStyle=a.fin2||a.finlets||a.fin;c.fill();c.stroke();
    c.beginPath();c.moveTo(.03*L,.32*Hh);c.quadraticCurveTo(.08*L,.98*Hh,.13*L,.94*Hh);c.quadraticCurveTo(.09*L,.64*Hh,.12*L,.26*Hh);c.closePath();c.fill();c.stroke();c.fillStyle=a.fin}
  // 배, 뒷지느러미
  if(a.dorsal!=='tuna'){fin([[.06,.32],[.11,.70],[.2,.2]])}
  fin([[-.12,.36],[-.08,.76],[-.02,.38]]);
  if(a.finlets){c.fillStyle=a.finlets;for(let i=0;i<5;i++){const x=(.13+i*.035)*L,t=i/5;const yT=-(.42-.25*t)*Hh,yB=(.36-.2*t)*Hh;c.beginPath();c.moveTo(x,yT);c.lineTo(x+L*.022,yT-Hh*.09);c.lineTo(x+L*.03,yT+Hh*.02);c.closePath();c.fill();c.beginPath();c.moveTo(x,yB);c.lineTo(x+L*.022,yB+Hh*.09);c.lineTo(x+L*.03,yB-Hh*.02);c.closePath();c.fill()}}
  if(a.adipose){c.fillStyle=a.fin;c.beginPath();c.ellipse(.22*L,-.30*Hh,L*.018,Hh*.08,-.5,0,7);c.fill();c.stroke()}
  // 몸통
  const g=c.createLinearGradient(0,-Hh*.6,0,Hh*.54);
  g.addColorStop(0,dark);g.addColorStop(.18,a.back);g.addColorStop(.46,mix(a.back,a.belly,.45));g.addColorStop(.66,a.belly);g.addColorStop(1,mix(a.belly,'#8fa3b0',.25));
  body();c.fillStyle=g;c.fill();
  c.save();body();c.clip();
  if(a.flush){const fg=c.createLinearGradient(0,-Hh*.2,0,Hh*.3);fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(.5,a.flush);fg.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=.45;c.fillStyle=fg;c.fillRect(nose+L*.2,-Hh*.3,L*.6,Hh*.7);c.globalAlpha=1}
  // 비늘
  c.strokeStyle='#ffffff';c.globalAlpha=.16;c.lineWidth=Math.max(.6,L*.0035);
  const s=Math.max(4,Hh*.12);
  for(let r=0;r<12;r++){const y=-Hh*.42+r*s*.62;for(let x=nose+L*.24+(r%2)*s*.5;x<ped;x+=s){c.beginPath();c.arc(x,y,s*.5,-1.2,1.2);c.stroke()}}
  c.globalAlpha=1;
  // 무늬
  if(a.pat==='wavy'){c.strokeStyle=mix(a.back,'#001018',.6);c.lineWidth=Math.max(1,L*.009);c.globalAlpha=.8;for(let i=0;i<17;i++){const x=nose+L*.2+i*L*.035;c.beginPath();c.moveTo(x,-Hh*.56);c.bezierCurveTo(x+L*.03,-Hh*.4,x-L*.02,-Hh*.26,x+L*.02,-Hh*.06-rnd()*Hh*.08);c.stroke()}c.globalAlpha=1}
  if(a.pat==='spots'||a.pat==='backspots'){c.fillStyle=mix(a.back,'#000000',.6);const n=a.pat==='spots'?34:22;for(let i=0;i<n;i++){const x=nose+L*.16+rnd()*L*.6,y=-Hh*.5+rnd()*Hh*(a.pat==='spots'?.42:.28);c.beginPath();c.ellipse(x,y,L*.007+rnd()*L*.005,L*.006,0,0,7);c.fill()}}
  if(a.pat==='bluespots'){c.fillStyle='#6fd6f2';for(let i=0;i<26;i++){const x=nose+L*.2+rnd()*L*.52,y=-Hh*.46+rnd()*Hh*.5;c.beginPath();c.arc(x,y,L*.007,0,7);c.fill()}}
  if(a.pat==='row'){c.fillStyle=mix(a.back,'#000000',.55);for(let i=0;i<7;i++){c.beginPath();c.arc(nose+L*.24+i*L*.075,-Hh*.1,L*.012,0,7);c.fill()}}
  if(a.pat==='gillspot'){c.fillStyle='#22313a';c.beginPath();c.arc(nose+L*.24,-Hh*.2,L*.022,0,7);c.fill();c.fillStyle=mix(a.back,'#000000',.4);for(let r=0;r<4;r++)for(let i=0;i<10;i++){c.beginPath();c.arc(nose+L*.28+i*L*.05,-Hh*.4+r*Hh*.1,L*.005,0,7);c.fill()}}
  if(a.pat==='lateral'){c.strokeStyle='#d9c35a';c.lineWidth=Hh*.07;c.globalAlpha=.9;c.beginPath();c.moveTo(nose+L*.2,-Hh*.14);c.quadraticCurveTo(0,-Hh*.2,ped,0);c.stroke();c.globalAlpha=1;c.fillStyle='#22313a';c.beginPath();c.arc(nose+L*.2,-Hh*.16,L*.014,0,7);c.fill()}
  if(a.pat==='stripe'){c.strokeStyle='#e7c53e';c.lineWidth=Hh*.09;c.globalAlpha=.95;c.beginPath();c.moveTo(nose+L*.12,-Hh*.06);c.quadraticCurveTo(0,-Hh*.1,ped,0);c.stroke();c.globalAlpha=1}
  if(a.pat==='bellyspots'){c.fillStyle='#f4f7f9';c.globalAlpha=.75;for(let i=0;i<30;i++){const x=nose+L*.2+rnd()*L*.5,y=Hh*.04+rnd()*Hh*.34;c.beginPath();c.ellipse(x,y,L*.012,L*.006,0,0,7);c.fill()}c.globalAlpha=1}
  if(a.pat==='mottle'){c.fillStyle=mix(a.back,'#3a2d12',.5);c.globalAlpha=.55;for(let i=0;i<40;i++){const x=nose+L*.14+rnd()*L*.64,y=-Hh*.52+rnd()*Hh*.55;c.beginPath();c.ellipse(x,y,L*.012+rnd()*L*.012,L*.008+rnd()*L*.006,rnd()*3,0,7);c.fill()}c.globalAlpha=1}
  if(a.pat==='scutes'){c.fillStyle=mix(a.back,'#ffffff',.45);c.strokeStyle=dark;c.lineWidth=Math.max(.6,L*.003);for(let i=0;i<11;i++){const x=nose+L*.2+i*L*.055,y=-Hh*.04+i*Hh*.004,w=L*.02,h=Hh*.11;c.beginPath();c.moveTo(x-w,y);c.lineTo(x,y-h);c.lineTo(x+w,y);c.lineTo(x,y+h);c.closePath();c.fill();c.stroke()}for(let i=0;i<8;i++){const x=nose+L*.22+i*L*.06;c.beginPath();c.moveTo(x-L*.016,-Hh*.5);c.lineTo(x,-Hh*.62);c.lineTo(x+L*.016,-Hh*.5);c.closePath();c.fill()}}
  // 윤기
  const hg=c.createLinearGradient(0,-Hh*.5,0,-Hh*.1);hg.addColorStop(0,'rgba(255,255,255,0)');hg.addColorStop(.5,'rgba(255,255,255,.28)');hg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=hg;c.fillRect(nose+L*.1,-Hh*.5,L*.6,Hh*.4);
  c.restore();
  c.strokeStyle=dark;c.lineWidth=Math.max(1,L*.007);body();c.stroke();
  // 옆줄
  c.globalAlpha=.3;c.lineWidth=Math.max(.6,L*.003);c.beginPath();c.moveTo(nose+L*.2,-Hh*.06);c.quadraticCurveTo(0,-Hh*.14,ped,0);c.stroke();c.globalAlpha=1;
  // 아가미
  c.lineWidth=Math.max(1,L*.006);c.globalAlpha=.6;c.beginPath();c.arc(nose+L*.12,Hh*.0,Hh*.37,-1.05,1.0);c.stroke();c.globalAlpha=1;
  // 가슴지느러미
  c.fillStyle=mix(a.fin,'#ffffff',.2);c.beginPath();
  const px=nose+L*.24,py=Hh*.12,pl=(a.long?L*.2:L*.11);
  c.moveTo(px,py);c.quadraticCurveTo(px+pl*.6,py-Hh*.04,px+pl,py+Hh*.16);c.quadraticCurveTo(px+pl*.4,py+Hh*.2,px,py);c.fill();c.stroke();
  // 눈
  const er=Hh*.075*(a.eye||1), ex=nose+L*.1+(a.snout?L*.03:0), ey=-Hh*.12;
  c.fillStyle=a.iris||'#f6f1df';c.beginPath();c.arc(ex,ey,er,0,7);c.fill();c.stroke();
  c.fillStyle='#10161c';c.beginPath();c.arc(ex,ey,er*.58,0,7);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(ex-er*.2,ey-er*.25,er*.2,0,7);c.fill();
  // 입
  c.beginPath();if(a.snout){c.moveTo(nose+L*.05,Hh*.14);c.lineTo(nose+L*.09,Hh*.2)}else{c.moveTo(nose+L*.004,Hh*.04);c.quadraticCurveTo(nose+L*.03,Hh*.1,nose+L*.055,Hh*.08)}c.stroke();
  if(a.barbel){c.beginPath();c.moveTo(nose+L*.04,Hh*.2);c.quadraticCurveTo(nose+L*.03,Hh*.36,nose+L*.05,Hh*.42);c.stroke()}
}

function drawEel(c,L,a,seed){
  const rnd=mulberry(seed),N=48,top=[],bot=[],mid=[];
  const prof=t=>t<.05?Math.sqrt(t/.05)*.9:t<.55?1:(a.taper?Math.max(.03,1-(t-.55)/.45):1-(t-.55)/.45*.8);
  for(let i=0;i<=N;i++){const t=i/N,x=-L/2+L*t,y=Math.sin(t*Math.PI*2*a.waves+.6)*L*a.amp,w=L*a.thick*prof(t);top.push([x,y-w]);bot.push([x,y+w]);mid.push([x,y+w*.15])}
  const dark=mix(a.back,'#000000',.4);
  c.lineJoin='round';c.lineCap='round';
  // 등지느러미
  c.beginPath();c.moveTo(top[8][0],top[8][1]);for(let i=8;i<=N;i++)c.lineTo(top[i][0],top[i][1]-L*a.thick*.55*Math.min(1,(N-i)/8+.15));for(let i=N;i>=8;i--)c.lineTo(top[i][0],top[i][1]);c.closePath();c.fillStyle=mix(a.back,'#ffffff',.25);c.fill();
  const path=()=>{c.beginPath();c.moveTo(top[0][0],top[0][1]);for(const p of top)c.lineTo(p[0],p[1]);for(let i=N;i>=0;i--)c.lineTo(bot[i][0],bot[i][1]);c.closePath()};
  path();c.fillStyle=a.back;c.fill();
  c.beginPath();c.moveTo(mid[0][0],mid[0][1]);for(const p of mid)c.lineTo(p[0],p[1]);for(let i=N;i>=0;i--)c.lineTo(bot[i][0],bot[i][1]);c.closePath();c.fillStyle=a.belly;c.fill();
  if(a.silver){c.save();path();c.clip();c.globalAlpha=.5;c.strokeStyle='#ffffff';c.lineWidth=L*a.thick*.5;c.beginPath();for(let i=2;i<N-2;i++)c.lineTo(top[i][0],top[i][1]+L*a.thick*.6);c.stroke();c.restore()}
  if(a.dots){c.fillStyle='#fbf6e8';for(let i=6;i<N-3;i+=2){c.beginPath();c.arc(top[i][0],(top[i][1]+bot[i][1])/2-L*a.thick*.1,L*.006,0,7);c.fill()}}
  c.strokeStyle=dark;c.lineWidth=Math.max(1,L*.006);path();c.stroke();
  // 아가미, 가슴지느러미, 눈
  const hx=top[5][0],hy=(top[5][1]+bot[5][1])/2,r=L*a.thick;
  c.globalAlpha=.5;c.beginPath();c.arc(hx-r*.2,hy,r*.9,-.9,.9);c.stroke();c.globalAlpha=1;
  c.fillStyle=mix(a.back,'#ffffff',.3);c.beginPath();c.ellipse(hx+r*1.1,hy+r*.2,r*.8,r*.4,.4,0,7);c.fill();c.stroke();
  const ex=top[2][0]+r*.2,ey=(top[2][1]+bot[2][1])/2-r*.2;
  c.fillStyle='#f6f1df';c.beginPath();c.arc(ex,ey,r*.26,0,7);c.fill();c.stroke();c.fillStyle='#10161c';c.beginPath();c.arc(ex,ey,r*.14,0,7);c.fill();
}

function drawFlat(c,L,a,seed){
  const rnd=mulberry(seed),rx=L*.36,ry=L*.2,cx=-L*.06;
  c.lineJoin='round';
  const dark=mix(a.col,'#000000',.45);
  // 꼬리
  c.fillStyle=a.lite;c.strokeStyle=dark;c.lineWidth=Math.max(1,L*.006);
  c.beginPath();c.moveTo(cx+rx*.92,-ry*.2);c.lineTo(L*.5,-ry*.62);c.quadraticCurveTo(L*.52,0,L*.5,ry*.62);c.lineTo(cx+rx*.92,ry*.2);c.closePath();c.fill();c.stroke();
  // 지느러미 테두리
  c.beginPath();c.ellipse(cx+rx*.06,0,rx*.98,ry*1.38,0,0,7);c.fillStyle=a.lite;c.fill();c.stroke();
  c.save();c.globalAlpha=.4;c.lineWidth=Math.max(.6,L*.003);for(let i=0;i<60;i++){const t=i/60*Math.PI*2;c.beginPath();c.moveTo(cx+Math.cos(t)*rx*.9,Math.sin(t)*ry*.95);c.lineTo(cx+rx*.06+Math.cos(t)*rx*.98,Math.sin(t)*ry*1.38);c.stroke()}c.restore();
  // 몸
  const g=c.createRadialGradient(cx-rx*.2,-ry*.2,ry*.1,cx,0,rx);g.addColorStop(0,mix(a.col,'#ffffff',.18));g.addColorStop(1,mix(a.col,'#000000',.12));
  c.beginPath();c.ellipse(cx,0,rx,ry,0,0,7);c.fillStyle=g;c.fill();
  c.save();c.clip();
  for(let i=0;i<70;i++){const x=cx+(rnd()*2-1)*rx,y=(rnd()*2-1)*ry;c.fillStyle=rnd()<.3?'rgba(255,250,230,.55)':'rgba(40,28,10,.35)';c.beginPath();c.ellipse(x,y,L*.006+rnd()*L*.012,L*.005+rnd()*L*.008,rnd()*3,0,7);c.fill()}
  c.restore();c.beginPath();c.ellipse(cx,0,rx,ry,0,0,7);c.stroke();
  c.globalAlpha=.35;c.beginPath();c.moveTo(cx-rx*.6,-ry*.1);c.quadraticCurveTo(cx-rx*.3,-ry*.5,cx,-ry*.08);c.lineTo(cx+rx*.9,0);c.stroke();c.globalAlpha=1;
  // 눈 두 개
  for(const [ex,ey] of [[cx-rx*.74,-ry*.3],[cx-rx*.62,ry*.05]]){c.fillStyle='#e9dfb8';c.beginPath();c.arc(ex,ey,L*.02,0,7);c.fill();c.stroke();c.fillStyle='#10161c';c.beginPath();c.arc(ex,ey,L*.011,0,7);c.fill()}
  c.beginPath();c.moveTo(cx-rx*.98,ry*.1);c.quadraticCurveTo(cx-rx*.86,ry*.32,cx-rx*.74,ry*.3);c.stroke();
}

function drawSquid(c,L,a,seed){
  const rnd=mulberry(seed),th=a.slim?.085:.115,dark=mix(a.col,'#000000',.4);
  c.lineJoin='round';c.lineCap='round';c.strokeStyle=dark;
  // 다리
  c.lineWidth=L*.022;c.strokeStyle=a.col;
  for(let i=0;i<8;i++){const y0=(i-3.5)*L*.016,y1=(i-3.5)*L*.05+Math.sin(i*1.7)*L*.02;c.beginPath();c.moveTo(-L*.2,y0);c.quadraticCurveTo(-L*.3,y0*1.6,-L*.4,y1);c.stroke()}

function drawShrimp(c,L,a){

const ASPECT={fish:1,eel:.42,flat:.6,squid:.45,octopus:1.05,shrimp:.8,scallop:.95,abalone:.72,urchin:1,crab:.78,angler:.62,tamago:.62,yubu:.64,beef:.62};
function drawCreature(c,f,cx,cy,w,h){
  const a=f.art,asp=a.k==='fish'?Math.max(.3,a.ratio*(a.dorsal==='tuna'?2.2:1.7)):ASPECT[a.k];
  const L=Math.min(w*.9,h*.9/asp),seed=hash(f.id);
  c.save();c.translate(cx,cy);
  switch(a.k){
    case 'fish':drawFish(c,L,a,seed);break;
    case 'eel':drawEel(c,L,a,seed);break;
    case 'flat':drawFlat(c,L,a,seed);break;
    case 'squid':drawSquid(c,L,a,seed);break;
    case 'octopus':c.translate(0,-L*.02);drawOctopus(c,L*.95,a);break;
    case 'shrimp':c.translate(-L*.05,L*.02);drawShrimp(c,L*.9,a);break;
    case 'scallop':drawScallop(c,L);break;
    case 'abalone':drawAbalone(c,L,a,seed);break;
    case 'urchin':drawUrchin(c,L,a,seed);break;
    case 'crab':c.translate(0,-L*.06);drawCrab(c,L);break;
    case 'angler':drawAngler(c,L,a,seed);break;
    case 'tamago':c.translate(-L*.04,L*.02);drawTamago(c,L);break;
    case 'yubu':drawYubu(c,L);break;
    case 'beef':drawBeef(c,L,a,seed);break;
  }
  c.restore();
}

/* 놓친 전설 재도전: 놓친 뒤 같은 낚싯대로 다음 10번의 입질 동안 15% 확률로 다시 걸림 */
const GRUDGE={casts:10,p:.15};
const HARD={c:0,e:0,u:1,r:2,v:3,l:4};
function pickFish(first){
  const force='';
  if(first!==false){const g=S.grudge&&S.grudge[S.rod];S.inGrudge=!!g;
    if(g&&!force){g.left--;const f=g.fish;if(g.left<=0)S.grudge[S.rod]=null;if(Math.random()<GRUDGE.p)return f}}
  let pool=FISH.filter(f=>f.rod===S.rod);
  if(force){const p2=pool.filter(f=>f.tier===force);if(p2.length)pool=p2}
  const lk=(1+fx('luck')/100)*upv('luck')*S.cast.rare*(tideOn()?TIDE.rare:1),wt=f=>S.cast.live&&f.tier==='c'&&!force?0:tierP(f.tier,hatIdx())*(f.tier==='r'||f.tier==='v'||f.tier==='l'?lk:1);
  let sum=0;for(const f of pool)sum+=wt(f);
  let r=Math.random()*sum;for(const f of pool){r-=wt(f);if(r<=0)return f}
  return pool[pool.length-1];
}
/* 대물 확률(길이 상위 10%)에 맞춘 크기 지수 */
function sizeK(){const p=Math.min(.9,upv('big')*(1+fx('big')/100)*S.cast.big);return Math.log(.9)/Math.log(1-p)}
function startCast(){
  if(S.state!=='idle')return;
  S.state='cast';S.castT=0;$('castBtn').hidden=true;
}
function startWait(){S.state='wait';beginCast();S.wait=upv('bite')*(2/3+Math.random()*2/3)/(1+fx('bite')/100)*(1-S.cast.w)*(tideOn()?TIDE.wait:1);S.splash=1;planGuests(S.wait)}
function startBite(){S.state='bite';S.biteT=1.6;
  const n=upv('hook');S.hooked=[pickFish(true)];for(let i=1;i<n;i++)S.hooked.push(pickFish(false));
  S.fish=S.hooked.reduce((a,b)=>HARD[b.tier]>HARD[a.tier]?b:a);
  spendBait();orderTick();tickFx()}
function startFight(){
  const f=S.fish,T=TIER[f.tier],x=Math.pow(Math.random(),sizeK());
  S.f={fish:f,x,zone:Math.min(.9,T.zone*upv('power')*(1+fx('power')/200)),fill:upv('reel'),line:upv('line'),n:.5,v:0,prog:.3,t:0,next:.8,zoneC:.5,phase:Math.random()*6,T};
  S.state='fight';S.hold=true;S.fights++;
  $('toast').classList.remove('on');
}
function startMiss(big){if(!big)S.missLegend=false;S.state='miss';S.missT=0;S.missBig=big;S.missX=S.lastB?S.lastB.x:W*.4;S.missY=S.lastB?S.lastB.y:H*.6;S.missDir=Math.random()<.5?-1:1;}
function endFight(win){
  const F=S.f,hooked=S.hooked&&S.hooked.includes(F.fish)?S.hooked:[F.fish],leg=hooked.find(f=>f.tier==='l');
  if(!win){if(leg&&!S.inGrudge){S.grudge=S.grudge||{};S.grudge[leg.rod]={fish:leg,left:GRUDGE.casts}}S.missLegend=!!leg;S.f=null;startMiss(true);return}
  if(leg&&S.grudge)S.grudge[leg.rod]=null;
  let main=null;const k=sizeK(),got=[];
  for(const f of hooked){const isMain=!main&&f===F.fish,x=isMain?F.x:Math.pow(Math.random(),k),len=f.min+(f.max-f.min)*x;
    const bonus=!!(f.bonus&&Math.random()<(f.bonus.p<1?upv('roe'):1));
    const it={uid:K.uid++,fid:f.id,len,x,bonus};K.inv.push(it);dexAdd(it);S.count++;if(isMain)main=it;else got.push(it)}
  const f=F.fish;$('count').textContent=S.count;
  $('rTier').textContent=TIER[f.tier].name;$('rTier').style.background=TIER[f.tier].color;
  $('rName').textContent=(main.bonus&&f.bonus.name==='알배기'?'알배기 ':'')+f.name;
  $('rLen').textContent=main.len.toFixed(1)+'cm';$('rSize').textContent=sizeName(main.x);$('rPrice').textContent=money(rawPrice(main));
  const b=$('rBonus');if(main.bonus){b.hidden=false;b.textContent=f.bonus.name==='알배기'?'알이 들어 있어요':f.bonus.name+'가 들어 있어요'}else b.hidden=true;
  const m=$('rMore');m.hidden=!got.length;m.textContent=got.length?'함께 잡음: '+got.map(it=>FISH_BY[it.fid].name+' '+it.len.toFixed(0)+'cm').join(', '):'';
  $('result').hidden=false;drawArt($('rArt'),f);
  S.state='result';S.f=null;
}
function drawArt(can,f){
  const r=can.getBoundingClientRect(),d=Math.min(3,window.devicePixelRatio||1);
  can.width=Math.round(r.width*d);can.height=Math.round(r.height*d);
  const c=can.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,r.width,r.height);
  drawCreature(c,f,r.width/2,r.height/2,r.width,r.height);
}

function down(e){
  if(e.target.closest('button,select,label,.sheet'))return;
  e.preventDefault();
  if(S.state==='idle')startCast();
  else if(S.state==='cast'||S.state==='wait')cancelCast();
  else if(S.state==='bite')startFight();
  else if(S.state==='fight')S.hold=true;
}
function cancelCast(){S.state='idle';S.splash=0;$('castBtn').hidden=false;setHint('')}
function up(){S.hold=false}

function scene(t){
  const hz=H*.36;
  let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#5fb8ee');g.addColorStop(1,'#d6f1ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+2);
  // 해
  const sx=W*.8,sy=H*.1;
  g=ctx.createRadialGradient(sx,sy,4,sx,sy,W*.42);g.addColorStop(0,'rgba(255,250,220,.95)');g.addColorStop(.12,'rgba(255,244,190,.6)');g.addColorStop(1,'rgba(255,244,190,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz);
  ctx.fillStyle='#fff7cf';ctx.beginPath();ctx.arc(sx,sy,W*.055,0,7);ctx.fill();
  // 구름
  ctx.fillStyle='rgba(255,255,255,.92)';
  for(const c of clouds){const x=((c.x+(reduce?0:t*.004*c.s))%1.3-.15)*W,y=c.y*H+H*.07,s=W*.07*c.s;
    for(const [dx,dy,r] of [[0,0,1],[1,.15,.8],[-1,.2,.75],[.5,-.35,.8],[-.45,-.25,.65]]){ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,r*s,0,7);ctx.fill()}}
  // 먼 섬
  ctx.fillStyle='#7fb7a8';ctx.beginPath();ctx.moveTo(W*.02,hz);ctx.quadraticCurveTo(W*.12,hz-H*.05,W*.2,hz-H*.025);ctx.quadraticCurveTo(W*.28,hz-H*.055,W*.4,hz);ctx.fill();
  ctx.fillStyle='#96c8b6';ctx.beginPath();ctx.moveTo(W*.62,hz);ctx.quadraticCurveTo(W*.7,hz-H*.03,W*.82,hz);ctx.fill();
  // 바다
  g=ctx.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#63c3e6');g.addColorStop(.25,'#2f8fc4');g.addColorStop(1,'#16527c');
  ctx.fillStyle=g;ctx.fillRect(0,hz,W,H-hz);
  // 햇빛 반사
  ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#fffbe0';
  for(let i=0;i<22;i++){const y=hz+4+i*i*.9,w=(10+i*4)*(.6+.4*Math.sin(t*1.5+i*1.9)),x=sx+Math.sin(i*2.3+t*.6)*i*2.2;if(y>H*.72)break;ctx.fillRect(x-w/2,y,w,1.6+i*.07)}
  ctx.restore();
  // 물결
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineCap='round';
  for(let i=0;i<13;i++){const p=i/12,y=hz+8+p*p*(H-hz)*.9,amp=2+p*5,len=W*(.12+p*.2);ctx.lineWidth=1+p*1.6;
    for(let k=0;k<3;k++){const x=((k*.37+i*.21+(reduce?0:t*.012*(1+p)))%1.2-.1)*W;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+len/2,y-amp,x+len,y);ctx.stroke()}}
}
function dock(){
  const y=H*.86;
  ctx.fillStyle='#8f6638';ctx.fillRect(0,y,W,H-y);
  ctx.fillStyle='#b98954';for(let i=0;i<8;i++){ctx.fillRect(i*W/7-6,y+2,W/7-4,H-y)}
  ctx.fillStyle='rgba(60,36,12,.35)';ctx.fillRect(0,y,W,5);
  ctx.fillStyle='#6f4c26';for(const x of [W*.06,W*.94]){ctx.fillRect(x-7,y-16,14,H-y+16)}
}
function rodAndLine(t,tip,bx,by,taut){
  const base={x:W*.93,y:H*.84},bend=taut?H*.06:0;
  ctx.lineCap='round';
  ctx.strokeStyle=ROD[S.rod].color;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.quadraticCurveTo((base.x+tip.x)/2+W*.05,(base.y+tip.y)/2-H*.04-bend*.3,tip.x,tip.y);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(base.x-2,base.y);ctx.quadraticCurveTo((base.x+tip.x)/2+W*.05-2,(base.y+tip.y)/2-H*.04-bend*.3,tip.x,tip.y);ctx.stroke();
  {const rx=base.x-W*.06,ry=base.y-H*.085,ra=S.state==='fight'&&S.hold?t*9:.6;ctx.strokeStyle='#2a3a48';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx+Math.cos(ra)*17,ry+Math.sin(ra)*17);ctx.stroke();ctx.fillStyle='#2a3a48';ctx.beginPath();ctx.arc(rx,ry,11,0,7);ctx.fill();ctx.strokeStyle='#e9c46a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(rx,ry,8,0,7);ctx.stroke();ctx.fillStyle='#c9d6de';ctx.beginPath();ctx.arc(rx,ry,4,0,7);ctx.fill();ctx.fillStyle='#e9c46a';ctx.beginPath();ctx.arc(rx+Math.cos(ra)*17,ry+Math.sin(ra)*17,4.5,0,7);ctx.fill();ctx.strokeStyle='#2a3a48';ctx.lineWidth=1.5;ctx.stroke()}
  if(bx!==null){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(tip.x,tip.y);ctx.quadraticCurveTo((tip.x+bx)/2,(tip.y+by)/2+(taut?0:H*.07),bx,by);ctx.stroke()}
}
function bobber(x,y,dip){
  ctx.save();ctx.translate(x,y+dip);
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.4;
  for(let i=0;i<2;i++){const r=14+i*10+((S.t*14)%10);ctx.globalAlpha=.5-(r-14)/40;ctx.beginPath();ctx.ellipse(0,6-dip,r,r*.28,0,0,7);ctx.stroke()}
  ctx.globalAlpha=1;
  ctx.fillStyle='#f4fbff';ctx.beginPath();ctx.arc(0,0,8,0,Math.PI,false);ctx.fill();
  ctx.fillStyle='#e9463c';ctx.beginPath();ctx.arc(0,0,8,Math.PI,0,false);ctx.fill();
  ctx.strokeStyle='#17324a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.stroke();
  ctx.fillStyle='#17324a';ctx.fillRect(-1,-16,2,9);
  ctx.restore();
}
function gauge(){
  const F=S.f,T=F.T,y=H*.2,w=44,h=H*.44;
  const kt=F.kickT>0?F.kickT/.3:0,kamp=Math.min(9,3+Math.abs(F.kickV||0)*9);
  const x=16+(kt>0?Math.sin(F.t*75)*kamp*kt:0);
  ctx.fillStyle='rgba(23,50,74,.78)';rr(x-5,y-5,w+32,h+10,14);ctx.fill();
  ctx.fillStyle='#24465f';rr(x,y,w,h,9);ctx.fill();
  const zh=F.zone*h,zy=y+h-(F.zoneC*h)-zh/2;
  ctx.fillStyle='#5fd08a';rr(x+2,zy,w-4,zh,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';rr(x+4,zy+2,w-8,Math.min(8,zh*.3),4);ctx.fill();
  const ny=y+h-F.n*h,inZ=Math.abs(F.n-F.zoneC)<=F.zone/2;
  // 물고기 표시 (초록 구간 가운데)
  {const fx=x+w/2,fy=zy+zh/2,wob=Math.sin(F.t*7)*1.5;
   ctx.fillStyle='#1f7a48';ctx.beginPath();ctx.ellipse(fx-3,fy,12,6.5,0,0,7);ctx.fill();
   ctx.beginPath();ctx.moveTo(fx+7,fy);ctx.lineTo(fx+16,fy-6+wob);ctx.lineTo(fx+16,fy+6+wob);ctx.closePath();ctx.fill();
   ctx.fillStyle='#eafff2';ctx.beginPath();ctx.arc(fx-9,fy-1.5,1.6,0,7);ctx.fill()}
  // 바늘 표시 (내가 움직이는 것)
  {const col=inZ?'#ffffff':'#ff7a6b',cx=x+w/2;
   ctx.strokeStyle='#17324a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-4,ny);ctx.lineTo(x+w+4,ny);ctx.stroke();
   ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x-4,ny);ctx.lineTo(x+w+4,ny);ctx.stroke();
   ctx.fillStyle=col;ctx.strokeStyle='#17324a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,ny,12,0,7);ctx.fill();ctx.stroke();
   ctx.strokeStyle='#17324a';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';
   ctx.beginPath();ctx.moveTo(cx+3,ny-7);ctx.lineTo(cx+3,ny+2);ctx.arc(cx-1,ny+2,4,0,Math.PI);ctx.lineTo(cx-5,ny-1);ctx.stroke();
   ctx.beginPath();ctx.moveTo(cx-5,ny-1);ctx.lineTo(cx-2.5,ny+1);ctx.stroke();
   ctx.beginPath();ctx.arc(cx+3,ny-7.5,1.4,0,7);ctx.stroke();ctx.lineCap='butt';
   if(kt>0){const d=F.kickV>0?-1:1,ay=ny+d*20;ctx.globalAlpha=kt;ctx.fillStyle='#ffb347';ctx.strokeStyle='#17324a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx,ay+d*9);ctx.lineTo(cx-8,ay);ctx.lineTo(cx+8,ay);ctx.closePath();ctx.fill();ctx.stroke();ctx.globalAlpha=1}}
  // 진행 막대
  const px=x+w+8,pw=14;
  ctx.fillStyle='#24465f';rr(px,y,pw,h,7);ctx.fill();
  const ph=clamp(F.prog,0,1)*h;
  ctx.fillStyle=F.prog<.25?'#ff7a6b':F.prog<.6?'#f2b632':'#5fd08a';rr(px,y+h-ph,pw,ph,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(px,y+h*.7-1,pw,2);
  if(F.saveT>0){F.saveT-=1/60;ctx.strokeStyle='rgba(95,208,138,'+Math.min(1,F.saveT*2.5)+')';ctx.lineWidth=5;rr(px-3,y-3,pw+6,h+6,9);ctx.stroke()}
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

/* ---------- 루프 ---------- */
let last=0;
function frame(ms){
  const now=ms/1000,dt=Math.min(.05,now-last||.016);last=now;S.t=now;
  if(S.toastT>0){S.toastT-=dt*1000;if(S.toastT<=0)$('toast').classList.remove('on')}
  update(dt);stage4Tick();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scene(now);if(tideOn())drawSchool(ctx,now,W,H);drawNet(ctx,now,W,H);
  const home={x:W*.4,y:H*.6},tip0={x:W*.42,y:H*.3};
  let bx=null,by=null,dip=0,taut=false,tip={x:tip0.x,y:tip0.y};
  if(S.state==='cast'){const k=clamp(S.castT/.7,0,1);bx=tip0.x+(home.x-tip0.x)*k;by=tip0.y+(home.y-tip0.y)*k-Math.sin(k*Math.PI)*H*.16}
  else if(S.state==='wait'){bx=home.x;by=home.y;dip=Math.sin(now*2.2)*2}
  else if(S.state==='bite'){bx=home.x;by=home.y;dip=6+Math.sin(now*30)*3}
  else if(S.state==='fight'){const F=S.f;bx=home.x+Math.sin(F.t*3.1+F.phase)*W*.1*(.4+F.T.kick);by=home.y+Math.cos(F.t*2.3)*H*.03;taut=true;tip.x+=Math.sin(F.t*9)*2;tip.y+=H*.03+(S.hold?H*.015:0)}
  if(S.state==='miss'){
    const m=S.missT,mx=S.missX,my=S.missY,big=S.missBig,sc=S.missLegend?2.1:big?1.4:1;
    // 찌가 튕겨 돌아옴
    const k=clamp(m/.55,0,1),e=1-(1-k)*(1-k);
    bx=mx+(tip0.x-mx)*e;by=my+(tip0.y+H*.05-my)*e-Math.sin(k*Math.PI)*H*.1;
    tip.y-=Math.sin(clamp(m/.35,0,1)*Math.PI)*H*.035;
    // 도망가는 그림자
    const d=m*m*W*.9+m*W*.25,a=clamp(1-m/1.0,0,1);

function rollSVG(){const st=K.sel.map(u=>K.sticks.find(x=>x.uid===u)).filter(Boolean),n=st.length;let slats='',rice='',strips='';
  for(let x=6;x<288;x+=12)slats+=`<rect x="${x}" y="4" width="10" height="112" rx="3" fill="${(x/12|0)%2?'#c9b267':'#d6c07a'}"/>`;

  st.forEach((s,i)=>{const y=60+(i-(n-1)/2)*17,c=fleshOf(s.fid,s.pm,s.part);strips+=`<rect x="34" y="${y-6.5}" width="232" height="13" rx="5" fill="${c}" stroke="#3a2413" stroke-width="2"/><path d="M42 ${y-3}h210" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".4"/>`});
  return `<svg class="rollcv" viewBox="0 0 300 120"><rect x="2" y="2" width="296" height="116" rx="8" fill="#a8904a" stroke="#3a2413" stroke-width="2.5"/>${slats}<path d="M4 34h292M4 86h292" stroke="#f3ead0" stroke-width="1.5" stroke-dasharray="3 9"/>
    <rect x="22" y="14" width="256" height="92" rx="4" fill="#1f2b22" stroke="#0f1712" stroke-width="2"/><rect x="32" y="22" width="236" height="76" rx="6" fill="#f7f3e8" stroke="#d9d1bd" stroke-width="1.5"/>${rice}${strips}</svg>`}
function makeRoll(){const st=K.sel.map(u=>K.sticks.find(x=>x.uid===u));if(!st.length)return;const m={};
  for(const s of st)for(const [t,p] of fxOf(s.fid,s.pm,ROLLK))m[t]=(m[t]||0)+p;
  addSushi({type:'r',name:st.map(s=>FISH_BY[s.fid].name).join('·')+' 롤',stars:2+new Set(st.map(s=>s.fid)).size,price:st.reduce((a,s)=>a+s.value,0),fx:Object.entries(m),dur:20,col:st.map(s=>fleshOf(s.fid,s.pm,s.part)),ing:st.map(s=>s.fid)},1);
  K.sticks=K.sticks.filter(s=>!K.sel.includes(s.uid));K.sel=[];kHome()}

/* 손질을 실제로 시작한 순간에만 보관함에서 빠지고 알·간 군함이 나옴 (해체 화면에서 그냥 나가면 생선은 그대로) */

const wcv=$('wCv'),wx=wcv.getContext('2d');let WW=0,WH=0;

function wpos(e){const r=wcv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function drawStroke(st,col){if(!st||st.length<2)return;wx.strokeStyle=col||'rgba(23,50,74,.85)';wx.lineWidth=3;wx.lineCap='round';wx.lineJoin='round';wx.beginPath();wx.moveTo(st[0][0],st[0][1]);for(const p of st)wx.lineTo(p[0],p[1]);wx.stroke()}

/* ---------- 해체 ---------- */
function dense(pts){const out=[];for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1],n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/4));for(let k=0;k<n;k++)out.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n])}out.push(pts[pts.length-1]);return out}
function smooth(pts){if(pts.length<3)return pts;const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];for(let k=0;k<10;k++){const t=k/10,t2=t*t,t3=t2*t;out.push([.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}out.push(pts[pts.length-1]);return out}
function gutLayout(){const w=K.work,g=partGeom(w.f,WW,WH);w.box=g.box;w.lines=g.lines;w.labels=g.labels}
function partGeom(f,WW,WH){const w={},a=f.art,P=PARTS[f.id];
  const bw=WW-24,bh=Math.min(WH-70,WW*.8),cx=WW/2,cy=WH/2-6;
  const asp=a.k==='fish'?Math.max(.3,a.ratio*(a.dorsal==='tuna'?2.2:1.7)):ASPECT[a.k],L=Math.min(bw*.9,bh*.9/asp);
  w.box={cx,cy,bw,bh,L};let lines=[],labels=[];
  if(P.eel){const sp=t=>[cx-L/2+L*t,cy+Math.sin(t*Math.PI*2*a.waves+.6)*L*a.amp],th=L*a.thick;
    const s=[];for(let t=.1;t<=.701;t+=.03)s.push(sp(t));lines.push(s);const p=sp(.7);lines.push([[p[0]+th*.3,p[1]-th*1.9],[p[0]-th*.3,p[1]+th*1.9]]);
    const m=sp(.4),q=sp(.86);labels=[[m[0],m[1]-th*2.2],[m[0],m[1]+th*2.4],[q[0],q[1]-th*2.2]]}
  else{const sy=a.k==='fish'?L*a.ratio:L,dy=(P.dy||0)*L,rot=a.k==='abalone'?-.12:0,cs=Math.cos(rot),sn=Math.sin(rot);
    const tp=([x,y])=>{const X=x*L,Y=y*sy;return [cx+X*cs-Y*sn,cy+dy+X*sn+Y*cs]};
    if(P.arc)for(const A of P.arc){const s=[];for(let d=A.a[0];d<=A.a[1];d+=6){const r=d*Math.PI/180;s.push(tp([A.c[0]+Math.cos(r)*A.r[0],A.c[1]+Math.sin(r)*A.r[1]]))}lines.push(s)}
    if(P.lines)for(const l of P.lines)lines.push(smooth(l.map(tp)));
    labels=P.labels.map(tp)}
  w.lines=lines.map(dense);w.labels=labels;return w}
function startGut(it){const f=FISH_BY[it.fid];K.work={mode:'gut',it,f,done:[],stroke:null};showWork();gutLayout();
  $('wName').textContent=f.name+' 해체';$('wSkip').hidden=false;$('wSkip').textContent='건너뛰고 통째로';$('wDone').textContent='썰러 가기';gutInfo();wDraw()}
function gutInfo(){const w=K.work,n=w.lines.length;$('wInfo').textContent='선 '+w.done.length+' / '+n+(w.done.length?' · 정확도 '+Math.round(avg(w.done)*100)+'%':'');$('wDone').disabled=w.done.length<n}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function gutDraw(){const w=K.work,b=w.box;board();
  drawCreature(wx,w.f,b.cx,b.cy,b.bw,b.bh);
  w.lines.forEach((l,i)=>{const dn=i<w.done.length,cur=i===w.done.length;wx.lineCap='round';wx.lineJoin='round';
    wx.setLineDash(dn?[]:[7,7]);wx.lineWidth=dn?4:cur?4:2.5;
    wx.strokeStyle=dn?(w.done[i]>.66?'#2fa25c':w.done[i]>.33?'#e0a020':'#e0523f'):cur?'#ffffff':'rgba(255,255,255,.55)';
    if(!dn){wx.save();wx.strokeStyle='rgba(23,50,74,.75)';wx.lineWidth+=3;wx.setLineDash([]);wx.globalAlpha=cur?.9:.35;wx.beginPath();wx.moveTo(l[0][0],l[0][1]);for(const p of l)wx.lineTo(p[0],p[1]);wx.stroke();wx.restore()}
    wx.beginPath();wx.moveTo(l[0][0],l[0][1]);for(const p of l)wx.lineTo(p[0],p[1]);wx.stroke();wx.setLineDash([]);
    if(cur){for(const p of [l[0],l[l.length-1]]){wx.fillStyle='#fff';wx.strokeStyle='#17324a';wx.lineWidth=2;wx.beginPath();wx.arc(p[0],p[1],7,0,7);wx.fill();wx.stroke()}}});
  partLabels(wx,w.f,w.labels);
  drawStroke(w.stroke);knifeOverlay(wx,WW,WH,w.stroke)}
function gutStroke(st){const w=K.work,i=w.done.length;if(i>=w.lines.length)return;const l=w.lines[i],A=l[0],B=l[l.length-1],s0=st[0],s1=st[st.length-1];
  const d=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]),R=36;
  if(!((d(s0,A)<R&&d(s1,B)<R)||(d(s0,B)<R&&d(s1,A)<R)))return;
  let sum=0;for(const p of st){let m=1e9;for(const q of l){const v=d(p,q);if(v<m)m=v}sum+=m}
  const mean=sum/st.length;w.done.push(clamp(1-(mean-3)/(GUT.tol*KNIFE.prec),0,1));gutInfo()}
function finishGut(skip){const w=K.work,it=w.it,f=w.f,U=unitsOf(f),v=unitV(it),n=nParts(f);let first;commit(it);
  if(skip){first=mkBlock(it,null,1,U);K.blocks.push(first)}
  else{const a=avg(w.done),keep=GUT.keep+(1-GUT.keep)*a;
    PARTS[f.id].names.forEach((nm,i)=>{const full=U*SHARE[n][i],b=mkBlock(it,nm,PMULT[n][i],full*keep);K.blocks.push(b);addScrap(full*(1-keep),full*(1-keep)*v*PMULT[n][i],f.id);if(!first)first=b})}
  startSlice(first)}
$('wSkip').addEventListener('click',()=>{if(K.work&&K.work.mode==='gut')finishGut(true)});
$('wDone').addEventListener('click',()=>{const w=K.work;if(!w)return;if(w.mode==='gut'){if(w.done.length>=w.lines.length)finishGut(false)}else finishSlice()});

/* ---------- 썰기 ---------- */
function startSlice(b){if(!b)return kHome();K.work={mode:'slice',b,stroke:null,flash:0};showWork();
  $('wName').textContent=FISH_BY[b.fid].name+(b.part?' '+b.part:'');$('wSkip').hidden=true;$('wDone').textContent='완성';$('wDone').disabled=false;sliceInfo();wDraw()}
function sliceGeom(){const b=K.work.b,u=Math.min(62,(WW-84)/b.w),hu=Math.min(u*1.2,(WH-150)/b.h);return {u,hu,x0:(WW-b.w*u)/2+18,y0:Math.max(54,(WH-b.h*hu)/2-18)}}
const rem=b=>b.h-b.top;
function classify(w){return w<CUT.scrap?'scrap':w<CUT.thin?'thin':w<CUT.normal?'normal':'thick'}
function segs(b){const xs=[0,...b.cuts,b.w],out=[];for(let i=0;i<xs.length-1;i++)out.push({a:xs[i],w:xs[i+1]-xs[i],bad:(i>0&&b.bad[i-1])||(i<b.cuts.length&&b.bad[i])});return out}
function sliceInfo(){const b=K.work.b;$('wInfo').textContent=b.w.toFixed(1)+'조각 분량'+(b.pm!==1?' · 값 ×'+b.pm:'')}
function sliceDraw(){const w=K.work,b=w.b,g=sliceGeom(),{u,hu,x0,y0}=g;board();
  const top=y0+b.top*hu,bot=y0+b.h*hu,nig=rem(b)>=1-1e-9;
  // 이미 잘라낸 윗부분 자리
  if(b.top>0){wx.setLineDash([5,5]);wx.strokeStyle='rgba(23,50,74,.3)';wx.lineWidth=1.5;wx.strokeRect(x0,y0,b.w*u,b.top*hu);wx.setLineDash([])}
  // 덩이
  drawFlesh(wx,x0,top,b.w*u,bot-top,styleOf(b.fid,b.part),b.uid*7919);
  // 니기리 최소 높이
  const my=bot-hu;wx.strokeStyle='#17324a';wx.lineWidth=2;wx.beginPath();wx.moveTo(x0-12,bot);wx.lineTo(x0-20,bot);wx.lineTo(x0-20,my);wx.lineTo(x0-12,my);wx.stroke();
  wx.setLineDash([4,5]);wx.strokeStyle='rgba(23,50,74,.5)';wx.lineWidth=1.5;wx.beginPath();wx.moveTo(x0-12,my);wx.lineTo(x0+b.w*u+8,my);wx.stroke();wx.setLineDash([]);
  wx.save();wx.translate(x0-28,(bot+my)/2);wx.rotate(-Math.PI/2);wx.font="12px Jua, sans-serif";wx.textAlign='center';wx.textBaseline='middle';wx.fillStyle='#17324a';wx.fillText('니기리 최소',0,0);wx.restore();
  // 롤 스틱 최소 두께: 세로로 썰기 전, 뗄 여유가 있을 때만 오른쪽에 표시
  if(!b.cuts.length&&rem(b)>CUT.stick+.1){const xr=x0+b.w*u,ry2=top+CUT.stick*hu;wx.strokeStyle='#1d2a24';wx.lineWidth=2;wx.beginPath();wx.moveTo(xr+10,top);wx.lineTo(xr+18,top);wx.lineTo(xr+18,ry2);wx.lineTo(xr+10,ry2);wx.stroke();
    wx.setLineDash([3,4]);wx.strokeStyle='rgba(29,42,36,.55)';wx.lineWidth=1.5;wx.beginPath();wx.moveTo(x0,ry2);wx.lineTo(xr+10,ry2);wx.stroke();wx.setLineDash([]);
    wx.save();wx.translate(xr+27,(top+ry2)/2+ (ry2-top<46?18:0));wx.rotate(Math.PI/2);wx.font="12px Jua, sans-serif";wx.textAlign='center';wx.textBaseline='middle';wx.fillStyle='#1d2a24';wx.fillText('롤 최소',0,0);wx.restore()}
  // 칼자국과 조각 이름
  wx.font="13px Jua, sans-serif";wx.textAlign='center';wx.textBaseline='middle';
  b.cuts.forEach((c,i)=>{for(const pass of [0,1]){wx.strokeStyle=pass?(b.bad[i]?'#c9452f':'#17324a'):'rgba(255,255,255,.85)';wx.lineWidth=pass?2.5:6;wx.beginPath();if(b.bad[i]){wx.moveTo(x0+c*u-3,top-4);wx.lineTo(x0+c*u+3,(top+bot)/2);wx.lineTo(x0+c*u-2,bot+4)}else{wx.moveTo(x0+c*u,top-4);wx.lineTo(x0+c*u,bot+4)}wx.stroke()}});
  const NM={scrap:'자투리',thin:'얇게',normal:'보통',thick:'두껍게'},CL={scrap:'#8a8f94',thin:'#3b7fc4',normal:'#2fa25c',thick:'#c9781e'};
  if(nig){for(const s of segs(b)){const k=classify(s.w),over=s.w>CUT.thick,t=over?'너무 큼':NM[k],cx=x0+(s.a+s.w/2)*u,tw=wx.measureText(t).width+12;
      wx.fillStyle=over?'#c9452f':CL[k];wx.beginPath();wx.roundRect(cx-tw/2,top-30,tw,20,10);wx.fill();wx.fillStyle='#fff';wx.fillText(t,cx,top-19)}}
  else{const t=(b.cuts.length||rem(b)<CUT.stick)?'자투리':'롤 스틱',cx=x0+b.w*u/2,tw=wx.measureText(t).width+12;wx.fillStyle=t==='자투리'?CL.scrap:'#1d2a24';wx.beginPath();wx.roundRect(cx-tw/2,top-30,tw,20,10);wx.fill();wx.fillStyle='#fff';wx.fillText(t,cx,top-19)}
  if(b.sticks){wx.fillStyle='#1d2a24';wx.textAlign='left';wx.fillText('롤 스틱 '+b.sticks+'개',14,WH-14);wx.textAlign='center'}
  // 두께 기준 자
  const ry=Math.min(WH-34,bot+44),items=[['얇게',CUT.scrap,CUT.thin,CL.thin],['보통',CUT.thin,CUT.normal,CL.normal],['두껍게',CUT.normal,CUT.thick,CL.thick]];

  if(w.flash>0){wx.fillStyle='rgba(201,69,47,'+(.25*w.flash)+')';wx.fillRect(0,0,WW,WH)}

function sliceStroke(st){const w=K.work,b=w.b,{u,hu,x0,y0}=sliceGeom(),top=y0+b.top*hu,bot=y0+b.h*hu;
  let x1=1e9,x2=-1e9,y1=1e9,y2=-1e9,sx=0,sy=0;for(const [x,y] of st){x1=Math.min(x1,x);x2=Math.max(x2,x);y1=Math.min(y1,y);y2=Math.max(y2,y);sx+=x;sy+=y}
  const dx=x2-x1,dy=y2-y1,mx=sx/st.length,my=sy/st.length;
  const bad=()=>{w.flash=1;const t0=performance.now();const f=()=>{if(K.work!==w)return;w.flash=Math.max(0,1-(performance.now()-t0)/350);wDraw();if(w.flash>0)requestAnimationFrame(f)};requestAnimationFrame(f)};
  if(dy>dx*1.5){ // 세로 썰기
    if(Math.min(y2,bot)-Math.max(y1,top)<(bot-top)*.6)return;const c=(mx-x0)/u;if(c<=.08||c>=b.w-.08)return;

    const a=clamp(1-(dx/u/2)/(.22*KNIFE.prec),0,1);let i=0;while(i<b.cuts.length&&b.cuts[i]<c)i++;b.cuts.splice(i,0,c);b.bad.splice(i,0,a<.5)}
  else if(dx>dy*1.5){ // 가로 썰기
    if(Math.min(x2,x0+b.w*u)-Math.max(x1,x0)<b.w*u*.6)return;if(b.cuts.length){bad();return}
    const s=(my-top)/hu;if(s<=.1||s>=rem(b)-.1)return;
    if(s>=CUT.stick){K.sticks.push({uid:K.uid++,fid:b.fid,part:b.part,pm:b.pm,area:b.w*s,value:b.w*s*b.v*b.pm});b.sticks++}else addScrap(b.w*s,b.w*s*b.v*b.pm,b.fid);
    b.top+=s}
}
function finishSlice(){const w=K.work,b=w.b,f=FISH_BY[b.fid],val=u=>u*b.v*b.pm,r=rem(b);
  if(r>=1-1e-9){for(const s of segs(b)){const k=classify(s.w);if(k==='scrap'){addScrap(s.w,val(s.w),b.fid);continue}
      const T=THICK[k];if(s.w>CUT.thick)addScrap(s.w-CUT.thick,val(s.w-CUT.thick),b.fid);
      addSushi({type:'n',name:f.name+(b.part?' '+b.part:'')+' 니기리',thick:k,part:b.part||null,stars:T.stars-(s.bad?1:0),price:b.v*b.pm*T.price,fx:fxOf(b.fid,b.pm),dur:T.dur,col:[fleshOf(b.fid,b.pm,b.part)],ing:[b.fid]},1)}

  {name:'유명 초밥집',slots:10,cost:250000,rev:600,r:4,kinds:20},{name:'본점',slots:12,cost:1200000,rev:1500,r:4.5,kinds:28}];
const SELL={base:.25,rate:.15,price:.1,egg:1.5,pen:.5,penFrom:.25,hist:60,minN:20};   // minN: 판매가 몇 건 안 될 때 비중이 튀지 않게 하는 최소 분모

/* 진열 칸은 종류 하나: 니기리는 생선별, 롤·군함·덮밥은 각각 한 칸. 칸 안에는 내가 고른 묶음들이 섞여 있음 */
const catOf=s=>s.type==='n'||s.type==='y'?'n:'+s.ing[0]:s.type;
const catName=c=>c==='r'?'롤':c==='g'?'군함':c==='d'?'덮밥':c==='n:yubu'?'유부초밥':FISH_BY[c.slice(2)].name;
const slotN=sl=>sl.batches.reduce((a,b)=>a+b.count,0);
const fullName=s=>s.name+(s.thick?' · '+THICK[s.thick].name:'');
const rating=()=>SH.hist.length?SH.hist.reduce((a,h)=>a+h,0)/SH.hist.length:3;
function share(cat){return SH.sold.filter(c=>c===cat).length/Math.max(SH.sold.length,SELL.minN)}
function penalty(cat){return 1-SELL.pen*Math.max(0,share(cat)-SELL.penFrom)/(1-SELL.penFrom)}
const priceMul=()=>1+SELL.price*(rating()-3);
const sellPrice=s=>s.price*priceMul()*penalty(catOf(s));
const comeChance=()=>Math.min(1,SELL.base*(1+SELL.rate*(rating()-3))*(1+fx('guest')/100));
const eggW=sl=>sl.cat==='n:tamago'||sl.cat==='n:yubu'?SELL.egg:1;
/* 손님 한 명: 살 개수를 정하고 와서 진열된 것 중 아무거나 집음. 만족 기준도 손님마다 다름 */
SELL.qmax=[3,4,5,6,7];   // 손님 한 명이 사는 최대 개수: 가게 단계마다 하나씩 늘어남
SELL.need=[[2,.15],[3,.30],[4,.35],[5,.20]];
/* 손님 등급: 가게가 커질수록 눈 높은 손님이 섞여 옴. 바라는 등급보다 생선 등급이 한 칸 낮을 때마다 품질을 step만큼 낮게 받아들임 */
SELL.cls=[[1,0,0,0,0],[.75,.25,0,0,0],[.55,.30,.15,0,0],[.40,.30,.20,.10,0],[.30,.25,.20,.15,.10]];SELL.step=.4;
const CLSNAME=['동네 손님','단골','미식가','큰손','귀빈'],TRANK={c:0,u:1,r:2,e:2,v:3,l:4};
function pickClass(){let r=Math.random(),m=SELL.cls[SH.lv];for(let i=0;i<m.length;i++){r-=m[i];if(r<=0)return i}return 0}
const batchRank=b=>(b.ing||[]).reduce((a,id)=>{const f=FISH_BY[String(id).replace('roe_','')];return f?Math.max(a,TRANK[f.tier]):a},0);
const felt=(b,g)=>b.stars-SELL.step*Math.max(0,g-batchRank(b));
/* 평점(소수 한 자리): 손님은 자기 기준보다 한 칸 위(기준 5는 5)를 받아야 만점. 모자란 만큼 그대로 깎임 */
const reviewOf=(need,p)=>Math.round(Math.max(1,Math.min(5,5-Math.max(0,Math.min(5,need+1)-p)))*10)/10;
function pickNeed(){let r=Math.random();for(const [q,p] of SELL.need){r-=p;if(r<=0)return q}return 5}
function customer(){const live=()=>SH.slots.filter(Boolean);if(!live().length)return null;
  const want=1+Math.floor(Math.random()*SELL.qmax[SH.lv]),got={},g=pickClass();let pay=0,minQ=9,n=0;
  for(let k=0;k<want;k++){const ls=live();if(!ls.length)break;let w=ls.reduce((a,sl)=>a+eggW(sl),0),r=Math.random()*w,sl=ls[0];for(const x of ls){r-=eggW(x);if(r<=0){sl=x;break}}
    let c=Math.random()*slotN(sl),b=sl.batches[0];for(const x of sl.batches){c-=x.count;if(c<0){b=x;break}}
    const p=sellPrice(b);pay+=p;n++;minQ=Math.min(minQ,felt(b,g));got[catName(sl.cat)]=(got[catName(sl.cat)]||0)+1;
    SH.sold.push(sl.cat);if(SH.sold.length>SELL.hist)SH.sold.shift();for(const g of b.ing||[])SH.kinds.add(g);
    b.total-=b.price;if(--b.count<=0){sl.batches.splice(sl.batches.indexOf(b),1);if(!sl.batches.length)SH.slots[SH.slots.indexOf(sl)]=null}}
  if(!n)return null;const need=pickNeed(),rev=reviewOf(need,minQ);
  SH.hist.push(rev);if(SH.hist.length>SELL.hist)SH.hist.shift();SH.reviews++;S.money+=pay;
  SH.log.unshift(CLSNAME[g]+' ★'+rev.toFixed(1)+' · '+Object.entries(got).map(([k,v])=>k+' '+v).join(', ')+'  +'+money(pay));if(SH.log.length>8)SH.log.pop();
  return {pay,n,rev,g}}
/* 손님은 찌가 물에 떠 있는 동안에만 옴. 던질 때 이번에 올 손님 수를 정하고(진열 칸마다 한 번씩 추첨), 기다리는 시간 안에 흩어서 도착시킴.
   손님 수가 기다리는 시간 길이와 상관없어서, 입질 속도를 올려도 파는 양은 줄지 않음 */
function planGuests(wait){const n=SH.slots.filter(Boolean).length,p=comeChance(),out=[];for(let i=0;i<n;i++)if(Math.random()<p)out.push(Math.min(Math.max(.15,wait-.1),.3+Math.random()*Math.max(0,wait-.6)));
  S.guests=out.sort((a,b)=>a-b);S.waitT=0;S.castSale={total:0,cnt:0,ppl:0}}
function guestTick(dt){S.waitT+=dt;let hit=false;while(S.guests&&S.guests.length&&S.guests[0]<=S.waitT){S.guests.shift();const r=customer();if(r){const q=S.castSale;q.total+=r.pay;q.cnt+=r.n;q.ppl++;hit=true;salePlank(r)}}
  if(hit)setMoney()}
/* 판매 알림: 오른쪽에 매달린 나무판. 새 손님이 오면 위에 새 판이 걸리고 있던 판은 아래로 밀림 */
const NIGIRI='<svg viewBox="0 0 28 18" aria-hidden="true"><rect x="3" y="8" width="22" height="9" rx="4.5" fill="#fffdf6" stroke="#3b2410" stroke-width="1.6"/><path d="M2 9c2-7 22-7 24 0 0 3-24 3-24 0z" fill="#ff8a5c" stroke="#3b2410" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 5.5l2 4M13 4.6l1.4 4.6M18 5l1 4.2" stroke="#ffd2bd" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
function salePlank(r){const box=$('sales'),el=document.createElement('div');el.className='plank';
  el.innerHTML='<span class="rope"></span><span class="rope r"></span><b>+'+money(r.pay)+'</b><i>'+NIGIRI+'<u>×'+r.n+'</u><em class="s'+(r.rev>=4.5?5:r.rev>=3.5?4:r.rev>=2.5?3:1)+'">★'+r.rev.toFixed(1)+'</em></i><small>'+CLSNAME[r.g]+'</small>';

/* ---------- 특별 주문 ---------- */
const ORD={mult:[1.1,1.15,1.2,1.3,1.5],   // 손님 등급별로 평소 값의 몇 배를 쳐주는지
  chance:.05,        // 평소 값의 1.2배, 빈 자리가 있을 때 입질마다 새 주문이 올 확률
  slots:[3,4,5,6,8],                     // 가게 단계별 동시에 받을 수 있는 주문 수
  grade:[{tiers:'c',q:3,name:'동네 손님'},{tiers:'cu',q:3,rev:30,r:3.5,lv:0,name:'단골'},{tiers:'cure',q:4,rev:150,r:4,lv:1,name:'미식가'},
         {tiers:'curev',q:4,rev:500,r:4.3,lv:2,name:'큰손'},{tiers:'curevl',q:4,rev:1200,r:4.5,lv:3,name:'귀빈'}],
  cap:{c:9,e:9,u:9,r:4,v:3,l:2}};
SH.orders=[];SH.newOrder=false;
/* 특별 주문 손님 등급은 일반 손님과 똑같이 가게 단계로 열림: 포장마차 동네 손님, 작은 가게 단골, 동네 맛집 미식가, 유명 초밥집 큰손, 본점 귀빈 */
function orderGrade(){return Math.min(ORD.grade.length-1,SH.lv)}
/* 주문하는 손님 등급: 지금까지 열린 등급 중에서 섞여 옴. 높은 등급일수록 조금 더 자주 (1:2:3:4:5) */
function pickOrderGrade(){const m=orderGrade();let r=Math.random()*(m+1)*(m+2)/2;for(let i=0;i<=m;i++){r-=i+1;if(r<=0)return i}return m}
function newOrder(){const g=pickOrderGrade(),G=ORD.grade[g],top=G.tiers[G.tiers.length-1];
  const can=FISH.filter(f=>S.rods[f.rod].own&&G.tiers.includes(f.tier)&&(f.tier!=='e'||S.dex[f.id]));const pool=can;if(!pool.length)return null;   // 같은 생선을 여러 손님이 주문해도 됨
  const wt=x=>(x.tier===top?2:1)*(g===2&&PARTS[x.id]?4:1);   // 미식가는 부위가 있는 생선을 더 자주 찾음
  let w=pool.reduce((a,f)=>a+wt(f),0),r=Math.random()*w,f=pool[0];for(const x of pool){r-=wt(x);if(r<=0){f=x;break}}
  let n=Math.min(ORD.cap[f.tier],2+Math.floor(Math.random()*(3+SH.lv))),part=null;
  /* 등급마다 주문 버릇이 다름. 미식가: 가장 싼 부위만 빼고 부위를 골라서. 큰손: 부위는 안 따지고 양을 많이. 귀빈: 가장 비싼 부위만.
     부위는 한 마리에서 조금만 나와서 부위 주문은 개수를 그만큼 줄임 */
  if(g===3)n=Math.min(ORD.cap[f.tier]*3,2*n+2);
  else if((g===2||g===4)&&PARTS[f.id]){const nm=PARTS[f.id].names,np=nm.length,k=g===4?PMULT[np].indexOf(Math.max(...PMULT[np])):1+Math.floor(Math.random()*(np-1));part=nm[k];n=Math.min(n,Math.max(1,Math.round(PCS[np]*SHARE[np][k])))}
  return {uid:K.uid++,fid:f.id,n,q:G.q,grade:g,part}}
const orderName=o=>o.fid==='urchin'?'성게 군함':o.fid==='yubu'?'유부초밥':FISH_BY[o.fid].name+(o.part?' '+o.part:'')+' 니기리';
/* 초밥이 어느 부위인지: 새로 만든 건 part에 적혀 있고, 예전 저장분은 이름에서 찾음 */
const sushiPart=s=>s.part!==undefined?s.part:(P=>P?P.names.find(n=>s.name.includes(' '+n+' '))||null:null)(PARTS[s.ing&&s.ing[0]]);
/* 주문에 낼 수 있는 초밥: 보관함에 있는 그 생선의 니기리(성게는 군함) 중 품질 기준 이상. 품질이 낮은 것부터 냄 */
function orderStock(o){return K.sushi.filter(s=>s.type!=='r'&&s.type!=='d'&&s.ing&&s.ing[0]===o.fid&&s.stars>=o.q&&(!o.part||sushiPart(s)===o.part)).sort((a,b)=>a.stars-b.stars||a.price-b.price)}
const orderHave=o=>orderStock(o).reduce((a,s)=>a+s.count,0);
/* 받을 돈: 낼 수 있으면 실제로 나갈 초밥 기준, 아직 모자라면 보통 크기 생선의 보통 두께 기준 어림값 */
function orderPay(o){if(orderHave(o)>=o.n){let need=o.n,pay=0;for(const s of orderStock(o)){const k=Math.min(need,s.count);pay+=s.price*k;need-=k;if(!need)break}return [pay*priceMul()*ORD.mult[o.grade],true]}
  const f=FISH_BY[o.fid],np=nParts(f),pm=o.part&&PARTS[f.id]?PMULT[np][PARTS[f.id].names.indexOf(o.part)]:1;return [f.price*1.2*2/PCS[np]*pm*o.n*priceMul()*ORD.mult[o.grade],false]}
function orderTick(){if(SH.orders.length<ORD.slots[SH.lv]&&Math.random()<ORD.chance){const o=newOrder();if(o){SH.orders.push(o);SH.newOrder=true;$('shopDot').hidden=false}}}
function fillOrder(o){if(orderHave(o)<o.n)return;let need=o.n;const pay=orderPay(o)[0];
  for(const s of orderStock(o)){const k=Math.min(need,s.count);s.total-=s.price*k;s.count-=k;need-=k;if(s.count<=0)K.sushi.splice(K.sushi.indexOf(s),1);if(!need)break}
  S.money+=pay;SH.kinds.add(o.fid);SH.hist.push(5);if(SH.hist.length>SELL.hist)SH.hist.shift();SH.reviews++;
  SH.log.unshift('★5 · 특별 주문 '+orderName(o)+' '+o.n+'  +'+money(pay));if(SH.log.length>8)SH.log.pop();SH.orders.splice(SH.orders.indexOf(o),1);setMoney();drawFx()}
/* 손님 얼굴: 주문마다 고유 번호로 생김새가 정해지고, 손님 등급에 따라 차림새가 달라짐 */
function faceSVG(o){let x=(o.uid*2654435761)>>>0;const rnd=()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296},pick=a=>a[Math.floor(rnd()*a.length)];
  const g=o.grade,ink='#3a1a14',skin=pick(['#f8d9b8','#f0c59c','#dfa97c','#bd875c','#93603f']),age=g===0?(a=>a<.3?0:a<.72?1:2)(rnd()):1;   // 동네 손님은 젊은이·어른·어르신이 섞임
  const hair=age===2?pick(['#b9b9b9','#e4e4e4','#8f8f8f']):pick(['#2a1b14','#4a2f1c','#6b4a2a','#1c1c22','#8f8f8f','#a85a22']),
    cap=g===0&&age===0&&rnd()<.6,hat=cap||g===4,bald=g===0&&age===2&&rnd()<.4,beard=g===0&&age===1&&rnd()<.4;let style=Math.floor(rnd()*4);if(hat&&style===3)style=0;   // 모자를 쓰면 올림머리는 안 함 (모자를 뚫고 나오지 않게)
  const cloth=[pick(['#2f9aa0','#e8843a','#4f9a55','#d95f7a','#5b7fd0']),pick(['#6b7f3a','#8a5a9a','#3f7fb5','#b0703a']),pick(['#7c1f2a','#2f5d4a','#3b3b6a']),pick(['#7a4a1e','#3a3a44','#5a2f5a','#1f4f4a']),'#1c1c22'][g];
  let h=`<svg viewBox="0 0 80 86" aria-hidden="true" stroke="${ink}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">`;
  if(style===2)h+=`<path d="M21 30C18 8 62 8 59 30L60 50C55 52 54 46 54 40L26 40C26 46 25 52 20 50Z" fill="${hair}"/>`;
  h+=`<path d="M6 86C6 64 22 58 40 58C58 58 74 64 74 86Z" fill="${cloth}"/><rect x="34" y="47" width="12" height="13" fill="${skin}"/>`;
  if(g===1)h+=`<path d="M30 60C30 70 50 70 50 60" fill="none" stroke="#fff8ee" stroke-width="2.5"/>`;
  if(g===0&&age===1)h+=`<path d="M33 58L40 66 47 58 52 62 44 70 40 66 36 70 28 62Z" fill="#fff8ee"/>`;   // 어른: 셔츠 깃

function openGuide(){const d=guideData();$('guideBody').innerHTML=d.map(([t,h],i)=>`<details${i?'':' open'}><summary><i>${i+1}</i>${t}</summary><div class="gc">${h}</div></details>`).join('');

$('guideBtn').addEventListener('click',openGuide);
$('guideX').addEventListener('click',()=>{$('guideSheet').hidden=true});
$('guideBody').addEventListener('toggle',e=>{if(e.target.open)for(const x of $('guideBody').children)if(x!==e.target)x.open=false},true);

/* ---------- 낚싯대 상태창: 릴을 누르면 뜸. 기본값(낚싯대 업그레이드)과 지금 값(모자·미끼·먹은 초밥·물때 포함)을 같이 보여줌 ---------- */
function rodStats(){
  const en=S.lang==='en',T=(ko,e)=>en?e:ko,N=s=>en?I18N.tr(s):s;
  const b=S.bait&&baitStock(S.bait)>0?S.bait:null,live=!!(b&&b.kind==='live'),B=!b||live?NONE:BAIT[b.tier],tide=tideOn();
  // 등급별 실제 확률: 물고기 고르는 식과 같은 가중치로 계산
  const pool=FISH.filter(f=>f.rod===S.rod);
  const dist=(hat,lk,lv)=>{const w={},wt=f=>lv&&f.tier==='c'?0:tierP(f.tier,hat)*(f.tier==='r'||f.tier==='v'||f.tier==='l'?lk:1);let sum=0;for(const f of pool){const x=wt(f);w[f.tier]=(w[f.tier]||0)+x;sum+=x}for(const k in w)w[k]/=sum;return w};
  const d0=dist(0,upv('luck'),false),d1=dist(hatIdx(),(1+fx('luck')/100)*upv('luck')*B.rare*(tide?TIDE.rare:1),live);
  const zone0=upv('power'),zone1=zone0*(1+fx('power')/200);
  const bite0=upv('bite'),bite1=bite0/(1+fx('bite')/100)*(1-B.w)*(tide?TIDE.wait:1);
  const big0=upv('big'),big1=Math.min(.9,big0*(1+fx('big')/100)*B.big);
  const pc=(v,d)=>(v*100).toFixed(d==null?1:d)+'%';
  const row=(name,base,now,fmt,dfmt,lowGood)=>{const diff=now-base,ch=Math.abs(diff)>1e-9,good=lowGood?diff<0:diff>0;
    return `<div class="st"><span>${name}</span><b class="${ch?(good?'up':'dn'):''}">${fmt(now)}${ch?` <small>(${diff>0?'+':'−'}${dfmt(Math.abs(diff))})</small>`:''}</b></div>`};
  const mul=v=>'×'+v.toFixed(2),num=v=>v.toFixed(2),sec=v=>v.toFixed(1)+T('초','s');
  let h=`<h4>${T('싸움','Fight')}</h4>`+row(T('초록 구간','Green zone'),zone0,zone1,mul,num)+row(T('차는 속도','Fill speed'),upv('reel'),upv('reel'),mul,num)+row(T('놓칠 때 버틸 확률','Chance to survive an escape'),upv('line'),upv('line'),v=>pc(v,0),v=>pc(v,0));
  h+=`<h4>${T('입질','Bites')}</h4>`+row(T('입질까지 평균','Average wait'),bite0,bite1,sec,sec,true)+row(T('한 번에','Per cast'),upv('hook'),upv('hook'),v=>v+T('마리',' fish'),v=>v)+row(T('미끼 안 쓸 확률','Chance to keep bait'),upv('bait'),upv('bait'),v=>pc(v,0),v=>pc(v,0));
  h+=`<h4>${T('물고기','Fish')}</h4>`+row(T('대물 확률','Big fish'),big0,big1,pc,pc);
  for(const [t,n] of [['r',T('희귀','Rare')],['v',T('매우 희귀','Very rare')],['l',T('전설','Legend')]])h+=row(n,d0[t]||0,d1[t]||0,v=>pc(v,2),v=>pc(v,2));
  if(!UPG.roe.rods||UPG.roe.rods.includes(S.rod))h+=row(T('알·곤이 확률','Roe chance'),upv('roe'),upv('roe'),v=>pc(v,0),v=>pc(v,0));
  // 지금 값을 바꾸고 있는 것들
  const on=[];if(hatIdx())on.push(N(HATS[hatIdx()].name));
  if(b)on.push(live?T('생미끼','Live bait'):N(TIER[b.tier].name)+T(' 미끼',' bait'));
  for(const t of ['bite','luck','big','power','guest'])if(S.fx[t])on.push(N(fxText([[t,S.fx[t].pts]]))+' · '+S.fx[t].left+T('번',' bites'));
  if(tide)on.push(T('물때','Fish rush'));
  h=`<div class="on">${on.length?on.map(x=>`<i>${x}</i>`).join(''):`<em>${T('적용 중인 효과 없음','No active effects')}</em>`}</div>`+h;
  $('statTitle').textContent=en?N(ROD[S.rod].name)+' rod':ROD[S.rod].name+' 낚싯대';
  $('statBody').innerHTML=h;$('statNote').textContent=T('초록색은 모자·미끼·초밥·물때로 좋아진 값, 괄호는 기본값과의 차이','Green: boosted by hat, bait, sushi or fish rush. Brackets: change from base.');
  $('statSheet').hidden=false}
$('reelBtn').addEventListener('click',()=>{if(S.state==='idle')rodStats()});
$('statX').addEventListener('click',()=>{$('statSheet').hidden=true});
$('fxRow').addEventListener('click',e=>{if(e.target.closest('.fxb')&&S.state==='idle')rodStats()});

for(const ev of ['contextmenu','selectstart','dragstart','gesturestart'])document.addEventListener(ev,e=>e.preventDefault());
document.addEventListener('touchstart',e=>{if(e.cancelable&&!e.target.closest('button,select,label,summary,.sheet'))e.preventDefault()},{passive:false});
load();try{if(localStorage.getItem('fishsushi_lang')==='en')setLang('en')}catch(e){}setMoney();drawFx();drawRods();drawGear();
resize();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(frame));
</script>
<script>try{document.fonts.forEach(f=>f.load())}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
