<style>
:root{
  /* 한 화면 낚시터: 캔버스가 낮 바다, 위에 HUD, 아래에 던지기 버튼과 탭 다섯 개 */
  --sky:#8fd3f6; --sea:#2f8fc4; --deep:#16527c; --wood:#b98954;
  --ink:#17324a; --foam:#f4fbff; --float:#e9463c; --gold:#f2b632;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--deep);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--sea);user-select:none;-webkit-user-select:none}
canvas#sea{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:10px 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chip{pointer-events:auto;background:rgba(244,251,255,.92);border-radius:999px;padding:6px 12px;font-family:var(--display);font-size:17px;box-shadow:0 2px 0 rgba(23,50,74,.18);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chip small{font-family:var(--body);font-size:11px;opacity:.7}
.rods{display:flex;gap:6px;pointer-events:auto}
.rods button{font-family:var(--display);font-size:14px;border:0;border-radius:999px;padding:7px 12px;background:rgba(244,251,255,.6);color:var(--ink);box-shadow:0 2px 0 rgba(23,50,74,.15)}
.rods button[aria-pressed="true"]{background:var(--ink);color:var(--foam)}
.test{pointer-events:auto;font-size:12px;background:rgba(23,50,74,.55);color:var(--foam);border-radius:10px;padding:4px 8px;display:flex;gap:6px;align-items:center}
.test select{font-size:12px;border:0;border-radius:6px;padding:3px 4px;background:var(--foam);color:var(--ink)}
#toast{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);font-family:var(--display);font-size:26px;color:var(--foam);text-shadow:0 2px 0 rgba(23,50,74,.55),0 0 12px rgba(23,50,74,.35);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
#hint{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-size:13px;color:var(--foam);text-shadow:0 1px 0 rgba(23,50,74,.6);pointer-events:none;padding:0 16px}
#castBtn{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);font-family:var(--display);font-size:22px;border:0;border-radius:999px;padding:14px 44px;background:var(--float);color:#fff;box-shadow:0 5px 0 #a82a22,0 8px 16px rgba(23,50,74,.35)}
#castBtn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #a82a22}
#castBtn[hidden]{display:none}
#castBtn:focus-visible,.rods button:focus-visible,nav button:focus-visible,.card button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav{position:absolute;left:0;right:0;bottom:0;height:62px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--foam);border-top:3px solid var(--ink)}
nav button{border:0;background:none;font-family:var(--display);font-size:14px;color:rgba(23,50,74,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
nav button.center{color:var(--foam);background:var(--ink);border-radius:16px 16px 0 0;margin-top:-10px}
.sheet{position:absolute;inset:0;background:rgba(22,82,124,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet[hidden]{display:none}
.card{width:100%;max-width:340px;background:var(--foam);border-radius:22px;border:3px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 10px 0 rgba(23,50,74,.35)}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;text-wrap:balance;text-align:center}
.tier{font-family:var(--display);font-size:14px;color:#fff;border-radius:999px;padding:3px 12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%}
.stats div{background:#e3f1fa;border-radius:12px;padding:8px 4px;text-align:center;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.stats small{display:block;font-family:var(--body);font-size:11px;opacity:.65}

button.chip{border:0;color:var(--ink)}

.slots i{font-style:normal;font-size:11px;opacity:.75;align-self:start;font-variant-numeric:tabular-nums}
.slots i em{font-style:normal;color:#c9452f;font-weight:700}
.slots .star{color:#d99a12;letter-spacing:-1px}
.slots u{position:absolute;top:6px;right:8px;text-decoration:none;font-family:var(--display);font-size:14px}
.slots button.emp{display:flex;align-items:center;justify-content:center;font-size:30px;font-family:var(--display);color:rgba(23,50,74,.35);background:none;border:2px dashed rgba(23,50,74,.25)}
.log{font-size:12px;opacity:.75;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.urow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#e3f1fa;border-radius:12px;padding:8px 10px}

.urow .pip{font-size:9px;letter-spacing:1px;opacity:.6;vertical-align:middle}
.urow i{font-style:normal;font-size:11.5px;opacity:.7;display:block;font-variant-numeric:tabular-nums}
.urow button{border:0;border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:14px;background:var(--ink);color:var(--foam);font-variant-numeric:tabular-nums}
.urow button[disabled]{opacity:.3}
.urow .max{font-family:var(--display);font-size:13px;opacity:.5;padding:0 10px}
#knifeCv{width:100%;height:92px;background:#ecd7b4;border-radius:12px}
#pickList{width:100%;display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
#pickSheet{z-index:5}
.card button.wide{width:100%;padding:10px;font-size:16px;background:#d7e6f0;color:var(--ink)}
.card button.wide[hidden]{display:none}
.card #rMore{font-size:12px;opacity:.75;text-align:center}
.rods button[hidden]{display:none}
#cheat{border:0;font-family:var(--body)}
.card .srow canvas{width:46px;height:38px;background:none;border-radius:0}
#slotSheet{z-index:5}
#slotSheet h2{font-size:22px}
.card button.wide.pri{background:var(--ink);color:var(--foam)}
.card button.wide[disabled]{opacity:.4}
.slots s{position:absolute;bottom:6px;right:8px;text-decoration:none;font-family:var(--display);font-size:12px;background:#2fa25c;color:#fff;border-radius:999px;padding:0 7px}
#slList{width:100%;display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#slList h4{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:14px;opacity:.7}
.slots button{grid-template-rows:auto auto auto}
.slots canvas{grid-row:1/4}
.ord{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;background:#fdf1d6;border:2px solid #e8c877;border-radius:12px;padding:6px 8px}
.ord canvas{width:52px;height:40px}
.ord b{font-family:var(--display);font-weight:400;font-size:15px;display:block}
.ord i{font-style:normal;font-size:11.5px;opacity:.8;display:block;font-variant-numeric:tabular-nums}
.ord .star{color:#c98a12}
.ord .r{display:flex;flex-direction:column;gap:4px}
.ord button{border:0;border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:13px;background:var(--ink);color:var(--foam)}
.ord button.no{background:none;color:rgba(23,50,74,.6);padding:2px 14px}
.ord button[disabled]{opacity:.3}
.onext{font-size:11.5px;opacity:.6;padding:0 2px}
nav button{position:relative}
#shopDot{position:absolute;top:8px;right:22%;width:9px;height:9px;border-radius:50%;background:var(--float);border:2px solid var(--foam)}
#shopDot[hidden]{display:none}
/* ---------- 4단계 ---------- */
#gearRow{display:flex;gap:6px;pointer-events:auto;justify-content:flex-start}
#gearRow button{font-family:var(--display);font-size:13px;border:0;border-radius:999px;padding:5px 12px;background:rgba(244,251,255,.85);color:var(--ink);box-shadow:0 2px 0 rgba(23,50,74,.15)}
#gearRow button[hidden]{display:none}
#fxRow .tide{background:#1f8a70}
#nets{position:absolute;left:10px;bottom:74px;display:grid;grid-template-columns:44px 44px;gap:6px}
#nets button{width:44px;height:44px;border-radius:50%;border:0;padding:0;background:conic-gradient(var(--foam) var(--p,0deg),rgba(244,251,255,.3) 0);display:grid;place-items:center;position:relative}
#nets button::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ink)}
#nets svg{width:22px;height:22px;position:relative;stroke:var(--foam);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
#nets button.rdy{background:var(--gold);box-shadow:0 0 0 3px rgba(242,182,50,.35)}
#nets button.rdy svg{opacity:1}

#baitSheet{z-index:5}
.tl{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tl select{font-size:14px;border:0;border-radius:8px;padding:6px 8px;background:#d7e6f0;color:var(--ink)}
.cell.no{cursor:default}
.cell.no b{opacity:.45}
#kHome .urow button{font-size:13px;padding:7px 12px}
#setSheet{z-index:5}
#langBox button{background:#d7e6f0}
#langBox button[aria-pressed="true"]{background:var(--ink);color:var(--foam)}

#langBox{flex:none}
#langBox button{white-space:nowrap;flex:none}
.tl{gap:10px}
.card #langBox button{font-size:15px;padding:8px 14px;color:var(--ink);background:#d7e6f0}
.card #langBox button[aria-pressed="true"]{background:var(--ink);color:var(--foam)}
#toast{background:rgba(23,50,74,.6);padding:6px 16px;border-radius:999px;font-size:21px;text-shadow:none}
/* ---------- 물때 알림 ---------- */
#tideBanner{position:absolute;left:50%;top:30%;width:max-content;max-width:92%;transform:translate(-50%,-50%) rotate(-4deg);z-index:4;pointer-events:none;text-align:center;padding:12px 26px 10px;border-radius:18px;
  background:linear-gradient(135deg,#ffd24a,#ff8a3c 55%,#ff5a5a);border:4px solid #fff;box-shadow:0 6px 0 #b8431f,0 14px 30px rgba(23,50,74,.45)}
#tideBanner[hidden]{display:none}
#tideBanner b{display:block;font-family:'Black Han Sans',var(--display);font-weight:400;font-size:34px;line-height:1.1;color:#fff;letter-spacing:.5px;-webkit-text-stroke:2px #7a2410;paint-order:stroke fill;text-shadow:0 3px 0 #7a2410}
#tideBanner i{display:block;margin-top:4px;font-style:normal;font-family:var(--display);font-size:14px;color:#5a1d0a}
#tideBanner::before,#tideBanner::after{content:"✦";position:absolute;color:#fff;font-size:26px;text-shadow:0 0 8px #ffe9a0}
#tideBanner::before{left:-12px;top:-16px}#tideBanner::after{right:-10px;bottom:-14px;font-size:20px}
#tideBanner.go{animation:tideIn 3.2s cubic-bezier(.2,1.4,.4,1) both}
#tideBanner.go::before,#tideBanner.go::after{animation:tw .5s ease-in-out infinite alternate}
@keyframes tideIn{0%{transform:translate(-50%,-50%) rotate(-14deg) scale(.2);opacity:0}9%{transform:translate(-50%,-50%) rotate(-2deg) scale(1.12);opacity:1}14%{transform:translate(-50%,-50%) rotate(-5deg) scale(1)}
  20%{transform:translate(-50%,-54%) rotate(-3deg) scale(1.03)}26%{transform:translate(-50%,-50%) rotate(-4deg) scale(1)}88%{transform:translate(-50%,-50%) rotate(-4deg) scale(1);opacity:1}100%{transform:translate(-50%,-90%) rotate(-4deg) scale(.9);opacity:0}}
@keyframes tw{from{transform:scale(.6) rotate(0)}to{transform:scale(1.25) rotate(25deg)}}
.rods button.run{animation:runGlow 1s ease-in-out infinite alternate}
@keyframes runGlow{from{box-shadow:0 0 0 0 rgba(255,210,74,.0),0 2px 0 rgba(23,50,74,.15)}to{box-shadow:0 0 0 4px rgba(255,210,74,.95),0 2px 0 rgba(23,50,74,.15)}}
@media (prefers-reduced-motion:reduce){#tideBanner.go{animation:none}.rods button.run{animation:none;box-shadow:0 0 0 3px rgba(255,210,74,.95)}}
/* ---------- 모자 고르기, 물때 띠 색 ---------- */
#hatSheet{z-index:5}
#hatList{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card #hatList button{background:#e3f1fa;color:var(--ink);border:3px solid transparent;border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px}
.card #hatList button[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.card #hatList canvas{width:100%;height:78px;background:none;border-radius:0}
#hatList b{font-family:var(--display);font-weight:400;font-size:15px}
#hatList i{font-style:normal;font-family:var(--body);font-size:10.5px;opacity:.7;line-height:1.3}
#hatList button.lock b{opacity:.5}
#tideBanner[data-rod="1"]{background:linear-gradient(135deg,#5fd3ff,#2f8fe0 55%,#2d5bd6);box-shadow:0 6px 0 #1c3f96,0 14px 30px rgba(23,50,74,.45)}
#tideBanner[data-rod="1"] b{-webkit-text-stroke:2px #12306e;text-shadow:0 3px 0 #12306e}#tideBanner[data-rod="1"] i{color:#eaf6ff}
#tideBanner[data-rod="2"]{background:linear-gradient(135deg,#c58bff,#8a4fd8 55%,#4b2a9c);box-shadow:0 6px 0 #2f1a66,0 14px 30px rgba(23,50,74,.45)}
#tideBanner[data-rod="2"] b{-webkit-text-stroke:2px #2a1560;text-shadow:0 3px 0 #2a1560}#tideBanner[data-rod="2"] i{color:#f1e6ff}
#netBtn{position:absolute;left:calc(14% - 50px);top:calc(76.2% - 40px);width:100px;height:100px;border:0;padding:0;background:none;border-radius:20px}
#netBtn[hidden]{display:none}
</style>

  <canvas id="sea"></canvas>

  <nav>
    <button type="button" data-tab="book"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h4"/></svg>도감</button>
    <button type="button" data-tab="kitchen"><svg viewBox="0 0 24 24"><path d="M4 15 15 4c3 1 5 3 5 6L10 20z"/><path d="M4 15l-1 5 5-1"/></svg>주방</button>

/* ---------- 유틸 ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');

/* ---------- 그림: 물고기 ---------- */
function drawFish(c,L,a,seed){
  const Hh=L*a.ratio, rnd=mulberry(seed);
  const nose=-L*.5, ped=L*.30, end=L*.5, ph=Hh*.11;
  const dark=mix(a.back,'#000000',.35);
  const body=()=>{c.beginPath();
    if(a.snout){c.moveTo(nose-L*.03,-Hh*.12);c.quadraticCurveTo(nose+L*.05,-Hh*.2,nose+L*.1,-Hh*.38)}
    else c.moveTo(nose,Hh*.02);
    c.bezierCurveTo(nose+L*.10,-Hh*.62,ped-L*.28,-Hh*.56,ped,-ph);
    c.lineTo(ped,ph);
    c.bezierCurveTo(ped-L*.28,Hh*.50,nose+L*.12,Hh*.54,a.snout?nose+L*.06:nose,a.snout?Hh*.12:Hh*.02);
    if(a.snout)c.quadraticCurveTo(nose+L*.01,Hh*.02,nose-L*.03,-Hh*.12);
    c.closePath()};
  c.lineJoin='round';c.lineCap='round';
  // 꼬리
  c.fillStyle=a.fin;c.strokeStyle=dark;c.lineWidth=Math.max(1,L*.006);
  c.beginPath();
  if(a.tail==='lunate'){c.moveTo(ped-2,-ph);c.quadraticCurveTo(ped+(end-ped)*.55,-Hh*.2,end,-Hh*.66);c.quadraticCurveTo(ped+(end-ped)*.42,0,end,Hh*.66);c.quadraticCurveTo(ped+(end-ped)*.55,Hh*.2,ped-2,ph)}
  else if(a.tail==='round'){c.moveTo(ped-2,-ph);c.quadraticCurveTo(end*.9,-Hh*.44,end,-Hh*.3);c.quadraticCurveTo(end+L*.015,0,end,Hh*.3);c.quadraticCurveTo(end*.9,Hh*.44,ped-2,ph)}
  else if(a.tail==='shark'){c.moveTo(ped-2,-ph);c.lineTo(end,-Hh*.95);c.lineTo(ped+(end-ped)*.5,-Hh*.05);c.lineTo(end*.9,Hh*.4);c.lineTo(ped-2,ph)}
  else{c.moveTo(ped-2,-ph);c.quadraticCurveTo(ped+(end-ped)*.5,-Hh*.3,end,-Hh*.48);c.lineTo(ped+(end-ped)*.5,0);c.lineTo(end,Hh*.48);c.quadraticCurveTo(ped+(end-ped)*.5,Hh*.3,ped-2,ph)}
  c.closePath();c.fill();c.stroke();
  // 꼬리 결
  c.save();c.globalAlpha=.25;c.lineWidth=Math.max(.6,L*.003);
  for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(ped+2,i*ph*.25);c.lineTo(end-L*.02,i*Hh*.13);c.stroke()}
  c.restore();
  // 등지느러미
  c.fillStyle=a.fin;
  const fin=(pts)=>{c.beginPath();c.moveTo(pts[0][0]*L,pts[0][1]*Hh);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0]*L,pts[i][1]*Hh);c.closePath();c.fill();c.stroke()};
  if(a.dorsal==='single')fin([[-.10,-.40],[-.04,-.84],[.10,-.38]]);
  if(a.dorsal==='back')fin([[.10,-.34],[.18,-.80],[.24,-.24]]);
  if(a.dorsal==='double'){fin([[-.16,-.40],[-.11,-.86],[-.02,-.58],[.0,-.40]]);fin([[.02,-.40],[.06,-.74],[.2,-.26]])}
  if(a.dorsal==='triple'){fin([[-.2,-.4],[-.15,-.82],[-.08,-.42]]);fin([[-.06,-.42],[0,-.82],[.08,-.38]]);fin([[.1,-.36],[.15,-.7],[.24,-.2]])}
  if(a.dorsal==='long'){c.beginPath();c.moveTo(-.22*L,-.38*Hh);const n=9;for(let i=0;i<=n;i++){const x=(-.22+.42*i/n)*L;const top=(-.82+.3*Math.pow(i/n,1.6))*Hh;c.lineTo(x,top);c.lineTo(x+L*.02,top+Hh*.07)}c.lineTo(.22*L,-.26*Hh);c.closePath();c.fill();c.stroke()}
  if(a.dorsal==='tuna'){fin([[-.14,-.40],[-.10,-.92],[-.06,-.62],[.0,-.42]]);
    c.beginPath();c.moveTo(.02*L,-.38*Hh);c.quadraticCurveTo(.07*L,-1.05*Hh,.12*L,-1.02*Hh);c.quadraticCurveTo(.08*L,-.7*Hh,.11*L,-.32*Hh);c.closePath();c.fillStyle=a.fin2||a.finlets||a.fin;c.fill();c.stroke();
    c.beginPath();c.moveTo(.03*L,.32*Hh);c.quadraticCurveTo(.08*L,.98*Hh,.13*L,.94*Hh);c.quadraticCurveTo(.09*L,.64*Hh,.12*L,.26*Hh);c.closePath();c.fill();c.stroke();c.fillStyle=a.fin}
  // 배, 뒷지느러미
  if(a.dorsal!=='tuna'){fin([[.06,.32],[.11,.70],[.2,.2]])}
  fin([[-.12,.36],[-.08,.76],[-.02,.38]]);
  if(a.finlets){c.fillStyle=a.finlets;for(let i=0;i<5;i++){const x=(.13+i*.035)*L,t=i/5;const yT=-(.42-.25*t)*Hh,yB=(.36-.2*t)*Hh;c.beginPath();c.moveTo(x,yT);c.lineTo(x+L*.022,yT-Hh*.09);c.lineTo(x+L*.03,yT+Hh*.02);c.closePath();c.fill();c.beginPath();c.moveTo(x,yB);c.lineTo(x+L*.022,yB+Hh*.09);c.lineTo(x+L*.03,yB-Hh*.02);c.closePath();c.fill()}}
  if(a.adipose){c.fillStyle=a.fin;c.beginPath();c.ellipse(.22*L,-.30*Hh,L*.018,Hh*.08,-.5,0,7);c.fill();c.stroke()}
  // 몸통
  const g=c.createLinearGradient(0,-Hh*.6,0,Hh*.54);
  g.addColorStop(0,dark);g.addColorStop(.18,a.back);g.addColorStop(.46,mix(a.back,a.belly,.45));g.addColorStop(.66,a.belly);g.addColorStop(1,mix(a.belly,'#8fa3b0',.25));
  body();c.fillStyle=g;c.fill();
  c.save();body();c.clip();
  if(a.flush){const fg=c.createLinearGradient(0,-Hh*.2,0,Hh*.3);fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(.5,a.flush);fg.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=.45;c.fillStyle=fg;c.fillRect(nose+L*.2,-Hh*.3,L*.6,Hh*.7);c.globalAlpha=1}
  // 비늘
  c.strokeStyle='#ffffff';c.globalAlpha=.16;c.lineWidth=Math.max(.6,L*.0035);
  const s=Math.max(4,Hh*.12);
  for(let r=0;r<12;r++){const y=-Hh*.42+r*s*.62;for(let x=nose+L*.24+(r%2)*s*.5;x<ped;x+=s){c.beginPath();c.arc(x,y,s*.5,-1.2,1.2);c.stroke()}}
  c.globalAlpha=1;
  // 무늬
  if(a.pat==='wavy'){c.strokeStyle=mix(a.back,'#001018',.6);c.lineWidth=Math.max(1,L*.009);c.globalAlpha=.8;for(let i=0;i<17;i++){const x=nose+L*.2+i*L*.035;c.beginPath();c.moveTo(x,-Hh*.56);c.bezierCurveTo(x+L*.03,-Hh*.4,x-L*.02,-Hh*.26,x+L*.02,-Hh*.06-rnd()*Hh*.08);c.stroke()}c.globalAlpha=1}
  if(a.pat==='spots'||a.pat==='backspots'){c.fillStyle=mix(a.back,'#000000',.6);const n=a.pat==='spots'?34:22;for(let i=0;i<n;i++){const x=nose+L*.16+rnd()*L*.6,y=-Hh*.5+rnd()*Hh*(a.pat==='spots'?.42:.28);c.beginPath();c.ellipse(x,y,L*.007+rnd()*L*.005,L*.006,0,0,7);c.fill()}}
  if(a.pat==='bluespots'){c.fillStyle='#6fd6f2';for(let i=0;i<26;i++){const x=nose+L*.2+rnd()*L*.52,y=-Hh*.46+rnd()*Hh*.5;c.beginPath();c.arc(x,y,L*.007,0,7);c.fill()}}
  if(a.pat==='row'){c.fillStyle=mix(a.back,'#000000',.55);for(let i=0;i<7;i++){c.beginPath();c.arc(nose+L*.24+i*L*.075,-Hh*.1,L*.012,0,7);c.fill()}}
  if(a.pat==='gillspot'){c.fillStyle='#22313a';c.beginPath();c.arc(nose+L*.24,-Hh*.2,L*.022,0,7);c.fill();c.fillStyle=mix(a.back,'#000000',.4);for(let r=0;r<4;r++)for(let i=0;i<10;i++){c.beginPath();c.arc(nose+L*.28+i*L*.05,-Hh*.4+r*Hh*.1,L*.005,0,7);c.fill()}}
  if(a.pat==='lateral'){c.strokeStyle='#d9c35a';c.lineWidth=Hh*.07;c.globalAlpha=.9;c.beginPath();c.moveTo(nose+L*.2,-Hh*.14);c.quadraticCurveTo(0,-Hh*.2,ped,0);c.stroke();c.globalAlpha=1;c.fillStyle='#22313a';c.beginPath();c.arc(nose+L*.2,-Hh*.16,L*.014,0,7);c.fill()}
  if(a.pat==='stripe'){c.strokeStyle='#e7c53e';c.lineWidth=Hh*.09;c.globalAlpha=.95;c.beginPath();c.moveTo(nose+L*.12,-Hh*.06);c.quadraticCurveTo(0,-Hh*.1,ped,0);c.stroke();c.globalAlpha=1}
  if(a.pat==='bellyspots'){c.fillStyle='#f4f7f9';c.globalAlpha=.75;for(let i=0;i<30;i++){const x=nose+L*.2+rnd()*L*.5,y=Hh*.04+rnd()*Hh*.34;c.beginPath();c.ellipse(x,y,L*.012,L*.006,0,0,7);c.fill()}c.globalAlpha=1}
  if(a.pat==='mottle'){c.fillStyle=mix(a.back,'#3a2d12',.5);c.globalAlpha=.55;for(let i=0;i<40;i++){const x=nose+L*.14+rnd()*L*.64,y=-Hh*.52+rnd()*Hh*.55;c.beginPath();c.ellipse(x,y,L*.012+rnd()*L*.012,L*.008+rnd()*L*.006,rnd()*3,0,7);c.fill()}c.globalAlpha=1}
  if(a.pat==='scutes'){c.fillStyle=mix(a.back,'#ffffff',.45);c.strokeStyle=dark;c.lineWidth=Math.max(.6,L*.003);for(let i=0;i<11;i++){const x=nose+L*.2+i*L*.055,y=-Hh*.04+i*Hh*.004,w=L*.02,h=Hh*.11;c.beginPath();c.moveTo(x-w,y);c.lineTo(x,y-h);c.lineTo(x+w,y);c.lineTo(x,y+h);c.closePath();c.fill();c.stroke()}for(let i=0;i<8;i++){const x=nose+L*.22+i*L*.06;c.beginPath();c.moveTo(x-L*.016,-Hh*.5);c.lineTo(x,-Hh*.62);c.lineTo(x+L*.016,-Hh*.5);c.closePath();c.fill()}}
  // 윤기
  const hg=c.createLinearGradient(0,-Hh*.5,0,-Hh*.1);hg.addColorStop(0,'rgba(255,255,255,0)');hg.addColorStop(.5,'rgba(255,255,255,.28)');hg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=hg;c.fillRect(nose+L*.1,-Hh*.5,L*.6,Hh*.4);

function drawEel(c,L,a,seed){

  path();c.fillStyle=a.back;c.fill();
  c.beginPath();c.moveTo(mid[0][0],mid[0][1]);for(const p of mid)c.lineTo(p[0],p[1]);for(let i=N;i>=0;i--)c.lineTo(bot[i][0],bot[i][1]);c.closePath();c.fillStyle=a.belly;c.fill();

/* 놓친 전설 재도전: 놓친 뒤 같은 낚싯대로 다음 10번의 입질 동안 15% 확률로 다시 걸림 */
const GRUDGE={casts:10,p:.15};
const HARD={c:0,e:0,u:1,r:2,v:3,l:4};
function pickFish(first){
  const force='';
  if(first!==false){const g=S.grudge&&S.grudge[S.rod];S.inGrudge=!!g;
    if(g&&!force){g.left--;const f=g.fish;if(g.left<=0)S.grudge[S.rod]=null;if(Math.random()<GRUDGE.p)return f}}
  let pool=FISH.filter(f=>f.rod===S.rod);
  if(force){const p2=pool.filter(f=>f.tier===force);if(p2.length)pool=p2}
  const lk=(1+fx('luck')/100)*upv('luck')*S.cast.rare*(tideOn()?TIDE.rare:1),wt=f=>S.cast.live&&f.tier==='c'&&!force?0:tierP(f.tier,hatIdx())*(f.tier==='r'||f.tier==='v'||f.tier==='l'?lk:1);
  let sum=0;for(const f of pool)sum+=wt(f);
  let r=Math.random()*sum;for(const f of pool){r-=wt(f);if(r<=0)return f}
  return pool[pool.length-1];
}
/* 대물 확률(길이 상위 10%)에 맞춘 크기 지수 */
function sizeK(){const p=Math.min(.9,upv('big')*(1+fx('big')/100)*S.cast.big);return Math.log(.9)/Math.log(1-p)}
function startCast(){
  if(S.state!=='idle')return;
  S.state='cast';S.castT=0;$('castBtn').hidden=true;
}
function startWait(){S.state='wait';beginCast();S.wait=upv('bite')*(2/3+Math.random()*2/3)/(1+fx('bite')/100)*(1-S.cast.w)*(tideOn()?TIDE.wait:1);S.splash=1;planGuests(S.wait)}
function startBite(){S.state='bite';S.biteT=1.6;
  const n=upv('hook');S.hooked=[pickFish(true)];for(let i=1;i<n;i++)S.hooked.push(pickFish(false));
  S.fish=S.hooked.reduce((a,b)=>HARD[b.tier]>HARD[a.tier]?b:a);
  spendBait();orderTick();tickFx()}
function startFight(){
  const f=S.fish,T=TIER[f.tier],x=Math.pow(Math.random(),sizeK());
  S.f={fish:f,x,zone:Math.min(.9,T.zone*upv('power')*(1+fx('power')/200)),fill:upv('reel'),line:upv('line'),n:.5,v:0,prog:.3,t:0,next:.8,zoneC:.5,phase:Math.random()*6,T};
  S.state='fight';S.hold=true;S.fights++;
  $('toast').classList.remove('on');
}
function startMiss(big){if(!big)S.missLegend=false;S.state='miss';S.missT=0;S.missBig=big;S.missX=S.lastB?S.lastB.x:W*.4;S.missY=S.lastB?S.lastB.y:H*.6;S.missDir=Math.random()<.5?-1:1;}
function endFight(win){
  const F=S.f,hooked=S.hooked&&S.hooked.includes(F.fish)?S.hooked:[F.fish],leg=hooked.find(f=>f.tier==='l');
  if(!win){if(leg&&!S.inGrudge){S.grudge=S.grudge||{};S.grudge[leg.rod]={fish:leg,left:GRUDGE.casts}}S.missLegend=!!leg;S.f=null;startMiss(true);return}
  if(leg&&S.grudge)S.grudge[leg.rod]=null;
  let main=null;const k=sizeK(),got=[];
  for(const f of hooked){const isMain=!main&&f===F.fish,x=isMain?F.x:Math.pow(Math.random(),k),len=f.min+(f.max-f.min)*x;
    const bonus=!!(f.bonus&&Math.random()<(f.bonus.p<1?upv('roe'):1));
    const it={uid:K.uid++,fid:f.id,len,x,bonus};K.inv.push(it);dexAdd(it);S.count++;if(isMain)main=it;else got.push(it)}
  const f=F.fish;$('count').textContent=S.count;

  $('rName').textContent=(main.bonus&&f.bonus.name==='알배기'?'알배기 ':'')+f.name;
  $('rLen').textContent=main.len.toFixed(1)+'cm';$('rSize').textContent=sizeName(main.x);$('rPrice').textContent=money(rawPrice(main));
  const b=$('rBonus');if(main.bonus){b.hidden=false;b.textContent=f.bonus.name==='알배기'?'알이 들어 있어요':f.bonus.name+'가 들어 있어요'}else b.hidden=true;
  const m=$('rMore');m.hidden=!got.length;m.textContent=got.length?'함께 잡음: '+got.map(it=>FISH_BY[it.fid].name+' '+it.len.toFixed(0)+'cm').join(', '):'';

  S.state='result';S.f=null;
}

function scene(t){
  const hz=H*.36;
  let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#5fb8ee');g.addColorStop(1,'#d6f1ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+2);

  const sx=W*.8,sy=H*.1;
  g=ctx.createRadialGradient(sx,sy,4,sx,sy,W*.42);g.addColorStop(0,'rgba(255,250,220,.95)');g.addColorStop(.12,'rgba(255,244,190,.6)');g.addColorStop(1,'rgba(255,244,190,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz);
  ctx.fillStyle='#fff7cf';ctx.beginPath();ctx.arc(sx,sy,W*.055,0,7);ctx.fill();
  // 구름
  ctx.fillStyle='rgba(255,255,255,.92)';
  for(const c of clouds){const x=((c.x+(reduce?0:t*.004*c.s))%1.3-.15)*W,y=c.y*H+H*.07,s=W*.07*c.s;
    for(const [dx,dy,r] of [[0,0,1],[1,.15,.8],[-1,.2,.75],[.5,-.35,.8],[-.45,-.25,.65]]){ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,r*s,0,7);ctx.fill()}}
  // 먼 섬
  ctx.fillStyle='#7fb7a8';ctx.beginPath();ctx.moveTo(W*.02,hz);ctx.quadraticCurveTo(W*.12,hz-H*.05,W*.2,hz-H*.025);ctx.quadraticCurveTo(W*.28,hz-H*.055,W*.4,hz);ctx.fill();
  ctx.fillStyle='#96c8b6';ctx.beginPath();ctx.moveTo(W*.62,hz);ctx.quadraticCurveTo(W*.7,hz-H*.03,W*.82,hz);ctx.fill();
  // 바다
  g=ctx.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#63c3e6');g.addColorStop(.25,'#2f8fc4');g.addColorStop(1,'#16527c');
  ctx.fillStyle=g;ctx.fillRect(0,hz,W,H-hz);
  // 햇빛 반사
  ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#fffbe0';
  for(let i=0;i<22;i++){const y=hz+4+i*i*.9,w=(10+i*4)*(.6+.4*Math.sin(t*1.5+i*1.9)),x=sx+Math.sin(i*2.3+t*.6)*i*2.2;if(y>H*.72)break;ctx.fillRect(x-w/2,y,w,1.6+i*.07)}
  ctx.restore();
  // 물결
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineCap='round';
  for(let i=0;i<13;i++){const p=i/12,y=hz+8+p*p*(H-hz)*.9,amp=2+p*5,len=W*(.12+p*.2);ctx.lineWidth=1+p*1.6;
    for(let k=0;k<3;k++){const x=((k*.37+i*.21+(reduce?0:t*.012*(1+p)))%1.2-.1)*W;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+len/2,y-amp,x+len,y);ctx.stroke()}}
}
function dock(){
  const y=H*.86;
  ctx.fillStyle='#8f6638';ctx.fillRect(0,y,W,H-y);
  ctx.fillStyle='#b98954';for(let i=0;i<8;i++){ctx.fillRect(i*W/7-6,y+2,W/7-4,H-y)}
  ctx.fillStyle='rgba(60,36,12,.35)';ctx.fillRect(0,y,W,5);
  ctx.fillStyle='#6f4c26';for(const x of [W*.06,W*.94]){ctx.fillRect(x-7,y-16,14,H-y+16)}
}
function rodAndLine(t,tip,bx,by,taut){
  const base={x:W*.93,y:H*.84},bend=taut?H*.06:0;

function gauge(){
  const F=S.f,T=F.T,y=H*.2,w=44,h=H*.44;
  const kt=F.kickT>0?F.kickT/.3:0,kamp=Math.min(9,3+Math.abs(F.kickV||0)*9);

  const zh=F.zone*h,zy=y+h-(F.zoneC*h)-zh/2;

  const ny=y+h-F.n*h,inZ=Math.abs(F.n-F.zoneC)<=F.zone/2;
  // 물고기 표시 (초록 구간 가운데)
  {const fx=x+w/2,fy=zy+zh/2,wob=Math.sin(F.t*7)*1.5;
   ctx.fillStyle='#1f7a48';ctx.beginPath();ctx.ellipse(fx-3,fy,12,6.5,0,0,7);ctx.fill();
   ctx.beginPath();ctx.moveTo(fx+7,fy);ctx.lineTo(fx+16,fy-6+wob);ctx.lineTo(fx+16,fy+6+wob);ctx.closePath();ctx.fill();
   ctx.fillStyle='#eafff2';ctx.beginPath();ctx.arc(fx-9,fy-1.5,1.6,0,7);ctx.fill()}
  // 바늘 표시 (내가 움직이는 것)
  {const col=inZ?'#ffffff':'#ff7a6b',cx=x+w/2;
   ctx.strokeStyle='#17324a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-4,ny);ctx.lineTo(x+w+4,ny);ctx.stroke();
   ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x-4,ny);ctx.lineTo(x+w+4,ny);ctx.stroke();
   ctx.fillStyle=col;ctx.strokeStyle='#17324a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,ny,12,0,7);ctx.fill();ctx.stroke();
   ctx.strokeStyle='#17324a';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';
   ctx.beginPath();ctx.moveTo(cx+3,ny-7);ctx.lineTo(cx+3,ny+2);ctx.arc(cx-1,ny+2,4,0,Math.PI);ctx.lineTo(cx-5,ny-1);ctx.stroke();
   ctx.beginPath();ctx.moveTo(cx-5,ny-1);ctx.lineTo(cx-2.5,ny+1);ctx.stroke();
   ctx.beginPath();ctx.arc(cx+3,ny-7.5,1.4,0,7);ctx.stroke();ctx.lineCap='butt';
   if(kt>0){const d=F.kickV>0?-1:1,ay=ny+d*20;ctx.globalAlpha=kt;ctx.fillStyle='#ffb347';ctx.strokeStyle='#17324a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx,ay+d*9);ctx.lineTo(cx-8,ay);ctx.lineTo(cx+8,ay);ctx.closePath();ctx.fill();ctx.stroke();ctx.globalAlpha=1}}
  // 진행 막대
  const px=x+w+8,pw=14;

  if(F.saveT>0){F.saveT-=1/60;ctx.strokeStyle='rgba(95,208,138,'+Math.min(1,F.saveT*2.5)+')';ctx.lineWidth=5;rr(px-3,y-3,pw+6,h+6,9);ctx.stroke()}
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

let last=0;
function frame(ms){
  const now=ms/1000,dt=Math.min(.05,now-last||.016);last=now;S.t=now;
  if(S.toastT>0){S.toastT-=dt*1000;if(S.toastT<=0)$('toast').classList.remove('on')}
  update(dt);stage4Tick();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scene(now);if(tideOn())drawSchool(ctx,now,W,H);drawNet(ctx,now,W,H);
  const home={x:W*.4,y:H*.6},tip0={x:W*.42,y:H*.3};
  let bx=null,by=null,dip=0,taut=false,tip={x:tip0.x,y:tip0.y};
  if(S.state==='cast'){const k=clamp(S.castT/.7,0,1);bx=tip0.x+(home.x-tip0.x)*k;by=tip0.y+(home.y-tip0.y)*k-Math.sin(k*Math.PI)*H*.16}
  else if(S.state==='wait'){bx=home.x;by=home.y;dip=Math.sin(now*2.2)*2}
  else if(S.state==='bite'){bx=home.x;by=home.y;dip=6+Math.sin(now*30)*3}
  else if(S.state==='fight'){const F=S.f;bx=home.x+Math.sin(F.t*3.1+F.phase)*W*.1*(.4+F.T.kick);by=home.y+Math.cos(F.t*2.3)*H*.03;taut=true;tip.x+=Math.sin(F.t*9)*2;tip.y+=H*.03+(S.hold?H*.015:0)}
  if(S.state==='miss'){
    const m=S.missT,mx=S.missX,my=S.missY,big=S.missBig,sc=S.missLegend?2.1:big?1.4:1;
    // 찌가 튕겨 돌아옴
    const k=clamp(m/.55,0,1),e=1-(1-k)*(1-k);
    bx=mx+(tip0.x-mx)*e;by=my+(tip0.y+H*.05-my)*e-Math.sin(k*Math.PI)*H*.1;
    tip.y-=Math.sin(clamp(m/.35,0,1)*Math.PI)*H*.035;
    // 도망가는 그림자
    const d=m*m*W*.9+m*W*.25,a=clamp(1-m/1.0,0,1);
    ctx.fillStyle='rgba(12,40,64,'+(.42*a)+')';ctx.beginPath();ctx.ellipse(mx+S.missDir*d,my+16+m*H*.05,22*sc*(1-m*.3),8*sc*(1-m*.3),S.missDir*.25,0,7);ctx.fill();
    // 물결과 물방울
    for(let i=0;i<3;i++){const r=(m-i*.14)*70*sc;if(r>0){ctx.strokeStyle='rgba(255,255,255,'+clamp(.8-r/(70*sc),0,1)+')';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(mx,my+6,r+6,(r+6)*.3,0,0,7);ctx.stroke()}}
    ctx.fillStyle='rgba(255,255,255,'+clamp(1-m/.7,0,1)+')';
    for(let i=0;i<(big?9:5);i++){const ang=-Math.PI*(.15+.7*((i*37%10)/10)),v=(90+((i*53)%60))*sc,px=mx+Math.cos(ang)*v*m,py=my+Math.sin(ang)*v*m+260*m*m;ctx.beginPath();ctx.arc(px,py,2.2+((i*7)%3)*.6,0,7);ctx.fill()}
  }
  if(bx!==null&&S.state!=='miss')S.lastB={x:bx,y:by};
  // 물고기 그림자
  if(S.state==='bite'||S.state==='fight'){ctx.fillStyle='rgba(12,40,64,.38)';const sz=S.state==='fight'?18+TIER[S.fish.tier].time*2.2:20;ctx.beginPath();ctx.ellipse(bx+Math.sin(now*5)*6,by+16,sz,sz*.36,Math.sin(now*4)*.3,0,7);ctx.fill()}
  if(bx!==null&&S.state!=='fight')bobber(bx,by,dip);
  if(S.state==='miss'&&S.missT>.55)bx=null;
  if(S.state==='fight'){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;for(let i=0;i<5;i++){const a=now*6+i*1.3,r=10+((now*40+i*9)%22);ctx.globalAlpha=1-r/34;ctx.beginPath();ctx.arc(bx+Math.cos(a)*r,by+Math.sin(a)*r*.4,2.5,0,7);ctx.stroke()}ctx.globalAlpha=1}
  if(S.splash>0&&S.state==='wait'){ctx.strokeStyle='rgba(255,255,255,'+S.splash+')';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(home.x,home.y+6,(1-S.splash)*40+8,((1-S.splash)*40+8)*.3,0,0,7);ctx.stroke()}
  dock();
  rodAndLine(now,tip,bx,by,taut);
  if(S.state==='bite'){ctx.fillStyle='#fff';ctx.strokeStyle='#17324a';ctx.lineWidth=5;ctx.font="52px Jua, sans-serif";ctx.textAlign='center';const yy=home.y-34+Math.sin(now*18)*3;ctx.strokeText('!',home.x,yy);ctx.fillText('!',home.x,yy)}
  if(S.state==='fight')gauge();
  requestAnimationFrame(frame);
}
function update(dt){
  if(S.state==='cast'){S.castT+=dt;if(S.castT>=.7)startWait()}
  else if(S.state==='wait'){guestTick(dt);S.wait-=dt;S.splash=Math.max(0,S.splash-dt*1.6);if(S.wait<=0)startBite()}
  else if(S.state==='bite'){S.biteT-=dt;if(S.biteT<=0)startMiss(false)}
  else if(S.state==='miss'){S.missT+=dt;if(S.missT>=1.2){S.state='idle';$('castBtn').hidden=false}}
  else if(S.state==='fight'){
    const F=S.f,T=F.T;F.t+=dt;if(F.kickT>0)F.kickT-=dt;
    const acc=S.hold?CTRL.up:-CTRL.down;F.v+=(acc-CTRL.damp*F.v)*dt;
    if(F.t>=F.next){const kv=(Math.random()<.5?-1:1)*T.kick*(1+.2*F.x)*(.6+.8*Math.random());F.v+=kv;F.kickT=.3;F.kickV=kv;F.next=F.t+T.gap*(.6+.8*Math.random())}
    F.n+=F.v*dt;if(F.n<0){F.n=0;F.v=0}if(F.n>1){F.n=1;F.v=0}
    F.zoneC=.5+T.amp*Math.sin(F.t*1.1+F.phase);
    const inZ=Math.abs(F.n-F.zoneC)<=F.zone/2,a=.7/T.time;
    if(inZ)F.prog+=a*F.fill*dt;else if(F.t>.6)F.prog-=DRAIN*dt;
    if(F.prog>=1)endFight(true);else if(F.prog<=0){if(!F.saved&&Math.random()<F.line){F.saved=true;F.prog=.15;F.saveT=.6}else endFight(false)}
  }
}

  if(shape==='claw'){const r=Math.min(h*.5,w*.2);c.moveTo(x+r,y+h*.06);c.quadraticCurveTo(x,y+h*.08,x,y+h*.5);c.quadraticCurveTo(x,y+h*.94,x+r,y+h*.95);
    c.lineTo(x+w*.6,y+h*.97);c.quadraticCurveTo(x+w*.8,y+h*.98,x+w*.93,y+h*.66);c.quadraticCurveTo(x+w*.8,y+h*.7,x+w*.66,y+h*.54);
    c.quadraticCurveTo(x+w*.86,y+h*.56,x+w,y+h*.22);c.quadraticCurveTo(x+w*.86,y+h*.0,x+w*.6,y+h*.03);c.closePath()}
  else c.roundRect(x,y,w,h,8)}
function drawFlesh(c,x,y,w,h,st,seed){const rnd=mulberry(seed||1),dk=mix(st.c,'#000000',.4);
  const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,mix(st.c,'#ffffff',.16));g.addColorStop(1,mix(st.c,'#000000',.1));
  fleshPath(c,x,y,w,h,st.shape);c.fillStyle=g;c.fill();
  c.save();fleshPath(c,x,y,w,h,st.shape);c.clip();c.lineCap='round';c.lineJoin='round';
  const diag=(col,lw,gap,al)=>{c.strokeStyle=col;c.lineWidth=lw;c.globalAlpha=al;for(let X=x-h;X<x+w+h;X+=gap){c.beginPath();c.moveTo(X,y+h);c.quadraticCurveTo(X+h*.2,y+h*.5,X+h*.55,y);c.stroke()}c.globalAlpha=1};
  const p=st.p;
  if(p==='fat')diag('#ffffff',2.4+st.d*.9,22/Math.sqrt(st.d),.55+.12*st.d);
  else if(p==='lean')diag(dk,1.2,13,.22);
  else if(p==='white'){diag('#8aa0b0',1,15,.2);const cg=c.createLinearGradient(0,y,0,y+h);cg.addColorStop(0,'rgba(240,150,150,0)');cg.addColorStop(.5,'rgba(240,150,150,.16)');cg.addColorStop(1,'rgba(240,150,150,0)');c.fillStyle=cg;c.fillRect(x,y,w,h)}
  else if(p==='marble'){diag('#ffffff',2,24/st.d,.5);c.strokeStyle='#ffffff';c.globalAlpha=.75;const n=Math.round(w*h/260*st.d);for(let i=0;i<n;i++){const px=x+rnd()*w,py=y+rnd()*h,l=6+rnd()*14;c.lineWidth=.8+rnd()*1.8;c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(px+l*.5,py+(rnd()-.5)*8,px+l,py+(rnd()-.5)*10);c.stroke()}c.globalAlpha=1}
  else if(p==='sinew'){diag(dk,1.4,16,.3);c.strokeStyle='#f6dede';c.globalAlpha=.55;c.lineWidth=2;for(let i=0;i<3;i++){const py=y+h*(.25+i*.25);c.beginPath();c.moveTo(x,py);for(let X=x;X<=x+w;X+=18)c.lineTo(X,py+Math.sin(X*.09+i)*4);c.stroke()}c.globalAlpha=1}
  else if(p==='flake'){c.strokeStyle=dk;c.globalAlpha=.22;c.lineWidth=1.4;for(let X=x-10;X<x+w+20;X+=20){c.beginPath();c.moveTo(X,y);c.lineTo(X+12,y+h/2);c.lineTo(X,y+h);c.stroke()}c.globalAlpha=1}
  else if(p==='hatch'||p==='score'){c.strokeStyle='#9a8f84';c.globalAlpha=.35;c.lineWidth=1;for(let X=x-h;X<x+w+h;X+=9){c.beginPath();c.moveTo(X,y+h);c.lineTo(X+h*.6,y);c.stroke();if(p==='hatch'){c.beginPath();c.moveTo(X,y);c.lineTo(X+h*.6,y+h);c.stroke()}}c.globalAlpha=1}
  else if(p==='bands'){c.fillStyle='#f0764a';c.globalAlpha=.75;for(let X=x+6;X<x+w;X+=24){c.beginPath();c.roundRect(X,y+h*.08,9,h*.84,4);c.fill()}c.globalAlpha=1}
  else if(p==='layers'){c.strokeStyle='#d9a521';c.lineWidth=1.6;c.globalAlpha=.8;for(let Y=y+h/6;Y<y+h-2;Y+=h/6){c.beginPath();c.moveTo(x,Y);c.lineTo(x+w,Y);c.stroke()}c.globalAlpha=1}
  else if(p==='glaze'){const gg=c.createLinearGradient(0,y,0,y+h);gg.addColorStop(0,'rgba(60,25,5,.55)');gg.addColorStop(.45,'rgba(60,25,5,.1)');gg.addColorStop(.46,'rgba(255,240,210,.35)');gg.addColorStop(1,'rgba(255,240,210,.5)');c.fillStyle=gg;c.fillRect(x,y,w,h);
    c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2.5;for(let X=x+8;X<x+w;X+=34){c.beginPath();c.moveTo(X,y+h*.14);c.lineTo(X+14,y+h*.14);c.stroke()}c.strokeStyle=dk;c.globalAlpha=.4;c.lineWidth=1.2;for(let X=x+10;X<x+w;X+=12){c.beginPath();c.moveTo(X,y+h*.5);c.lineTo(X-3,y+h);c.stroke()}c.globalAlpha=1}
  else if(p==='fibre'||p==='ribs'){c.strokeStyle=p==='ribs'?'#b9ae98':dk;c.globalAlpha=p==='ribs'?.6:.2;c.lineWidth=p==='ribs'?2.2:1;for(let X=x+4;X<x+w;X+=(p==='ribs'?9:6)/Math.sqrt(st.d)){c.beginPath();c.moveTo(X,y+2);c.lineTo(X+(rnd()-.5)*3,y+h-2);c.stroke()}c.globalAlpha=1}
  else if(p==='wave'){c.strokeStyle=dk;c.globalAlpha=.3;c.lineWidth=1.4;for(let Y=y+8;Y<y+h;Y+=11){c.beginPath();c.moveTo(x,Y);for(let X=x;X<=x+w;X+=10)c.lineTo(X,Y+Math.sin(X*.12+Y)*3);c.stroke()}c.globalAlpha=1}
  else if(p==='suck'){c.fillStyle='#fbf4ee';c.strokeStyle='#96384f';c.lineWidth=1.5;for(let X=x+12;X<x+w;X+=20){c.beginPath();c.arc(X,y+h*.3,4.5,0,7);c.fill();c.stroke()}}
  else if(p==='speck'){for(let i=0,n=Math.round(w*h/26);i<n;i++){const px=x+rnd()*w,py=y+rnd()*h,r=.8+rnd()*2.2;c.fillStyle=rnd()<.65?'rgba(22,28,14,.55)':'rgba(112,124,84,.6)';c.beginPath();c.arc(px,py,r,0,7);c.fill()}}
  else if(p==='scallop'){c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.roundRect(x+6,y+h*.1,w-12,h*.14,6);c.fill();
    const by=y+h*.42,bh=h*.2;c.fillStyle='#fffaf0';c.beginPath();c.roundRect(x-4,by,w+8,bh,bh/2);c.fill();c.strokeStyle='rgba(170,130,70,.45)';c.lineWidth=1.2;c.stroke();
    c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.roundRect(x+8,by+bh*.2,w-16,bh*.22,3);c.fill()}
  else if(p==='gloss'){c.fillStyle='rgba(255,255,255,.4)';c.beginPath();c.roundRect(x+6,y+h*.12,w-12,h*.16,6);c.fill()}
  if(st.shape==='claw'){const tg=c.createLinearGradient(x+w*.7,0,x+w,0);tg.addColorStop(0,'rgba(210,67,47,0)');tg.addColorStop(1,'rgba(210,67,47,.9)');c.fillStyle=tg;c.fillRect(x+w*.7,y,w*.3,h)}
  if(st.chiai===1){c.fillStyle='#8f2b33';c.globalAlpha=.8;c.fillRect(x,y+h*.06,w,h*.2);c.globalAlpha=1}
  if(st.chiai===2){const cg=c.createLinearGradient(0,y+h*.12,0,y+h*.42);cg.addColorStop(0,'rgba(140,70,60,.75)');cg.addColorStop(1,'rgba(140,70,60,0)');c.fillStyle=cg;c.fillRect(x,y+h*.12,w,h*.3)}
  if(st.skin){const [sc,sp]=st.skin,sh=Math.max(7,h*.15);c.fillStyle=sc;c.fillRect(x,y,w,sh);
    if(sp==='dots'){c.fillStyle='rgba(20,40,60,.55)';for(let X=x+8;X<x+w;X+=13){c.beginPath();c.arc(X,y+sh/2,1.8,0,7);c.fill()}}
    if(sp==='wavy'){c.strokeStyle='#143a4a';c.lineWidth=2;for(let X=x+4;X<x+w;X+=10){c.beginPath();c.moveTo(X,y);c.quadraticCurveTo(X+5,y+sh/2,X,y+sh);c.stroke()}}
    if(sp==='line'){c.strokeStyle='#d9c35a';c.lineWidth=3;c.beginPath();c.moveTo(x,y+sh*.6);c.lineTo(x+w,y+sh*.6);c.stroke()}
    if(sp==='shine'){c.fillStyle='rgba(255,255,255,.7)';c.fillRect(x,y+sh*.25,w,sh*.3)}
    c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1;c.beginPath();c.moveTo(x,y+sh);c.lineTo(x+w,y+sh);c.stroke()}
  c.restore();
  c.strokeStyle=dk;c.lineWidth=2.5;fleshPath(c,x,y,w,h,st.shape);c.stroke()}
const K={inv:[],blocks:[],sticks:[],sushi:[],scrap:{c:{u:0,v:0},u:{u:0,v:0},r:{u:0,v:0},e:{u:0,v:0},v:{u:0,v:0},l:{u:0,v:0}},uid:1,sel:[],work:null,cur:null};
const scrapSum=()=>Object.values(K.scrap).reduce((a,x)=>({u:a.u+x.u,v:a.v+x.v}),{u:0,v:0});
S.fx={};

const nParts=f=>PARTS[f.id]?PARTS[f.id].names.length:1;
const sized=it=>FISH_BY[it.fid].price*(.8+1.2*it.x);
const rawPrice=it=>sized(it)*(it.bonus?RAWBONUS:1);
const unitsOf=f=>PCS[nParts(f)]*KNIFE.yield/.6;
const unitV=it=>sized(it)*2/PCS[nParts(FISH_BY[it.fid])];
const sizeName=x=>x<.33?'작음':x<.67?'보통\u200c':x<.9?'큼':'대물';
const fxOf=(fid,pm,k)=>EFX[fid].map(([t,p])=>[t,Math.round(p*pm*(k||1))]);
const fx=t=>S.fx[t]?S.fx[t].pts:0;
function fxText(list){return list.map(([t,p])=>FXN[t]+' +'+(t==='power'?p/2:p)+'%').join(' · ')}
function setMoney(){const m=money(S.money);for(const id of ['money','kMoney','sMoney','tMoney'])$(id).textContent=m}
function drawFx(){const r=$('fxRow');r.innerHTML='';if(S.tide.end>now()){const s=document.createElement('span');s.className='tide';s.textContent=ROD[S.tide.rod].name+' 물때';r.appendChild(s)}for(const t in S.fx){const s=document.createElement('span');s.textContent=fxText([[t,S.fx[t].pts]])+' · '+S.fx[t].left;r.appendChild(s)}
  $('sushiN').textContent=K.sushi.reduce((a,s)=>a+(s.fx.length?s.count:0),0)}
function tickFx(){for(const t in S.fx){if(--S.fx[t].left<=0)delete S.fx[t]}drawFx()}

/* ---------- 초밥 보관 ---------- */
function addSushi(o,n){if(n<=0)return;const key=[o.type,o.name,o.thick||'',o.stars].join('|');let s=K.sushi.find(x=>x.key===key);
  if(!s){s=Object.assign({key,count:0,total:0},o);K.sushi.push(s)}s.count+=n;s.total+=o.price*n;s.price=s.total/s.count}
function eat(key){const s=K.sushi.find(x=>x.key===key);if(!s||!s.fx.length)return;
  for(const [t,p] of s.fx){const c=S.fx[t];if(!c||p>=c.pts)S.fx[t]={pts:p,left:s.dur}}
  s.total-=s.price;if(--s.count<=0)K.sushi.splice(K.sushi.indexOf(s),1);drawFx()}
function addScrap(units,value,fid){if(units<=1e-6)return;const sc=K.scrap[FISH_BY[fid].tier];sc.u+=units;sc.v+=value}

/* ---------- 그림: 초밥 아이콘 ---------- */
function drawSushi(can,s){const r=can.getBoundingClientRect(),d=Math.min(3,window.devicePixelRatio||1);can.width=Math.round(r.width*d);can.height=Math.round(r.height*d);
  const c=can.getContext('2d');c.setTransform(d,0,0,d,0,0);const w=r.width,h=r.height,col=s.col||['#ff9a6b'];
  c.lineJoin='round';c.lineWidth=1.5;c.strokeStyle='#17324a';
  const rice=()=>{c.fillStyle='#fffdf6';c.beginPath();c.ellipse(w/2,h*.66,w*.36,h*.2,0,0,7);c.fill();c.stroke()};
  if(s.type==='n'){rice();const t=s.thick==='thin'?.13:s.thick==='thick'?.26:.19;c.fillStyle=col[0];c.beginPath();c.moveTo(w*.08,h*.6);c.quadraticCurveTo(w*.5,h*(.5-t*1.6),w*.92,h*.6);c.quadraticCurveTo(w*.94,h*.7,w*.86,h*.7);c.quadraticCurveTo(w*.5,h*(.62-t*.4),w*.14,h*.7);c.quadraticCurveTo(w*.06,h*.7,w*.08,h*.6);c.fill();c.stroke();
    c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.2;for(let i=1;i<4;i++){c.beginPath();c.moveTo(w*(.2+i*.15),h*(.6-t));c.lineTo(w*(.24+i*.15),h*.64);c.stroke()}}
  else if(s.type==='r'){c.fillStyle='#1d2a24';c.beginPath();c.arc(w/2,h/2,h*.44,0,7);c.fill();c.stroke();c.fillStyle='#fffdf6';c.beginPath();c.arc(w/2,h/2,h*.36,0,7);c.fill();
    col.forEach((k,i)=>{const a=i/col.length*Math.PI*2-1.57,rr=col.length>1?h*.12:0;c.fillStyle=k;c.beginPath();c.arc(w/2+Math.cos(a)*rr,h/2+Math.sin(a)*rr,h*(col.length>1?.12:.17),0,7);c.fill();c.stroke()})}
  else if(s.type==='g'){c.fillStyle='#1d2a24';c.beginPath();c.roundRect(w*.18,h*.36,w*.64,h*.5,6);c.fill();c.stroke();c.fillStyle=col[0];for(let i=0;i<6;i++){c.beginPath();c.arc(w*(.28+i%3*.22),h*(.3+(i>2?.1:0)),h*.11,0,7);c.fill();c.stroke()}}
  else if(s.type==='y'){c.fillStyle='#c98a3c';c.beginPath();c.moveTo(w*.14,h*.36);c.quadraticCurveTo(w*.5,h*.26,w*.86,h*.36);c.lineTo(w*.8,h*.84);c.quadraticCurveTo(w*.5,h*.92,w*.2,h*.84);c.closePath();c.fill();c.stroke();c.fillStyle='#fffdf6';c.beginPath();c.ellipse(w/2,h*.36,w*.3,h*.1,0,0,7);c.fill();c.stroke()}
  else{c.fillStyle='#f4efe4';c.beginPath();c.ellipse(w/2,h*.44,w*.4,h*.14,0,0,7);c.fill();c.stroke();c.fillStyle='#e9b7a8';for(let i=0;i<5;i++){c.beginPath();c.arc(w*(.3+i*.1),h*(.4+(i%2)*.05),h*.07,0,7);c.fill()}
    c.fillStyle='#3b5d7a';c.beginPath();c.moveTo(w*.1,h*.46);c.quadraticCurveTo(w*.5,h*1.15,w*.9,h*.46);c.quadraticCurveTo(w*.5,h*.66,w*.1,h*.46);c.fill();c.stroke()}
}

/* ---------- 주방 첫 화면 ---------- */
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function sushiRow(s,i,lab,attr){lab=lab||'먹기';attr=attr||'eat';const show=attr!=='eat'||s.fx.length;return `<div class="srow"><canvas data-si="${i}"></canvas><div><b>${s.name}${s.thick?' · '+THICK[s.thick].name:''}</b><i><span class="star">${stars(s.stars)}</span> ${money(s.price)}</i><i>${s.fx.length?fxText(s.fx)+' · '+s.dur+'번':'효과 없음'}</i></div><div class="r"><span class="n">×${s.count}</span>${show?`<button type="button" data-${attr}="${s.key}">${lab}</button>`:''}</div></div>`}
function paintSushi(root){root.querySelectorAll('canvas[data-si]').forEach(cn=>drawSushi(cn,K.sushi[+cn.dataset.si]))}
function kHome(){
  K.work=null;$('kWork').hidden=true;const el=$('kHome');el.hidden=false;setMoney();
  let h=`<h3>보관함 <small>${K.inv.length}마리</small></h3>`;
  h+=K.inv.length?'<div class="inv">'+K.inv.map(it=>{const f=FISH_BY[it.fid];return `<button type="button" data-inv="${it.uid}"><u style="background:${TIER[f.tier].color}"></u>${it.bonus?`<em>${f.bonus.name}</em>`:''}<canvas data-fid="${f.id}"></canvas><b>${f.name}</b><i>${it.len.toFixed(1)}cm</i></button>`}).join('')+'</div>':'<div class="empty">잡은 생선이 여기에 쌓여요</div>';
  if(K.blocks.length)h+=`<h3>손질할 덩이</h3><div class="pills">`+K.blocks.map(b=>`<button type="button" data-block="${b.uid}">${FISH_BY[b.fid].name}${b.part?' '+b.part:''}<small>${b.w.toFixed(1)}조각</small></button>`).join('')+'</div>';
  if(K.sticks.length){h+=`<h3>롤 재료 <small>서로 다른 생선 3개까지</small></h3><div class="pills">`+K.sticks.map(s=>`<button type="button" data-stick="${s.uid}" aria-pressed="${K.sel.includes(s.uid)}">${FISH_BY[s.fid].name}${s.part?' '+s.part:''}<small>${money(s.value)}</small></button>`).join('')+`</div><button type="button" class="act" data-roll ${K.sel.length?'':'disabled'}>롤 말기</button>`}
  h+=`<h3>초밥 <small>${K.sushi.reduce((a,s)=>a+s.count,0)}개</small></h3>`;
  h+=K.sushi.length?K.sushi.map((s,i)=>sushiRow(s,i)).join(''):'<div class="empty">생선을 손질하면 초밥이 생겨요</div>';
  const ss=scrapSum();if(ss.u>1e-6||Object.values(K.bait).some(Boolean)){h+=`<h3>자투리 <small>${ss.u.toFixed(1)}조각 분량 · ${money(ss.v)}</small></h3><button type="button" class="act" data-bowl ${ss.u>=1?'':'disabled'}>전부 자투리 덮밥으로 · ${money(ss.v*BOWL)}</button>`;
    for(const t of ['c','u','r','e','v','l']){const sc=K.scrap[t],n=Math.floor(sc.u/BAITUNIT+1e-9);if(sc.u>1e-6||K.bait[t])h+=`<div class="urow"><div><b>${TIER[t].name} 자투리 ${sc.u.toFixed(1)}조각${K.bait[t]?' · 미끼 '+K.bait[t]+'개':''}</b><i>${baitText(t)}</i></div><button type="button" data-mkbait="${t}" ${n?'':'disabled'}>미끼 ${n}개 만들기</button></div>`}}
  el.innerHTML=h;
  el.querySelectorAll('canvas[data-fid]').forEach(cn=>drawArt(cn,FISH_BY[cn.dataset.fid]));paintSushi(el);
}
$('kHome').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.inv)openFish(K.inv.find(i=>i.uid==d.inv));
  else if(d.block)startSlice(K.blocks.find(x=>x.uid==d.block));
  else if(d.stick){const u=+d.stick,i=K.sel.indexOf(u);if(i>=0)K.sel.splice(i,1);else{const s=K.sticks.find(x=>x.uid===u);const same=K.sel.find(v=>K.sticks.find(x=>x.uid===v).fid===s.fid);if(same)K.sel.splice(K.sel.indexOf(same),1);if(K.sel.length<3)K.sel.push(u)}kHome()}
  else if('roll' in d)makeRoll();
  else if('bowl' in d){addSushi({type:'d',name:'자투리 덮밥',stars:3,price:scrapSum().v*BOWL,fx:[],dur:0,ing:[]},1);for(const t in K.scrap)K.scrap[t]={u:0,v:0};kHome()}
  else if(d.mkbait){makeBait(d.mkbait);kHome()}
  else if(d.eat){eat(d.eat);kHome()}
});
function makeRoll(){const st=K.sel.map(u=>K.sticks.find(x=>x.uid===u));if(!st.length)return;const m={};
  for(const s of st)for(const [t,p] of fxOf(s.fid,s.pm,ROLLK))m[t]=(m[t]||0)+p;
  addSushi({type:'r',name:st.map(s=>FISH_BY[s.fid].name).join('·')+' 롤',stars:4,price:st.reduce((a,s)=>a+s.value,0),fx:Object.entries(m),dur:20,col:st.map(s=>fleshOf(s.fid,s.pm,s.part)),ing:st.map(s=>s.fid)},1);
  K.sticks=K.sticks.filter(s=>!K.sel.includes(s.uid));K.sel=[];kHome()}

/* ---------- 생선 한 마리 ---------- */
function openFish(it){if(!it)return;K.cur=it;const f=FISH_BY[it.fid];
  $('fsTier').textContent=TIER[f.tier].name;$('fsTier').style.background=TIER[f.tier].color;$('fsName').textContent=f.name;
  $('fsLen').textContent=it.len.toFixed(1)+'cm';$('fsSize').textContent=sizeName(it.x);
  const auto=f.id==='urchin'||f.id==='yubu';
  $('fsPcs').textContent=unitsOf(f).toFixed(auto?0:1)+'조각';
  const b=$('fsBonus');if(it.bonus){b.hidden=false;b.textContent=BONUSFX[f.id][0]+' 군함 2개가 나와요'}else b.hidden=true;
  $('fsSell').textContent=money(rawPrice(it))+'에 팔기';
  $('fsPrep').textContent=f.id==='urchin'?'군함 만들기':f.id==='yubu'?'유부초밥 만들기':PARTS[f.id]?'해체하기':'썰기';
  $('fsAuto').hidden=!(S.knife.auto&&f.tier==='c'&&!auto&&!PARTS[f.id]);
  $('fishSheet').hidden=false;drawArt($('fsArt'),f)}
$('fsX').addEventListener('click',()=>{$('fishSheet').hidden=true});

/* 손질을 실제로 시작한 순간에만 보관함에서 빠지고 알·간 군함이 나옴 (해체 화면에서 그냥 나가면 생선은 그대로) */

const wcv=$('wCv'),wx=wcv.getContext('2d');let WW=0,WH=0;
function wResize(){const r=wcv.getBoundingClientRect(),d=Math.min(3,window.devicePixelRatio||1);WW=r.width;WH=r.height;wcv.width=Math.round(WW*d);wcv.height=Math.round(WH*d);wx.setTransform(d,0,0,d,0,0)}

function wpos(e){const r=wcv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function drawStroke(st,col){if(!st||st.length<2)return;wx.strokeStyle=col||'rgba(23,50,74,.85)';wx.lineWidth=3;wx.lineCap='round';wx.lineJoin='round';wx.beginPath();wx.moveTo(st[0][0],st[0][1]);for(const p of st)wx.lineTo(p[0],p[1]);wx.stroke()}

/* ---------- 해체 ---------- */
function dense(pts){const out=[];for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1],n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/4));for(let k=0;k<n;k++)out.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n])}out.push(pts[pts.length-1]);return out}
function smooth(pts){if(pts.length<3)return pts;const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];for(let k=0;k<10;k++){const t=k/10,t2=t*t,t3=t2*t;out.push([.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}out.push(pts[pts.length-1]);return out}
function gutLayout(){const w=K.work,g=partGeom(w.f,WW,WH);w.box=g.box;w.lines=g.lines;w.labels=g.labels}
function partGeom(f,WW,WH){const w={},a=f.art,P=PARTS[f.id];
  const bw=WW-24,bh=Math.min(WH-70,WW*.8),cx=WW/2,cy=WH/2-6;
  const asp=a.k==='fish'?Math.max(.3,a.ratio*(a.dorsal==='tuna'?2.2:1.7)):ASPECT[a.k],L=Math.min(bw*.9,bh*.9/asp);
  w.box={cx,cy,bw,bh,L};let lines=[],labels=[];
  if(P.eel){const sp=t=>[cx-L/2+L*t,cy+Math.sin(t*Math.PI*2*a.waves+.6)*L*a.amp],th=L*a.thick;
    const s=[];for(let t=.1;t<=.701;t+=.03)s.push(sp(t));lines.push(s);const p=sp(.7);lines.push([[p[0]+th*.3,p[1]-th*1.9],[p[0]-th*.3,p[1]+th*1.9]]);
    const m=sp(.4),q=sp(.86);labels=[[m[0],m[1]-th*2.2],[m[0],m[1]+th*2.4],[q[0],q[1]-th*2.2]]}
  else{const sy=a.k==='fish'?L*a.ratio:L,dy=(P.dy||0)*L,rot=a.k==='abalone'?-.12:0,cs=Math.cos(rot),sn=Math.sin(rot);
    const tp=([x,y])=>{const X=x*L,Y=y*sy;return [cx+X*cs-Y*sn,cy+dy+X*sn+Y*cs]};
    if(P.arc)for(const A of P.arc){const s=[];for(let d=A.a[0];d<=A.a[1];d+=6){const r=d*Math.PI/180;s.push(tp([A.c[0]+Math.cos(r)*A.r[0],A.c[1]+Math.sin(r)*A.r[1]]))}lines.push(s)}
    if(P.lines)for(const l of P.lines)lines.push(smooth(l.map(tp)));
    labels=P.labels.map(tp)}
  w.lines=lines.map(dense);w.labels=labels;return w}
function startGut(it){const f=FISH_BY[it.fid];K.work={mode:'gut',it,f,done:[],stroke:null};showWork();gutLayout();
  $('wName').textContent=f.name+' 해체';$('wSkip').hidden=false;$('wSkip').textContent='건너뛰고 통째로';$('wDone').textContent='썰러 가기';gutInfo();wDraw()}
function gutInfo(){const w=K.work,n=w.lines.length;$('wInfo').textContent='선 '+w.done.length+' / '+n+(w.done.length?' · 정확도 '+Math.round(avg(w.done)*100)+'%':'');$('wDone').disabled=w.done.length<n}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function gutDraw(){const w=K.work,b=w.box;board();
  drawCreature(wx,w.f,b.cx,b.cy,b.bw,b.bh);
  w.lines.forEach((l,i)=>{const dn=i<w.done.length,cur=i===w.done.length;wx.lineCap='round';wx.lineJoin='round';
    wx.setLineDash(dn?[]:[7,7]);wx.lineWidth=dn?4:cur?4:2.5;
    wx.strokeStyle=dn?(w.done[i]>.66?'#2fa25c':w.done[i]>.33?'#e0a020':'#e0523f'):cur?'#ffffff':'rgba(255,255,255,.55)';
    if(!dn){wx.save();wx.strokeStyle='rgba(23,50,74,.75)';wx.lineWidth+=3;wx.setLineDash([]);wx.globalAlpha=cur?.9:.35;wx.beginPath();wx.moveTo(l[0][0],l[0][1]);for(const p of l)wx.lineTo(p[0],p[1]);wx.stroke();wx.restore()}
    wx.beginPath();wx.moveTo(l[0][0],l[0][1]);for(const p of l)wx.lineTo(p[0],p[1]);wx.stroke();wx.setLineDash([]);
    if(cur){for(const p of [l[0],l[l.length-1]]){wx.fillStyle='#fff';wx.strokeStyle='#17324a';wx.lineWidth=2;wx.beginPath();wx.arc(p[0],p[1],7,0,7);wx.fill();wx.stroke()}}});
  partLabels(wx,w.f,w.labels);
  drawStroke(w.stroke);knifeOverlay(wx,WW,WH,w.stroke)}
function gutStroke(st){const w=K.work,i=w.done.length;if(i>=w.lines.length)return;const l=w.lines[i],A=l[0],B=l[l.length-1],s0=st[0],s1=st[st.length-1];
  const d=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]),R=36;
  if(!((d(s0,A)<R&&d(s1,B)<R)||(d(s0,B)<R&&d(s1,A)<R)))return;
  let sum=0;for(const p of st){let m=1e9;for(const q of l){const v=d(p,q);if(v<m)m=v}sum+=m}
  const mean=sum/st.length;w.done.push(clamp(1-(mean-3)/(GUT.tol*KNIFE.prec),0,1));gutInfo()}
function finishGut(skip){const w=K.work,it=w.it,f=w.f,U=unitsOf(f),v=unitV(it),n=nParts(f);let first;commit(it);
  if(skip){first=mkBlock(it,null,1,U);K.blocks.push(first)}
  else{const a=avg(w.done),keep=GUT.keep+(1-GUT.keep)*a;
    PARTS[f.id].names.forEach((nm,i)=>{const full=U*SHARE[n][i],b=mkBlock(it,nm,PMULT[n][i],full*keep);K.blocks.push(b);addScrap(full*(1-keep),full*(1-keep)*v*PMULT[n][i],f.id);if(!first)first=b})}
  startSlice(first)}
$('wSkip').addEventListener('click',()=>{if(K.work&&K.work.mode==='gut')finishGut(true)});
$('wDone').addEventListener('click',()=>{const w=K.work;if(!w)return;if(w.mode==='gut'){if(w.done.length>=w.lines.length)finishGut(false)}else finishSlice()});

/* ---------- 썰기 ---------- */
function startSlice(b){if(!b)return kHome();K.work={mode:'slice',b,stroke:null,flash:0};showWork();
  $('wName').textContent=FISH_BY[b.fid].name+(b.part?' '+b.part:'');$('wSkip').hidden=true;$('wDone').textContent='완성';$('wDone').disabled=false;sliceInfo();wDraw()}
function sliceGeom(){const b=K.work.b,u=Math.min(62,(WW-84)/b.w),hu=Math.min(u*1.2,(WH-150)/b.h);return {u,hu,x0:(WW-b.w*u)/2+18,y0:Math.max(54,(WH-b.h*hu)/2-18)}}
const rem=b=>b.h-b.top;
function classify(w){return w<CUT.scrap?'scrap':w<CUT.thin?'thin':w<CUT.normal?'normal':'thick'}
function segs(b){const xs=[0,...b.cuts,b.w],out=[];for(let i=0;i<xs.length-1;i++)out.push({a:xs[i],w:xs[i+1]-xs[i],bad:(i>0&&b.bad[i-1])||(i<b.cuts.length&&b.bad[i])});return out}
function sliceInfo(){const b=K.work.b;$('wInfo').textContent=b.w.toFixed(1)+'조각 분량'+(b.pm!==1?' · 값 ×'+b.pm:'')}
function sliceDraw(){const w=K.work,b=w.b,g=sliceGeom(),{u,hu,x0,y0}=g;board();
  const top=y0+b.top*hu,bot=y0+b.h*hu,nig=rem(b)>=1-1e-9;
  // 이미 잘라낸 윗부분 자리
  if(b.top>0){wx.setLineDash([5,5]);wx.strokeStyle='rgba(23,50,74,.3)';wx.lineWidth=1.5;wx.strokeRect(x0,y0,b.w*u,b.top*hu);wx.setLineDash([])}
  // 덩이
  drawFlesh(wx,x0,top,b.w*u,bot-top,styleOf(b.fid,b.part),b.uid*7919);
  // 니기리 최소 높이
  const my=bot-hu;wx.strokeStyle='#17324a';wx.lineWidth=2;wx.beginPath();wx.moveTo(x0-12,bot);wx.lineTo(x0-20,bot);wx.lineTo(x0-20,my);wx.lineTo(x0-12,my);wx.stroke();
  wx.setLineDash([4,5]);wx.strokeStyle='rgba(23,50,74,.5)';wx.lineWidth=1.5;wx.beginPath();wx.moveTo(x0-12,my);wx.lineTo(x0+b.w*u+8,my);wx.stroke();wx.setLineDash([]);
  wx.save();wx.translate(x0-28,(bot+my)/2);wx.rotate(-Math.PI/2);wx.font="12px Jua, sans-serif";wx.textAlign='center';wx.textBaseline='middle';wx.fillStyle='#17324a';wx.fillText('니기리 최소',0,0);wx.restore();
  // 롤 스틱 최소 두께: 세로로 썰기 전, 뗄 여유가 있을 때만 오른쪽에 표시
  if(!b.cuts.length&&rem(b)>CUT.stick+.1){const xr=x0+b.w*u,ry2=top+CUT.stick*hu;wx.strokeStyle='#1d2a24';wx.lineWidth=2;wx.beginPath();wx.moveTo(xr+10,top);wx.lineTo(xr+18,top);wx.lineTo(xr+18,ry2);wx.lineTo(xr+10,ry2);wx.stroke();
    wx.setLineDash([3,4]);wx.strokeStyle='rgba(29,42,36,.55)';wx.lineWidth=1.5;wx.beginPath();wx.moveTo(x0,ry2);wx.lineTo(xr+10,ry2);wx.stroke();wx.setLineDash([]);
    wx.save();wx.translate(xr+27,(top+ry2)/2+ (ry2-top<46?18:0));wx.rotate(Math.PI/2);wx.font="12px Jua, sans-serif";wx.textAlign='center';wx.textBaseline='middle';wx.fillStyle='#1d2a24';wx.fillText('롤 최소',0,0);wx.restore()}
  // 칼자국과 조각 이름
  wx.font="13px Jua, sans-serif";wx.textAlign='center';wx.textBaseline='middle';
  b.cuts.forEach((c,i)=>{for(const pass of [0,1]){wx.strokeStyle=pass?(b.bad[i]?'#c9452f':'#17324a'):'rgba(255,255,255,.85)';wx.lineWidth=pass?2.5:6;wx.beginPath();if(b.bad[i]){wx.moveTo(x0+c*u-3,top-4);wx.lineTo(x0+c*u+3,(top+bot)/2);wx.lineTo(x0+c*u-2,bot+4)}else{wx.moveTo(x0+c*u,top-4);wx.lineTo(x0+c*u,bot+4)}wx.stroke()}});
  const NM={scrap:'자투리',thin:'얇게',normal:'보통',thick:'두껍게'},CL={scrap:'#8a8f94',thin:'#3b7fc4',normal:'#2fa25c',thick:'#c9781e'};
  if(nig){for(const s of segs(b)){const k=classify(s.w),over=s.w>CUT.thick,t=over?'너무 큼':NM[k],cx=x0+(s.a+s.w/2)*u,tw=wx.measureText(t).width+12;
      wx.fillStyle=over?'#c9452f':CL[k];wx.beginPath();wx.roundRect(cx-tw/2,top-30,tw,20,10);wx.fill();wx.fillStyle='#fff';wx.fillText(t,cx,top-19)}}
  else{const t=(b.cuts.length||rem(b)<CUT.stick)?'자투리':'롤 스틱',cx=x0+b.w*u/2,tw=wx.measureText(t).width+12;wx.fillStyle=t==='자투리'?CL.scrap:'#1d2a24';wx.beginPath();wx.roundRect(cx-tw/2,top-30,tw,20,10);wx.fill();wx.fillStyle='#fff';wx.fillText(t,cx,top-19)}
  if(b.sticks){wx.fillStyle='#1d2a24';wx.textAlign='left';wx.fillText('롤 스틱 '+b.sticks+'개',14,WH-14);wx.textAlign='center'}
  // 두께 기준 자
  const ry=Math.min(WH-34,bot+44),items=[['얇게',CUT.scrap,CUT.thin,CL.thin],['보통',CUT.thin,CUT.normal,CL.normal],['두껍게',CUT.normal,CUT.thick,CL.thick]];

  if(w.flash>0){wx.fillStyle='rgba(201,69,47,'+(.25*w.flash)+')';wx.fillRect(0,0,WW,WH)}

function sliceStroke(st){const w=K.work,b=w.b,{u,hu,x0,y0}=sliceGeom(),top=y0+b.top*hu,bot=y0+b.h*hu;
  let x1=1e9,x2=-1e9,y1=1e9,y2=-1e9,sx=0,sy=0;for(const [x,y] of st){x1=Math.min(x1,x);x2=Math.max(x2,x);y1=Math.min(y1,y);y2=Math.max(y2,y);sx+=x;sy+=y}
  const dx=x2-x1,dy=y2-y1,mx=sx/st.length,my=sy/st.length;
  const bad=()=>{w.flash=1;const t0=performance.now();const f=()=>{if(K.work!==w)return;w.flash=Math.max(0,1-(performance.now()-t0)/350);wDraw();if(w.flash>0)requestAnimationFrame(f)};requestAnimationFrame(f)};
  if(dy>dx*1.5){ // 세로 썰기
    if(Math.min(y2,bot)-Math.max(y1,top)<(bot-top)*.6)return;const c=(mx-x0)/u;if(c<=.08||c>=b.w-.08)return;

  else if(dx>dy*1.5){ // 가로 썰기
    if(Math.min(x2,x0+b.w*u)-Math.max(x1,x0)<b.w*u*.6)return;if(b.cuts.length){bad();return}
    const s=(my-top)/hu;if(s<=.1||s>=rem(b)-.1)return;
    if(s>=CUT.stick){K.sticks.push({uid:K.uid++,fid:b.fid,part:b.part,pm:b.pm,area:b.w*s,value:b.w*s*b.v*b.pm});b.sticks++}else addScrap(b.w*s,b.w*s*b.v*b.pm,b.fid);
    b.top+=s}
}
function finishSlice(){const w=K.work,b=w.b,f=FISH_BY[b.fid],val=u=>u*b.v*b.pm,r=rem(b);
  if(r>=1-1e-9){for(const s of segs(b)){const k=classify(s.w);if(k==='scrap'){addScrap(s.w,val(s.w),b.fid);continue}
      const T=THICK[k];if(s.w>CUT.thick)addScrap(s.w-CUT.thick,val(s.w-CUT.thick),b.fid);
      addSushi({type:'n',name:f.name+(b.part?' '+b.part:'')+' 니기리',thick:k,stars:T.stars-(s.bad?1:0),price:b.v*b.pm*T.price,fx:fxOf(b.fid,b.pm),dur:T.dur,col:[fleshOf(b.fid,b.pm,b.part)],ing:[b.fid]},1)}
    if(r>1)addScrap(b.w*(r-1),val(b.w*(r-1)),b.fid)}

function partLabels(c,f,labels,short){const P=PARTS[f.id],n=P.names.length;c.font=(short?12:14)+"px Jua, sans-serif";c.textAlign='center';c.textBaseline='middle';

function openBook(f){$('bkTier').textContent=TIER[f.tier].name;$('bkTier').style.background=TIER[f.tier].color;$('bkName').textContent=f.name;$('bkSheet').hidden=false;

  const c=can.getContext('2d');c.setTransform(d,0,0,d,0,0);c.fillStyle='#ecd7b4';c.fillRect(0,0,r.width,r.height);
  const n=nParts(f),pcs=PCS[n];let h='';
  if(PARTS[f.id]){const g=partGeom(f,r.width,r.height+64);drawCreature(c,f,g.box.cx,g.box.cy,g.box.bw,g.box.bh);
    c.lineCap='round';c.lineJoin='round';for(const l of g.lines){for(const [col,lw,dash] of [['rgba(23,50,74,.8)',6,[]],['#fff',3,[7,7]]]){c.strokeStyle=col;c.lineWidth=lw;c.setLineDash(dash);c.beginPath();c.moveTo(l[0][0],l[0][1]);for(const p of l)c.lineTo(p[0],p[1]);c.stroke()}}c.setLineDash([]);
    partLabels(c,f,g.labels,true);
    h=PARTS[f.id].names.map((nm,i)=>`<div><b>${nm}</b><span>살의 ${Math.round(SHARE[n][i]*100)}% · 약 ${(pcs*SHARE[n][i]).toFixed(1)}조각</span><i>값 ×${PMULT[n][i]}</i></div>`).join('')}
  else{drawCreature(c,f,r.width/2,r.height/2,r.width-24,r.height-20);
    h=`<div><b>${f.id==='urchin'?'바로 군함':f.id==='yubu'?'바로 유부초밥':'바로 썰기'}</b><span>부위 없음 · ${pcs}조각</span><i>값 ×1</i></div>`}
  $('bkParts').innerHTML=h}
$('grid').addEventListener('click',e=>{const d=e.target.closest('.cell');if(d&&d.dataset.fid)openBook(FISH_BY[d.dataset.fid])});
$('bkX').addEventListener('click',()=>{$('bkSheet').hidden=true});

/* ---------- 탭 ---------- */
function showTab(t){if(t!=='fish'&&S.state!=='idle')return;S.tab=t;
  for(const [id,tab] of [['book','book'],['kitchen','kitchen'],['shop','shop'],['store','store']])$(id).hidden=t!==tab;
  for(const id of ['fishSheet','eatSheet','bkSheet','slotSheet','baitSheet','setSheet','hatSheet'])$(id).hidden=true;

/* ================= 가게와 숍 (3단계) ================= */
const SHOPLV=[{name:'포장마차',slots:4},{name:'작은 가게',slots:6,cost:10000,rev:50,r:0,kinds:5},{name:'동네 맛집',slots:8,cost:50000,rev:200,r:3.5,kinds:12},
  {name:'유명 초밥집',slots:10,cost:250000,rev:600,r:4,kinds:20},{name:'본점',slots:12,cost:1200000,rev:1500,r:4.5,kinds:28}];
const SELL={base:.25,rate:.15,price:.1,egg:1.5,pen:.5,penFrom:.25,hist:60,minN:20};   // minN: 판매가 몇 건 안 될 때 비중이 튀지 않게 하는 최소 분모
const KINDS=34;
const KNIFEUP={prec:{name:'정밀도',price:[500,3000,20000,100000,400000],val:l=>1+.2*l,lab:'허용 오차',fmt:v=>'×'+v.toFixed(1)},
  yld:{name:'수율',price:[5000,60000,400000],val:l=>.6+.1*l,lab:'쓸 수 있는 살',fmt:v=>Math.round(v*100)+'%'}};
const AUTOPRICE=30000;
const SH={lv:0,slots:[null,null,null,null],hist:[],sold:[],reviews:0,kinds:new Set(),log:[]};
S.knife={prec:0,yld:0,auto:false};
function applyKnife(){KNIFE.prec=KNIFEUP.prec.val(S.knife.prec);KNIFE.yield=KNIFEUP.yld.val(S.knife.yld)}

/* 진열 칸은 종류 하나: 니기리는 생선별, 롤·군함·덮밥은 각각 한 칸. 칸 안에는 내가 고른 묶음들이 섞여 있음 */
const catOf=s=>s.type==='n'||s.type==='y'?'n:'+s.ing[0]:s.type;
const catName=c=>c==='r'?'롤':c==='g'?'군함':c==='d'?'덮밥':c==='n:yubu'?'유부초밥':FISH_BY[c.slice(2)].name;
const slotN=sl=>sl.batches.reduce((a,b)=>a+b.count,0);
const fullName=s=>s.name+(s.thick?' · '+THICK[s.thick].name:'');
const rating=()=>SH.hist.length?SH.hist.reduce((a,h)=>a+h,0)/SH.hist.length:3;
function share(cat){return SH.sold.filter(c=>c===cat).length/Math.max(SH.sold.length,SELL.minN)}
function penalty(cat){return 1-SELL.pen*Math.max(0,share(cat)-SELL.penFrom)/(1-SELL.penFrom)}
const priceMul=()=>1+SELL.price*(rating()-3);
const sellPrice=s=>s.price*priceMul()*penalty(catOf(s));
const comeChance=()=>Math.min(1,SELL.base*(1+SELL.rate*(rating()-3))*(1+fx('guest')/100));
const eggW=sl=>sl.cat==='n:tamago'||sl.cat==='n:yubu'?SELL.egg:1;
/* 손님 한 명: 살 개수를 정하고 와서 진열된 것 중 아무거나 집음. 만족 기준도 손님마다 다름 */
SELL.qmax=[3,4,5,6,7];   // 손님 한 명이 사는 최대 개수: 가게 단계마다 하나씩 늘어남
SELL.need=[[2,.15],[3,.30],[4,.35],[5,.20]];SELL.short=[5,3,2,1];
function pickNeed(){let r=Math.random();for(const [q,p] of SELL.need){r-=p;if(r<=0)return q}return 5}
function customer(){const live=()=>SH.slots.filter(Boolean);if(!live().length)return null;
  const want=1+Math.floor(Math.random()*SELL.qmax[SH.lv]),got={};let pay=0,minQ=9,n=0;
  for(let k=0;k<want;k++){const ls=live();if(!ls.length)break;let w=ls.reduce((a,sl)=>a+eggW(sl),0),r=Math.random()*w,sl=ls[0];for(const x of ls){r-=eggW(x);if(r<=0){sl=x;break}}
    let c=Math.random()*slotN(sl),b=sl.batches[0];for(const x of sl.batches){c-=x.count;if(c<0){b=x;break}}
    const p=sellPrice(b);pay+=p;n++;minQ=Math.min(minQ,b.stars);got[catName(sl.cat)]=(got[catName(sl.cat)]||0)+1;
    SH.sold.push(sl.cat);if(SH.sold.length>SELL.hist)SH.sold.shift();for(const g of b.ing||[])SH.kinds.add(g);
    b.total-=b.price;if(--b.count<=0){sl.batches.splice(sl.batches.indexOf(b),1);if(!sl.batches.length)SH.slots[SH.slots.indexOf(sl)]=null}}
  if(!n)return null;const need=pickNeed(),rev=SELL.short[Math.min(3,Math.max(0,need-minQ))];
  SH.hist.push(rev);if(SH.hist.length>SELL.hist)SH.hist.shift();SH.reviews++;S.money+=pay;
  SH.log.unshift('★'+rev+' · '+Object.entries(got).map(([k,v])=>k+' '+v).join(', ')+'  +'+money(pay));if(SH.log.length>8)SH.log.pop();
  return {pay,n}}
/* 손님은 찌가 물에 떠 있는 동안에만 옴. 던질 때 이번에 올 손님 수를 정하고(진열 칸마다 한 번씩 추첨), 기다리는 시간 안에 흩어서 도착시킴.
   손님 수가 기다리는 시간 길이와 상관없어서, 입질 속도를 올려도 파는 양은 줄지 않음 */
function planGuests(wait){const n=SH.slots.filter(Boolean).length,p=comeChance(),out=[];for(let i=0;i<n;i++)if(Math.random()<p)out.push(Math.min(Math.max(.15,wait-.1),.3+Math.random()*Math.max(0,wait-.6)));
  S.guests=out.sort((a,b)=>a-b);S.waitT=0;S.castSale={total:0,cnt:0,ppl:0}}
function guestTick(dt){S.waitT+=dt;let hit=false;while(S.guests&&S.guests.length&&S.guests[0]<=S.waitT){S.guests.shift();const r=customer();if(r){const q=S.castSale;q.total+=r.pay;q.cnt+=r.n;q.ppl++;hit=true}}
  if(hit){const q=S.castSale;setMoney();toast('+'+money(q.total)+' · 손님 '+q.ppl+'명, '+q.cnt+'개',1800)}}

/* ---------- 특별 주문 ---------- */
const ORD={bonus:1.2,chance:.05,        // 평소 값의 1.2배, 빈 자리가 있을 때 입질마다 새 주문이 올 확률
  slots:[1,1,2,2,3],                     // 가게 단계별 동시에 받을 수 있는 주문 수
  grade:[{tiers:'c',q:3,name:'동네 손님'},{tiers:'cu',q:3,rev:30,r:3.5,lv:0,name:'단골'},{tiers:'cure',q:4,rev:150,r:4,lv:1,name:'미식가'},
         {tiers:'curev',q:4,rev:500,r:4.3,lv:2,name:'큰손'},{tiers:'curevl',q:4,rev:1200,r:4.5,lv:3,name:'귀빈'}],
  cap:{c:9,e:9,u:9,r:4,v:3,l:2}};
SH.orders=[];SH.newOrder=false;
function orderGrade(){const R=rating();let g=0;for(let i=1;i<ORD.grade.length;i++){const G=ORD.grade[i];if(SH.reviews>=G.rev&&R>=G.r&&SH.lv>=G.lv)g=i;else break}return g}
function newOrder(){const g=orderGrade(),G=ORD.grade[g],top=G.tiers[G.tiers.length-1];
  const pool=FISH.filter(f=>S.rods[f.rod].own&&G.tiers.includes(f.tier)&&!SH.orders.some(o=>o.fid===f.id));if(!pool.length)return null;
  let w=pool.reduce((a,f)=>a+(f.tier===top?2:1),0),r=Math.random()*w,f=pool[0];for(const x of pool){r-=x.tier===top?2:1;if(r<=0){f=x;break}}
  const n=Math.min(ORD.cap[f.tier],2+Math.floor(Math.random()*(3+SH.lv)));return {uid:K.uid++,fid:f.id,n,q:G.q,grade:g}}
const orderName=o=>o.fid==='urchin'?'성게 군함':o.fid==='yubu'?'유부초밥':FISH_BY[o.fid].name+' 니기리';
/* 주문에 낼 수 있는 초밥: 보관함에 있는 그 생선의 니기리(성게는 군함) 중 품질 기준 이상. 품질이 낮은 것부터 냄 */
function orderStock(o){return K.sushi.filter(s=>s.type!=='r'&&s.type!=='d'&&s.ing&&s.ing[0]===o.fid&&s.stars>=o.q).sort((a,b)=>a.stars-b.stars||a.price-b.price)}
const orderHave=o=>orderStock(o).reduce((a,s)=>a+s.count,0);
/* 받을 돈: 낼 수 있으면 실제로 나갈 초밥 기준, 아직 모자라면 보통 크기 생선의 보통 두께 기준 어림값 */
function orderPay(o){if(orderHave(o)>=o.n){let need=o.n,pay=0;for(const s of orderStock(o)){const k=Math.min(need,s.count);pay+=s.price*k;need-=k;if(!need)break}return [pay*priceMul()*ORD.bonus,true]}
  const f=FISH_BY[o.fid];return [f.price*1.2*2/PCS[nParts(f)]*o.n*priceMul()*ORD.bonus,false]}
function orderTick(){if(SH.orders.length<ORD.slots[SH.lv]&&Math.random()<ORD.chance){const o=newOrder();if(o){SH.orders.push(o);SH.newOrder=true;$('shopDot').hidden=false}}}
function fillOrder(o){if(orderHave(o)<o.n)return;let need=o.n;const pay=orderPay(o)[0];
  for(const s of orderStock(o)){const k=Math.min(need,s.count);s.total-=s.price*k;s.count-=k;need-=k;if(s.count<=0)K.sushi.splice(K.sushi.indexOf(s),1);if(!need)break}
  S.money+=pay;SH.kinds.add(o.fid);SH.hist.push(5);if(SH.hist.length>SELL.hist)SH.hist.shift();SH.reviews++;
  SH.log.unshift('★5 · 특별 주문 '+orderName(o)+' '+o.n+'  +'+money(pay));if(SH.log.length>8)SH.log.pop();SH.orders.splice(SH.orders.indexOf(o),1);setMoney();drawFx()}
function ordersHTML(){const g=orderGrade(),G=ORD.grade[g],nx=ORD.grade[g+1];
  let h=`<h3>특별 주문 <small>${G.name} 등급 · ${SH.orders.length} / ${ORD.slots[SH.lv]}건</small></h3>`;
  h+=SH.orders.length?SH.orders.map(o=>{const have=Math.min(o.n,orderHave(o)),f=FISH_BY[o.fid],[pay,exact]=orderPay(o);
    return `<div class="ord"><canvas data-fid="${o.fid}"></canvas><div><b>${orderName(o)} ${o.n}개</b><i>품질 <span class="star">★${o.q}</span> 이상 · ${exact?'':'약 '}${money(pay)} · <span style="color:${TIER[f.tier].color}">${TIER[f.tier].name}</span></i><i>보관함에 ${have} / ${o.n}개</i></div><div class="r"><button type="button" data-ofill="${o.uid}" ${have>=o.n?'':'disabled'}>전달</button><button type="button" class="no" data-odrop="${o.uid}">거절</button></div></div>`}).join(''):'<div class="empty">낚시하다 보면 주문이 들어와요</div>';
  if(nx)h+=`<div class="onext">다음 등급 ${nx.name}: 손님 평가 ${nx.rev}건, 평점 ${nx.r.toFixed(1)}${nx.lv?', '+SHOPLV[nx.lv].name+' 이상':''}</div>`;
  return h}

/* ---------- 가게 화면 ---------- */
function reqs(){const nx=SHOPLV[SH.lv+1];if(!nx)return null;const R=rating();
  return [['손님 평가 '+SH.reviews+' / '+nx.rev,SH.reviews>=nx.rev],['재료 '+SH.kinds.size+' / '+nx.kinds+'종',SH.kinds.size>=nx.kinds]].concat(nx.r?[['평점 '+R.toFixed(1)+' / '+nx.r.toFixed(1),R>=nx.r]]:[]).concat([[money(nx.cost),S.money>=nx.cost]])}
function shopHome(){const el=$('sHome'),L=SHOPLV[SH.lv],R=rating(),rq=reqs();$('sMoney').textContent=money(S.money);
  let h=`<div class="panel"><div class="ptop"><b>${L.name}</b><span class="star">★ ${R.toFixed(1)}</span></div>
    <div class="pinfo"><span>손님 평가 ${SH.reviews}건</span><span>판 재료 ${SH.kinds.size} / ${KINDS}종</span><span>값 ×${priceMul().toFixed(2)}</span><span>손님 1명 1~${SELL.qmax[SH.lv]}개</span></div>`;
  if(rq)h+=`<div class="req">${rq.map(([t,ok])=>`<span class="${ok?'ok':''}">${ok?'✓':'·'} ${t}</span>`).join('')}</div><button type="button" class="act" data-lvup ${rq.every(r=>r[1])?'':'disabled'}>${SHOPLV[SH.lv+1].name}(으)로 키우기 · 진열 ${SHOPLV[SH.lv+1].slots}칸, 손님 1~${SELL.qmax[SH.lv+1]}개</button>`;
  h+=`</div>`+ordersHTML()+`<h3>진열대 <small>${SH.slots.filter(Boolean).length} / ${L.slots}칸</small></h3><div class="slots">`+SH.slots.map((sl,i)=>{if(!sl)return `<button type="button" class="emp" data-slot="${i}">+</button>`;
    const n=slotN(sl),q={};sl.batches.forEach(b=>q[b.stars]=(q[b.stars]||0)+b.count);const avg=sl.batches.reduce((a,b)=>a+sellPrice(b)*b.count,0)/n;
    return `<button type="button" data-slot="${i}"><canvas data-di="${i}"></canvas><b>${catName(sl.cat)}</b><i>${Object.keys(q).sort().reverse().map(k=>`<span class="star">★${k}</span>×${q[k]}`).join(' ')}</i><i>평균 ${money(avg)}${penalty(sl.cat)<.999?' <em>↓</em>':''}</i><u>×${n}</u></button>`}).join('')+`</div>`;
  if(SH.log.length)h+=`<h3>최근 손님</h3><div class="log">${SH.log.map(l=>`<div>${l}</div>`).join('')}</div>`;
  SH.newOrder=false;$('shopDot').hidden=true;
  el.innerHTML=h;el.querySelectorAll('canvas[data-fid]').forEach(cn=>drawArt(cn,FISH_BY[cn.dataset.fid]));el.querySelectorAll('canvas[data-di]').forEach(cn=>drawSushi(cn,SH.slots[+cn.dataset.di].batches[0]))}
function putBatch(i,s){K.sushi.splice(K.sushi.indexOf(s),1);let sl=SH.slots[i];if(!sl)sl=SH.slots[i]={cat:catOf(s),batches:[]};
  const t=sl.batches.find(x=>x.key===s.key);if(t){t.count+=s.count;t.total+=s.total;t.price=t.total/t.count}else sl.batches.push(s)}
function takeBatch(i,key){const sl=SH.slots[i];if(!sl)return;const b=sl.batches.find(x=>x.key===key);if(!b)return;sl.batches.splice(sl.batches.indexOf(b),1);if(!sl.batches.length)SH.slots[i]=null;
  const t=K.sushi.find(x=>x.key===b.key);if(t){t.count+=b.count;t.total+=b.total;t.price=t.total/t.count}else K.sushi.push(b)}
/* 칸을 누르면 뜨는 창: 진열 중인 묶음은 내리고, 보관함의 묶음은 골라서 추가 */
function slotSheet(){const i=SH.pick,sl=SH.slots[i],used=SH.slots.filter((x,k)=>x&&k!==i).map(x=>x.cat);
  $('slName').textContent=sl?catName(sl.cat)+' 칸':'빈 칸';
  const can=K.sushi.map((s,k)=>[s,k]).filter(([s])=>sl?catOf(s)===sl.cat:!used.includes(catOf(s)));
  let h='';if(sl)h+='<h4>진열 중</h4>'+sl.batches.map((b,k)=>sushiRow(b,'d'+k,'내리기','take')).join('');
  h+='<h4>보관함</h4>'+(can.length?can.map(([s,k])=>sushiRow(s,k,'추가','put')).join(''):`<div class="empty">${sl?'이 칸에 더 올릴 '+catName(sl.cat)+'이(가) 없어요':K.sushi.length?'남은 초밥은 이미 다른 칸에 있는 종류예요':'올릴 초밥이 없어요'}</div>`);
  const l=$('slList');l.innerHTML=h;l.querySelectorAll('canvas[data-si]').forEach(cn=>{const v=cn.dataset.si;drawSushi(cn,v[0]==='d'?sl.batches[+v.slice(1)]:K.sushi[+v])})}
$('sHome').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.ofill){const o=SH.orders.find(x=>x.uid==d.ofill);if(o)fillOrder(o);shopHome()}
  else if(d.odrop){SH.orders=SH.orders.filter(x=>x.uid!=d.odrop);shopHome()}
  else if(d.slot!==undefined){SH.pick=+d.slot;$('slotSheet').hidden=false;slotSheet()}
  else if('lvup' in d){const nx=SHOPLV[SH.lv+1],rq=reqs();if(!nx||!rq.every(r=>r[1]))return;S.money-=nx.cost;SH.lv++;while(SH.slots.length<nx.slots)SH.slots.push(null);setMoney();shopHome()}});
$('slList').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.put){const s=K.sushi.find(x=>x.key===d.put);if(s)putBatch(SH.pick,s)}else if(d.take)takeBatch(SH.pick,d.take);slotSheet();shopHome()});
$('slX').addEventListener('click',()=>{$('slotSheet').hidden=true});

/* ---------- 숍 화면 ---------- */
const pips=(l,m)=>'●'.repeat(l)+'○'.repeat(m-l);
function upRow(name,l,max,now,next,price,attr,note){const full=l>=max;
  return `<div class="urow"><div><b>${name} <span class="pip">${pips(l,max)}</span></b><i>${now}${full?'':' → '+next}${note?' · '+note:''}</i></div>${full?'<span class="max">최대</span>':`<button type="button" ${attr} ${S.money>=price?'':'disabled'}>${money(price)}</button>`}</div>`}
function storeHome(){const el=$('tHome');$('tMoney').textContent=money(S.money);let h='';
  S.rods.forEach((r,i)=>{h+=`<h3>${ROD[i].name} 낚싯대</h3>`;
    if(!r.own){const can=i===0||S.rods[i-1].own;h+=`<div class="urow"><div><b>${ROD[i].name} 낚싯대</b><i>${can?FISH.filter(f=>f.rod===i).length+'종을 새로 잡을 수 있어요':ROD[i-1].name+' 낚싯대를 먼저 사야 해요'}</i></div><button type="button" data-rod="${i}" ${can&&S.money>=RODPRICE[i]?'':'disabled'}>${money(RODPRICE[i])}</button></div>`;return}
